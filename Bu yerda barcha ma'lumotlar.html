<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Barcha savol-javoblar</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; min-height: 100%; }
body {
    font-family: 'Segoe UI', 'Arial', sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #161616, #0a0a0a 60%);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
    min-height: 100dvh;
}

/* ===== Yulduzlar foni ===== */
#stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
}
.star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2.5s infinite ease-in-out;
}
.star.glow {
    box-shadow: 0 0 6px 1px rgba(255, 215, 0, 0.5);
}
@keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.6); }
}

/* ===== Oltin nishon (badge) ===== */
.gold-badge {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2e2e2e, #0f0f0f 70%);
    border: 3px solid #ffd700;
    box-shadow: 0 0 18px rgba(255,215,0,0.55), 0 0 40px rgba(255,215,0,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    margin-bottom: -8px;
    position: relative; z-index: 3;
}

/* ===== Asosiy karta ===== */
.wrap {
    position: relative; z-index: 2;
    width: 100%; max-width: 750px;
    display: flex; flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 45px 30px 35px 30px;
    background: linear-gradient(160deg, rgba(16,16,16,0.55), rgba(10,10,10,0.55));
    backdrop-filter: blur(1px);
    border: 2px solid #ffd700;
    border-radius: 26px;
    box-shadow: 0 0 30px rgba(255,215,0,0.22), inset 0 0 40px rgba(255,215,0,0.03);
}

h1 {
    font-size: 22px; color: #ffffff; text-align: center;
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(255,255,255,0.3);
    width: 100%;
}

/* ===== Yashil neon "Tanlanganlar" paneli ===== */
.neon-bar {
    width: 100%;
    background: linear-gradient(135deg, #0f1a15, #131313);
    border: 2px solid #00ff99;
    color: #00ff99;
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.25s;
    text-shadow: 0 0 10px rgba(0,255,153,0.8);
    box-shadow: 0 0 14px rgba(0,255,153,0.35), inset 0 0 18px rgba(0,255,153,0.06);
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.neon-bar:hover {
    background: #00ff99;
    color: #050505;
    text-shadow: none;
    box-shadow: 0 0 25px rgba(0,255,153,0.9);
    transform: scale(1.015);
}
.neon-bar.back-mode {
    border-color: #ffd700;
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255,215,0,0.8);
    box-shadow: 0 0 14px rgba(255,215,0,0.35), inset 0 0 18px rgba(255,215,0,0.06);
}
.neon-bar.back-mode:hover {
    background: #ffd700;
    color: #050505;
    text-shadow: none;
    box-shadow: 0 0 25px rgba(255,215,0,0.9);
}

.list-search {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 2px solid #333;
    background: #1b1b1b;
    color: white;
    font-size: 15px;
    outline: none;
}
.list-search:focus { border-color: #00ff99; }
.list-counter { color: #999; font-size: 13px; text-align: center; }
.qa-list { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.qa-card {
    position: relative;
    background: #1b1b1b;
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 16px;
    padding: 18px 60px 18px 20px;
    box-shadow: 0 0 15px rgba(0,255,150,0.06);
    transition: 0.25s;
}
.qa-card.selected {
    border-color: #00ff99;
    box-shadow: 0 0 18px rgba(0,255,150,0.25);
    background: #17211c;
}
.qa-num {
    display: inline-block;
    color: #050505;
    background: #ffd700;
    font-size: 12px;
    font-weight: bold;
    border-radius: 8px;
    padding: 2px 9px;
    margin-bottom: 8px;
}
.qa-add-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid #00ff99;
    background: transparent;
    color: #00ff99;
    font-size: 18px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.25s;
}
.qa-add-btn:hover {
    background: #00ff99;
    color: #050505;
    transform: scale(1.1);
}
.qa-add-btn.selected {
    background: #00ff99;
    color: #050505;
    box-shadow: 0 0 12px rgba(0,255,150,0.7);
}
.qa-question { color: #f0f0f0; font-size: 15.5px; line-height: 1.5; font-weight: bold; margin-bottom: 10px; }
.qa-answer {
    color: #00ff99;
    font-size: 14.5px;
    line-height: 1.5;
    border-top: 1px dashed rgba(0,255,153,0.25);
    padding-top: 10px;
}
.qa-answer b { color: #ffd700; }
.list-toolbar {
    width: 100%;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
}
.list-clear-selected {
    background: transparent;
    border: none;
    color: #666;
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
}
.list-clear-selected:hover { color: #ff4d4d; }
@media (max-width: 480px) {
    body { padding: 12px; }
    .wrap { padding: 35px 16px 24px 16px; }
    h1 { font-size: 19px; }
    .gold-badge { width: 68px; height: 68px; font-size: 30px; }
    .neon-bar { font-size: 14px; padding: 12px 10px; }
}
</style>
</head>
<body>
<div id="stars"></div>
<div class="wrap">
    <div class="gold-badge">📋</div>
    <h1 id="pageTitle">📋 Barcha savol-javoblar</h1>

    <button class="neon-bar" id="tabSelected" onclick="toggleTab()">⭐ Tanlanganlar (<span id="selCount">0</span>)</button>

    <input type="text" class="list-search" id="listSearch" placeholder="Savol bo'yicha qidirish..." oninput="renderList()">
    <div class="list-toolbar" id="selectedToolbar" style="display:none;">
        <div class="list-counter" id="listCounter" style="text-align:left;"></div>
        <button class="list-clear-selected" onclick="clearSelected()">Hammasini tozalash</button>
    </div>
    <div class="list-counter" id="listCounterAll"></div>
    <div class="qa-list" id="qaList"></div>
</div>

const SELECTED_KEY = 'quizSelectedIndices_barcha';
let currentTab = 'all';

function getSelectedIndices() {
    try {
        return JSON.parse(localStorage.getItem(SELECTED_KEY) || '[]');
    } catch (e) {
        return [];
    }
}

function saveSelectedIndices(arr) {
    localStorage.setItem(SELECTED_KEY, JSON.stringify(arr));
    updateSelCount();
}

function updateSelCount() {
    document.getElementById('selCount').innerText = getSelectedIndices().length;
}

function toggleSelected(idx) {
    let selected = getSelectedIndices();
    if (selected.includes(idx)) {
        selected = selected.filter(i => i !== idx);
    } else {
        selected.push(idx);
    }
    saveSelectedIndices(selected);
    renderList();
}

function clearSelected() {
    saveSelectedIndices([]);
    renderList();
}

function toggleTab() {
    currentTab = (currentTab === 'all') ? 'selected' : 'all';
    const btn = document.getElementById('tabSelected');
    if (currentTab === 'selected') {
        btn.classList.add('back-mode');
        btn.innerHTML = '← Barchasiga qaytish';
        document.getElementById('pageTitle').innerText = '⭐ Tanlangan savollarim';
        document.getElementById('selectedToolbar').style.display = 'flex';
        document.getElementById('listCounterAll').style.display = 'none';
    } else {
        btn.classList.remove('back-mode');
        btn.innerHTML = '⭐ Tanlanganlar (<span id="selCount">0</span>)';
        document.getElementById('pageTitle').innerText = '📋 Barcha savol-javoblar';
        document.getElementById('selectedToolbar').style.display = 'none';
        document.getElementById('listCounterAll').style.display = 'block';
    }
    document.getElementById('listSearch').value = '';
    updateSelCount();
    renderList();
}

function renderList() {
    const query = document.getElementById('listSearch').value.trim().toLowerCase();
    const container = document.getElementById('qaList');
    container.innerHTML = '';
    const selected = getSelectedIndices();

    let source = quizData.map((item, idx) => ({ item, idx }));
    if (currentTab === 'selected') {
        source = source.filter(({ idx }) => selected.includes(idx));
    }

    const filtered = source.filter(({ item }) => item.q.toLowerCase().includes(query));

    if (currentTab === 'all') {
        document.getElementById('listCounterAll').innerText = `${filtered.length} / ${quizData.length} ta savol`;
    } else {
        document.getElementById('listCounter').innerText = `${filtered.length} ta savol tanlangan`;
        if (filtered.length === 0) {
            container.innerHTML = `<div style="color:#666; text-align:center; padding:30px;">Hali hech qanday savol tanlanmagan.<br>"⭐ Tanlanganlar" tugmasidan orqaga qaytib, + tugmasi bilan qo'shing.</div>`;
            return;
        }
    }

    filtered.forEach(({ item, idx }) => {
        const isSelected = selected.includes(idx);
        const card = document.createElement('div');
        card.className = 'qa-card' + (isSelected ? ' selected' : '');
        card.innerHTML = `
            <span class="qa-num">${idx + 1}</span>
            <div class="qa-question">${item.q}</div>
            <div class="qa-answer"><b>Javob:</b> ${item.correct}</div>
            <button class="qa-add-btn ${isSelected ? 'selected' : ''}" title="${isSelected ? 'Tanlovdan olib tashlash' : 'Tanlash'}">${isSelected ? '✓' : '+'}</button>
        `;
        card.querySelector('.qa-add-btn').onclick = () => toggleSelected(idx);
        container.appendChild(card);
    });
}

function buildStars() {
    const container = document.getElementById('stars');
    container.innerHTML = '';
    const count = 130;
    for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        const isGlow = Math.random() > 0.8;
        s.className = 'star' + (isGlow ? ' glow' : '');
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        const size = (isGlow ? (Math.random() * 1.5 + 2) : (Math.random() * 2 + 1)).toFixed(1);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.animationDelay = (Math.random() * 2.5).toFixed(2) + 's';
        s.style.animationDuration = (1.5 + Math.random() * 2).toFixed(2) + 's';
        container.appendChild(s);
    }
}

buildStars();
updateSelCount();
renderList();
</script>
