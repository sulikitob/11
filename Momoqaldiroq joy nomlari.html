<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Joy va qishloq nomlari</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; min-height: 100%; }
body {
    font-family: 'Segoe UI', 'Arial', sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #161616, #0a0a0a 60%);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
    min-height: 100dvh;
}

#stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
}
.star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2.5s infinite ease-in-out;
}
.star.glow {
    box-shadow: 0 0 6px 1px rgba(255, 215, 0, 0.5);
}
@keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.6); }
}

.gold-badge {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2e2e2e, #0f0f0f 70%);
    border: 3px solid #ffd700;
    box-shadow: 0 0 18px rgba(255,215,0,0.55), 0 0 40px rgba(255,215,0,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    margin-bottom: -8px;
    position: relative; z-index: 3;
}

.wrap {
    position: relative; z-index: 2;
    width: 100%; max-width: 750px;
    display: flex; flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 45px 30px 35px 30px;
    background: linear-gradient(160deg, rgba(16,16,16,0.55), rgba(10,10,10,0.55));
    backdrop-filter: blur(1px);
    border: 2px solid #ffd700;
    border-radius: 26px;
    box-shadow: 0 0 30px rgba(255,215,0,0.22), inset 0 0 40px rgba(255,215,0,0.03);
}

h1 {
    font-size: 22px; color: #ffffff; text-align: center;
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(255,255,255,0.3);
    width: 100%;
}
p.sub { color: #999; font-size: 13px; text-align: center; margin-top: -10px; }

.list-search {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 2px solid #333;
    background: #1b1b1b;
    color: white;
    font-size: 15px;
    outline: none;
}
.list-search:focus { border-color: #00ff99; }
.list-counter { color: #999; font-size: 13px; text-align: center; }

.qa-list { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.qa-card {
    position: relative;
    background: linear-gradient(150deg, #1c1c1c, #141414);
    border: 1px solid rgba(0, 255, 153, 0.28);
    border-radius: 16px;
    padding: 18px 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    transition: 0.25s;
}
.qa-card:hover {
    border-color: rgba(0,255,153,0.6);
    box-shadow: 0 0 18px rgba(0,255,153,0.15);
}
.qa-num {
    display: inline-block;
    color: #050505;
    background: #00ff99;
    font-size: 12px;
    font-weight: bold;
    border-radius: 8px;
    padding: 2px 9px;
    margin-bottom: 8px;
}
.qa-question { color: #f0f0f0; font-size: 15.5px; line-height: 1.5; font-style: italic; margin-bottom: 10px; }
.qa-answer {
    color: #00ff99;
    font-size: 16px;
    font-weight: bold;
    border-top: 1px dashed rgba(0,255,153,0.25);
    padding-top: 10px;
}
.qa-answer b { color: #ffd700; }

.bob-title {
    width: 100%;
    text-align: left;
    color: #ffd700;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.5px;
    margin-top: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(255,215,0,0.25);
}

@media (max-width: 480px) {
    body { padding: 12px; }
    .wrap { padding: 35px 16px 24px 16px; }
    h1 { font-size: 19px; }
    .gold-badge { width: 68px; height: 68px; font-size: 30px; }
}
</style>
</head>
<body>
<div id="stars"></div>
<div class="wrap">
    <div class="gold-badge">📍</div>
    <h1>📍 Joy va qishloq nomlari</h1>
    <p class="sub">"Qayer?", "qayerlik?", "qaysi tuman/shahar/qishloq?" so'rog'iga javob beruvchi barcha savol-javoblar</p>

    <input type="text" class="list-search" id="listSearch" placeholder="Joy nomi yoki savol bo'yicha qidirish..." oninput="renderList()">
    <div class="list-counter" id="listCounterAll"></div>
    <div class="qa-list" id="qaList"></div>
</div>

<script>
const joylar = [
{ bob: "1-Bob", q: "Qishloqning nomi nima?", a: "Jiydalik" },
{ bob: "1-Bob", q: "Iskandar qayerdan kelayotgan edi?", a: "Toshkentdan" },

{ bob: "2-Bob", q: "Xoji bobo va xotini Toshkentning qayerida yashab ketishgan edi?", a: "Zarangning xuv bir gadoy topmas tog' qishlog'idan, lekin indamasangiz Londonu Parijdan lof urishadi" },
{ bob: "2-Bob", q: "Bir vaqtlar harbiylar qal'asi sanalgan shaharning qoq markazida, chorak gektarcha keladigan, gulu-gulzor bog'i, otxonayu molxonasi bor joy qayer?", a: "Xoji boboning chorbog'i" },
{ bob: "2-Bob", q: "Iskandarning yashaydigan tumani o'sha paytda qayer edi?", a: "Jiydali" },
{ bob: "2-Bob", q: "Shahar qancha vaqtlik yo'l?", a: "Yarim soatlik" },

{ bob: "3-Bob (Oyravshan-1)", q: "Oyravshan qayerlik?", a: "Jiydali" },
{ bob: "3-Bob (Oyravshan-1)", q: "Oyravshan Jiydalini qaysi mahallasidan?", a: "Oqtuproq" },
{ bob: "3-Bob (Oyravshan-1)", q: "Opa vafot etganida oyravshan qayerda edi?", a: "Issiqko'lda" },
{ bob: "3-Bob (Oyravshan-1)", q: "Uzun-yuluq xabarlarga ko'ra Dilya hozir qayerda o'qirkan?", a: "Samarqandda" },
{ bob: "3-Bob (Oyravshan-1)", q: "Opaning maktubini oyravshan qayerda oldi?", a: "Toshkentda" },

{ bob: "4-Bob (G'ayrat-1)", q: "Juma daroz qayerlik?", a: "Toshovuzlik" },
{ bob: "4-Bob (G'ayrat-1)", q: "G'ayrat qayerdan xat oldi?", a: "Toshkentdan" },
{ bob: "4-Bob (G'ayrat-1)", q: "Jumaniyoz qayerga boshqarmaga zam bo'lada?", a: "Toshkentdagi" },

{ bob: "5-Bob (Oyravshan-3)", q: "2 hafta burun qayerga o'tganida Tamaraga odmiroq bir shisha atir-u bolalariga qand-qurs sovg'a qilib kelgandan keyin yonidan nari ketmaydi?", a: "Toshkent" },
{ bob: "5-Bob (Oyravshan-3)", q: "Jiydaliga yaqin tutash tuman qaysi?", a: "Zarang" },
{ bob: "5-Bob (Oyravshan-3)", q: "Jiydali va Zarangning o'rtasida nima bor?", a: "Tog' tizmasi" },
{ bob: "5-Bob (Oyravshan-3)", q: "Shimolda tog'lar qurshovida joylashgan qayer?", a: "Jiydali" },
{ bob: "5-Bob (Oyravshan-3)", q: "Etakda yassi adirliklar-u poyonsiz ekinzorlar bag'rida qayer?", a: "Zarang" },
{ bob: "5-Bob (Oyravshan-3)", q: "Tog'li joyda iqlimi past, paxta o'smaydi, ekin maydoni ham yo'q, shu bois eli kam daromad, kam xarj yashaydigan qayer?", a: "Jiydali" },
{ bob: "5-Bob (Oyravshan-3)", q: "Rais qaysi tumandan edi?", a: "Zarang" },
{ bob: "5-Bob (Oyravshan-3)", q: "Aybi mo'lroq tuman qaysi biri?", a: "Jiydali" },
{ bob: "5-Bob (Oyravshan-3)", q: "\"Soya-salqinligi, to'g'ri tog'-u toshi, ko'rkam odamlari, archazorlarimizning bo'yu tarovati\" - ana hamma gap shunda, bu yer qayer?", a: "Jiydali" },
{ bob: "5-Bob (Oyravshan-3)", q: "Oyravshanning yolg'iz ukasi qayerda, dom-daraksiz?", a: "Rossiyada" },

{ bob: "6-Bob", q: "To'yxona shahxarning chekkasida ayni muddao nomi nima edi?", a: "Dongdor" },
{ bob: "6-Bob", q: "Rais boni ko'pincha o'rganib qolgan manzili qayerga tushadi?", a: "Eski hayvonot bog'idagi so'lim bir go'shada joylashgan hukumat mehmonxonasiga" },
{ bob: "6-Bob", q: "Rais bobo Oyravshanga ijarada turganini bilgach qayerdan uy olib beradi?", a: "Qorasuvdagi dahadan 3 qavatda joylashgan 2 bo'lmali xonadon" },

{ bob: "7-Bob (G'ayrat-2)", q: "Emine xonim qayerlik edi?", a: "Qrim" },
{ bob: "7-Bob (G'ayrat-2)", q: "Badjahl kampirning qayerga tushib ketgan to'ng'ich qizining o'g'li edi Jobir otarchi?", a: "Bo'stonliqqa" },
{ bob: "7-Bob (G'ayrat-2)", q: "Jumaniyoz G'ayratga qayerga qochishni maslahat beradi?", a: "Tyumenga" },
{ bob: "7-Bob (G'ayrat-2)", q: "Qayerning Bo'zsuv bo'yidagi ko'rkam o'z davrida hashamatli sanalgan hovliga G'ayrat ko'p kelgan?", a: "Yunusobod" },

{ bob: "8-Bob (Oyravshan-4)", q: "Benuqson qayerda, qanday domda yashovchi fan nomzodi edi?", a: "Sergilida" },
{ bob: "8-Bob (Oyravshan-4)", q: "Lazizbek Ikromovichning koshonasi qayerda joylashgan edi?", a: "Do'nglikning tepasida" },
{ bob: "8-Bob (Oyravshan-4)", q: "Issiqko'l nima deb atalardi?", a: "Dilorom" },
{ bob: "8-Bob (Oyravshan-4)", q: "Oyravshan Rais bobo bilan oxirgi marta qayerda ko'rishadi?", a: "Yassi tepalikda, yakka gujum ostida" },
{ bob: "8-Bob (Oyravshan-4)", q: "Oyravshanning o'g'ilchasi hozir qayerda edi?", a: "Qishloqda, bobosinikida" },
{ bob: "8-Bob (Oyravshan-4)", q: "Oyravshan shuncha joydan poyi-piyoda, xorib-xarsillab, qaysi joyning shoh bekatiga kelib, Toshkentga ketadigan oxirgi avtobusga ilinadi?", a: "G'azalkent" },
{ bob: "8-Bob (Oyravshan-4)", q: "Ertasi, yakshanba kuni Oyravshan turib qaysi bozorga sarpo olishga tushdi?", a: "Eski Jo'va" },

{ bob: "9-Bob (Iskandar-2)", q: "Zo'rbank qayerda joylashgan?", a: "Chilonzorda" },
{ bob: "9-Bob (Iskandar-2)", q: "Lazizbekning Oqtoshdagi dachasining nomi nima?", a: "Panorama" },
{ bob: "9-Bob (Iskandar-2)", q: "Saxiy-serpul qaynota kuyovga qaysi kvartirani sovg'a qilgan edi?", a: "Gabus" },
{ bob: "9-Bob (Iskandar-2)", q: "Quda Lazizbek Qodirov qo'l yetmas qaysi tarafga qochdi?", a: "Qibris" },

{ bob: "10-Bob (Ta'ziya)", q: "Xoji bobo Zarangda qayerda kotib edi?", a: "Dashtobodda" },
{ bob: "10-Bob (Ta'ziya)", q: "Xoji bobo oliy partiya maktabidan keyin qayerga borib tushgan?", a: "Toshkentga, Markazqo'mga" },
];

function buildStars() {
    const container = document.getElementById('stars');
    container.innerHTML = '';
    const count = 130;
    for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        const isGlow = Math.random() > 0.8;
        s.className = 'star' + (isGlow ? ' glow' : '');
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        const size = (isGlow ? (Math.random() * 1.5 + 2) : (Math.random() * 2 + 1)).toFixed(1);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.animationDelay = (Math.random() * 2.5).toFixed(2) + 's';
        s.style.animationDuration = (1.5 + Math.random() * 2).toFixed(2) + 's';
        container.appendChild(s);
    }
}

function renderList() {
    const query = document.getElementById('listSearch').value.trim().toLowerCase();
    const container = document.getElementById('qaList');
    container.innerHTML = '';

    const filtered = joylar
        .map((item, idx) => ({ item, idx }))
        .filter(({ item }) => (item.q + ' ' + item.a).toLowerCase().includes(query));

    document.getElementById('listCounterAll').innerText = `${filtered.length} / ${joylar.length} ta joy nomi savoli`;

    let lastBob = null;
    filtered.forEach(({ item, idx }) => {
        if (item.bob !== lastBob && query === '') {
            const bobEl = document.createElement('div');
            bobEl.className = 'bob-title';
            bobEl.innerText = item.bob;
            container.appendChild(bobEl);
            lastBob = item.bob;
        }
        const card = document.createElement('div');
        card.className = 'qa-card';
        card.innerHTML = `
            <span class="qa-num">${idx + 1} · ${item.bob}</span>
            <div class="qa-question">${item.q}</div>
            <div class="qa-answer"><b>Qayer:</b> ${item.a}</div>
        `;
        container.appendChild(card);
    });
}

buildStars();
renderList();
</script>
</body>
</html>
