<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>5-Bob.Adovat emas,adolat yengadi a</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #050505, #121212, #1d1d1d);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* ===== Raqam tanlash ekrani ===== */
        #select-screen {
            width: 100%; max-width: 700px;
            display: flex; flex-direction: column; align-items: center;
            gap: 25px; padding: 20px 0;
        }
        #select-screen h1 {
            font-size: 26px; color: #00ff99; text-align: center;
        }
        #select-screen p { color: #999; font-size: 14px; text-align: center; }
        .number-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
            gap: 10px;
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px;
            background: #111;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0,255,150,0.15);
        }
        .number-grid::-webkit-scrollbar { width: 8px; }
        .number-grid::-webkit-scrollbar-thumb { background: #00ff99; border-radius: 10px; }
        .num-btn {
            background: #1b1b1b;
            border: 2px solid #00ff99;
            color: #00ff99;
            border-radius: 12px;
            padding: 12px 0;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
            text-shadow: 0 0 8px rgba(0,255,153,0.6);
        }
        .num-btn:hover {
            background: #00ff99;
            color: #050505;
            box-shadow: 0 0 20px rgba(0,255,150,0.8);
            transform: scale(1.08);
        }
        .num-btn.picked {
            background: #ff9900;
            border-color: #ff9900;
            color: #050505;
            box-shadow: 0 0 20px rgba(255,153,0,0.8);
        }
        #range-info {
            color: #ff9900; font-size: 15px; font-weight: bold; min-height: 22px;
        }

        /* ===== Funksiya tanlash ekrani ===== */
            #mode-screen {
            display: none;
            width: 100%; max-width: 700px;
            flex-direction: column; align-items: center;
            gap: 25px; padding: 20px 0;
        }

        {
            width: 100%;
            max-width: 450px;
            aspect-ratio: 4 / 3;
            position: relative;
            background: rgba(5, 5, 5, 0.4);
          
            border-radius: 20px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
         {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        #mode-screen h1 {
            font-size: 24px; color: #00ff99; text-align: center;
            margin: 5px 0;
        }

        .mode-wrapper {
            width: 100%;
            background: rgba(5, 5, 5, 0.4);
            border-radius: 20px;
            padding: 25px;
       
        }
        .mode-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .mode-card {
            background: rgba(27, 27, 27, 0.85);
            border-radius: 20px;
            padding: 30px 15px;
            text-align: center;
            transition: 0.4s;
            color: white;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            backdrop-filter: blur(3px);
        }
        .mode-card::before {
            content: ""; position: absolute; width: 200%; height: 200%;
            background: linear-gradient(45deg,transparent,#00ff99,transparent);
            top: -150%; left: -150%; transform: rotate(25deg); transition: 0.7s;
        }
        .mode-card:hover::before { top: 100%; left: 100%; }
        .mode-card:hover { transform: translateY(-5px) scale(1.02); border-color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.2); }
@media(max-width:600px){ 
    .mode-grid{ grid-template-columns: repeat(2, 1fr); } 
    .mode-icon-top{ display: flex; justify-content: center; }
    .mode-icon-top img{ width: 85%; max-width: 220px; }
}
        /* ===== Intro (countdown) ekran ===== */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            height: 100dvh;
            background: #050505; display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 5;
            transition: opacity 0.8s ease;
        }
        #stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        #select-screen, #mode-screen, .quiz-box, #intro-screen .content-box, #intro-screen #countdown {
            position: relative; z-index: 2;
        }
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2.5s infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.6); }
        }
        .content-box { text-align: center; margin-bottom: 50px; z-index: 1; position: relative; padding: 0 20px; }
        #countdown {
            position: absolute; bottom: 50px;
            font-size: 80px; color: #00ff99; font-weight: bold;
            animation: pulse 1s infinite;
            z-index: 1;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.5; }
        }

        .quran-box {
            display: block;
            margin: 25px auto 0 auto;
            padding: 20px 30px;
            max-width: 550px;
            border: 4px double #ffd700;
            background: rgba(20, 16, 5, 0.6);
            text-align: center;
        }
        .quran-ayat-text {
            font-size: 18px;
            line-height: 1.6;
            color: #f0f0f0;
            margin-bottom: 15px;
            display: block;
        }
        .quran-meta {
            display: inline-block;
            font-size: 15px;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding-top: 8px;
            width: 100%;
        }

        /* ===== Quiz ekrani ===== */
        .quiz-box {
            display: none;
            width: 100%; max-width: 600px; background: #1b1b1b; padding: 30px;
            border-radius: 25px; box-shadow: 0 0 35px rgba(0, 255, 150, 0.1);
            text-align: center; margin-top: 50px;
        }
        h2 { color: #00ff99; margin-bottom: 20px; font-size: 22px; }
        .option {
            display: block; width: 100%; padding: 15px; margin: 10px 0;
            background: #2a2a2a; border: 2px solid #333; border-radius: 15px;
            cursor: pointer; transition: 0.3s; text-align: left;
        }
        .option:hover { border-color: #00ff99; }
        .correct {
            background: #00ff99 !important; color: black; font-weight: bold;
            animation: bubbleEffect 0.5s ease-out;
        }
        @keyframes bubbleEffect {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .wrong { background: #ff4d4d !important; color: white; }
        .btn-finish {
            width: 100%; padding: 15px; background: transparent; border: 2px solid #00ff99;
            color: #00ff99; border-radius: 15px; cursor: pointer; margin-top: 20px;
            font-weight: bold; transition: 0.3s;
        }
        .btn-finish:hover { background: #00ff99; color: black; }

        .closed-input {
            width: 100%; padding: 15px; margin-top: 10px; border: 2px solid #333;
            border-radius: 12px; font-size: 17px; outline: none; background: #2a2a2a;
            color: white;
        }
        .closed-input:focus { border-color: #00ff99; }
        .btn-check {
            width: 100%; padding: 15px; margin-top: 15px; border: 2px solid #00ff99; border-radius: 15px;
            background: transparent; color: #00ff99; font-weight: bold; cursor: pointer; font-size: 17px;
            transition: 0.3s;
        }
        .btn-check:hover { background: #00ff99; color: black; }
        #closed-result { margin-top: 15px; font-size: 18px; min-height: 30px; text-align: center; }

        /* ===== Mobil to'liq ekran tuzatishlari ===== */
        @media (max-width: 480px) {
            body { padding: 12px; }
            #select-screen h1 { font-size: 21px; }
            #mode-screen h1 { font-size: 19px; }
            .mode-card { padding: 22px 10px; font-size: 14px; }
            .quiz-box { padding: 20px 16px; margin-top: 30px; }
            h2 { font-size: 18px; }
            .content-box h1 { font-size: 24px !important; }
            .quran-ayat-text { font-size: 15px; }
            #countdown { font-size: 60px; bottom: 35px; }
            .number-grid { grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); }
        }
    </style>
</head>
<body>

<div id="stars"></div>

<div id="select-screen">
    <h1>📚5-Bob.Adovat emas,adolat yengadi</h1>
    <p>Savollar sonini belgilang</p>
    <div id="range-info">Boshlang'ich raqamni tanlang</div>
    <div class="number-grid" id="numberGrid"></div>
</div>

<div id="mode-screen">
    <div class="mode-icon-top">
        <img src="temur.webp" alt="rasm">
    </div>
    <h1>Qaysi funksiyani xohlaysiz?</h1>
    <div class="mode-wrapper">
        <div class="mode-grid">
            <div class="mode-card" onclick="chooseMode('quiz')">Quiz testlar</div>
            <div class="mode-card" onclick="chooseMode('quiz-aralash')">Quiz aralash</div>
            <div class="mode-card" onclick="chooseMode('yopiq')">Yopiq savol-javob</div>
            <div class="mode-card" onclick="chooseMode('yopiq-aralash')">Yopiq savol-javob aralash</div>
        </div>
    </div>
</div>

<div id="intro-screen">
    <div class="content-box">
        <h1 style="color:#00ff99; font-size: 32px;">3-Bob.Cho'ng ziddiyat,navqiron shiddat</h1>
        <div id="random-ayat"></div>
    </div>
    <div id="countdown">3</div>
</div>

<div class="quiz-box" id="quiz">
    <h2 id="question">Yuklanmoqda...</h2>
    <div id="options"></div>
    <button class="btn-finish" onclick="finishQuiz()">Testni yakunlash</button>
</div>

<script>
const quizData = [
  {"q": "Amir Temurning harbiy strategiyasi, harb ishida juda ko'p omillar qatorida qo'shinni qurol-aslaha, harbiy anjomlar bilan ta'minlash, muhoraba paytida ulardan oqilona foydalanish muhim ahamiyat kasb etgan. Bu haqda u qaysi asarida yozib qoldirgan?", "correct": "«Temur tuzuklari»ning «Sipohning yaroq-jabduqlari va anjom-jihozlari tuzugi»", "wrongs": ["«Temur tuzuklari»ning «Harb tuzugi»", "«Temur tuzuklari»ning «Sipoh tartibotlari tuzugi»", "«Temur tuzuklari»ning «Lashkar tuzugi»"]},
  {"q": "Harbiy yurish paytida oddiy askar nimalar olishi shart edi?", "correct": "2 ot, bir kamon, bir sadoq o'q olishi shart edi", "wrongs": ["1 ot, ikki kamon, bir sadoq o'q olishi shart edi", "3 ot, bir kamon, ikki sadoq o'q olishi shart edi", "2 ot, ikki kamon, bir sadoq o'q olishi shart edi"]},
  {"q": "Bahodir askarlarning har biriga nima olsin deb buyruq berilgan edi?", "correct": "bir qilich, sadoq-o'qdon, kamon va 5 ta ot olsin deb", "wrongs": ["bir qilich, ikki kamon va 3 ta ot olsin deb", "ikki qilich, sadoq-o'qdon va 5 ta ot olsin deb", "bir nayza, kamon va 2 ta ot olsin deb"]},
  {"q": "«Temurning harbiy kuchlari, avvaliga mohir suvoriylar va mergan kamonchilar edi va buyuk sarkarda qudratining asosini tashkil qilardi» deb yozadi taniqli ingliz tarixchisi kim?", "correct": "Hilda Hukhem", "wrongs": ["Rui Gonzales de Klavixo", "Nizomiddin Shomiy", "Sharafuddin Ali Yazdiy"]},
  {"q": "Temuriylarning qaysi san'ati eng yuqori cho'qqida edi (miltiqlar paydo bo'lgunga qadar)?", "correct": "Merganlik san'ati", "wrongs": ["Qilichbozlik san'ati", "Nayzabozlik san'ati", "Otchilik san'ati"]},
  {"q": "Amir Temur o'z g'animlari bilan kurashda kimlarga tayangan?", "correct": "o'qchilar, qilichbozlar, nayzadorlarga", "wrongs": ["faqat otliq askarlarga", "faqat piyoda askarlarga", "faqat qurolsozlarga"]},
  {"q": "Amir Temur jang-u jadal paytida qanday qurol-yarog'ni o'z o'rni kelganda ishlatishga amr qilgan?", "correct": "o'q-yoy, oybolta, qilich, gurzi, pichoq, xanjar", "wrongs": ["faqat qilich va nayza", "faqat o'q-yoy va qalqon", "faqat gurzi va xanjar"]},
  {"q": "Nima asosan dushmanlarning jangda qatnashadigan ot va tuyalarini yo'q qilishga mo'ljallangan edi?", "correct": "Xanjar", "wrongs": ["Nayza", "Qilich", "Gurzi"]},
  {"q": "Muarrix kim bu to'g'rida 1383-yil oxirida Seistonda bo'lgan jangdan misol keltiradi?", "correct": "Nizomiddin Shomiy", "wrongs": ["Sharafuddin Ali Yazdiy", "Hilda Hukhem", "Ibn Arabshoh"]},
  {"q": "Urush uchun esa lashkar yetarli miqdorda nima bilan ta'minlanishi lozim edi?", "correct": "qurol-yarog'", "wrongs": ["oziq-ovqat", "ot-ulov", "kiyim-kechak"]},
  {"q": "Rui Gonzales de Klavixo «Samarqandga Temur saroyiga sayohat kundaligi 1403–1406-yillar» asarida Samarqand chekkasidagi bir qal'ada joylashgan nima haqida ma'lumot bergan?", "correct": "qurol-yarog'lar yasaladigan ustaxona", "wrongs": ["g'alla omborlari", "otxonalar", "kutubxona"]},
  {"q": "Qurol-yarog'lar yasaladigan ustaxonada qanchaga yaqin qurolsoz usta muntazam ravishda sovut, qalqon, yoy va nayzalar tayyorlash bilan mashg'ul bo'lgan?", "correct": "1000 ga yaqin", "wrongs": ["500 ga yaqin", "2000 ga yaqin", "300 ga yaqin"]},
  {"q": "Buyuk sarkarda ustalardan, ayniqsa, nimalarni sifatli yasalishini talab qilgan, chunki ushbu anjomlar jangchining asosiy himoya vositasi hisoblangan?", "correct": "sovut va dubulg'alarning", "wrongs": ["qilich va nayzaning", "kamon va o'qning", "qalqon va gurzining"]},
  {"q": "Muhim qurolsozlik ustaxonalaridan tashqari, harbiy yurishlar paytida qurol-yarog' yasaydigan qanday ustaxonalar ham ishlab turgan?", "correct": "ko'chma", "wrongs": ["doimiy", "yer osti", "harbiy"]},
  {"q": "Sohibqiron qurolsozlar safini qayerdan olib kelingan ustalar bilan to'ldirib borgan?", "correct": "taslim etilgan mamlakatlardan", "wrongs": ["Movarounnahr shaharlaridan", "Xitoydan", "Hindistondan"]},
  {"q": "Kichik Osiyo va Shom fath etilgach, kamon ishlab chiqaruvchi ustalar, to'pchi-muhandislar, boshqa qurolsozlar qayerga olib kelingan?", "correct": "poytaxt Samarqandga", "wrongs": ["Buxoroga", "Keshga", "Hirotga"]},
  {"q": "Amir Temur jang paytida dushmanlarga qaqshatqich zarba berishga qodir eng mukammal qurol turlarini yaratish va ulardan foydalanishga katta e'tibor bergan. Bu nima edi?", "correct": "o'qotar qurollar", "wrongs": ["sovut va dubulg'a", "qilich va nayza", "ot va tuya"]},
  {"q": "Kichik o'tli o'qlarni otishga mo'ljallangan qurol nima?", "correct": "ra'dandoz", "wrongs": ["manjaniq", "arroda", "tiri charx"]},

  {"q": "Mustahkam qal'alarni egallashda foydalanilgan qurollar qaysilar?", "correct": "Manjaniq, arroda, tiri charx", "wrongs": ["ra'dandoz va kamoni ra'd", "qilich va nayza", "o'q-yoy va qalqon"]},
  {"q": "Iroqda Dajla daryosining g'arb tomonida qadimiy qanday qal'a joylashgan edi?", "correct": "Tikrit", "wrongs": ["Halab", "Damashq", "Bag'dod"]},

  {"q": "Tikrit qal'a valiysi kim edi?", "correct": "Amir Hasan", "wrongs": ["Amir Vali", "Sariq Odil", "Amir Jalol Islom"]},
  {"q": "Sohibqiron qal'a valiysi Amir Hasanga jangsiz taslim bo'lishni taklif qiladi. Ammo u bunga ko'nmagani uchun Sohibqiron buyrug'i bilan nimalar rostlanadi?", "correct": "Arrodalar", "wrongs": ["Manjaniqlar", "Ra'dandozlar", "Naftandozlar"]},
  {"q": "Arrodalar rostlanib, ulardan tashqari yana nimalar ham tayyorlanadi?", "correct": "manjaniqlar", "wrongs": ["arrodalar", "ra'dandozlar", "kamoni ra'dlar"]},
  {"q": "Qal'aning atrofida nima kavlanib, o't qo'yilgandan so'ng qal'a devorlari qulaydi?", "correct": "naqb", "wrongs": ["lahm", "handaq", "ko'prik"]},
  {"q": "Muarrixning yozishicha, «Qal'adan bir tuproq to'dasidan boshqa asar ham qolmadi». Bu voqea qachon yuz beradi?", "correct": "1393-yil 11-noyabrda", "wrongs": ["1392-yil 5-oktabrda", "1394-yil 20-dekabrda", "1393-yil 1-yanvarda"]},
  {"q": "Damashqni taslim qilishda qanchaga yaqin manjaniqlar, arrodalar, qurollardan foydalaniladi?", "correct": "60", "wrongs": ["40", "80", "100"]},
  {"q": "Shahar qal'asi devori ro'parasiga o'rnatilgan minoralardagi qurollardan qal'a arki ichiga olov yonuvchi qanday o'qlar uloqtiriladi?", "correct": "naft (neft)", "wrongs": ["olov toshlari", "yonuvchi moylar", "temir sharlar"]},
  {"q": "Alangadan cho'g'dek qizib ketgan devorlar nima vositasida sovutilgach, toshlar bosqonlar zarbidan osongina maydalanib ketardi?", "correct": "sirka", "wrongs": ["suv", "yog'", "qum"]},
  {"q": "Qal'a himoyachilari qarshilik ko'rsatishdan to'xtamagani uchun ark minorasi tagidan nima qilgach, devori qulab tushadi?", "correct": "lahm kavlangach", "wrongs": ["naqb qazilgach", "devor buzilgach", "minora qulagach"]},
  {"q": "Qal'a mudofaachilari qattiq qarshilik ko'rsatib, qancha vaqtdan ortiq vaqt himoyada turganligiga qaramay, oxir-oqibat mag'lub bo'lishadi?", "correct": "bir oydan", "wrongs": ["bir haftadan", "ikki oydan", "bir yildan"]},
  {"q": "Sohibqiron lashkarlari harbiy yurishlar paytida nimalardan ham foydalangan?", "correct": "narvon va taxtapullardan", "wrongs": ["manjaniq va arrodalardan", "kamon va o'qdan", "qilich va nayzadan"]},
  {"q": "Turkiyadagi qaysi qal'a baland tog'da joylashgan bo'lib, nihoyatda mustahkam edi?", "correct": "Behasti", "wrongs": ["Salosil", "Tikrit", "Alinjik"]},
  {"q": "Turkiyadagi Behasti qal'asi baland tog'da joylashgan bo'lib, qal'a o'rtasida aylanuvchi nima o'rnatilgan edi?", "correct": "manjaniq", "wrongs": ["ra'dandoz", "arroda", "tiri charx"]},
  {"q": "Amir Temur dushmanlarining qanday qurollardan foydalanishlari, ularning o'zini mudofaa qilish vositalariga qarab jang taktikasini o'zgartirgan, g'animlar qarshi qanday vositalar ishlatgan?", "correct": "ular kutmagan vositalarni", "wrongs": ["faqat o'z qurollarini", "eski qurollarni", "dushman qurollarini"]},
  {"q": "Hindistonga yurish paytida Amir Temur qo'shinlari birinchi marta nimaga ro'para keladi, shuning uchun ularda qo'rquv paydo bo'ladi?", "correct": "harbiy fillarga", "wrongs": ["otliq askarlarga", "tuyali askarlarga", "og'ir artilleriyaga"]},
  {"q": "Amir Temur qo'shinlari birinchi marta harbiy fillarga ro'para kelib, qo'rquv paydo bo'lganda, sarkarda askarlarga saflari oldiga nima qo'yishni buyuradi?", "correct": "tikanli simlar", "wrongs": ["naqb va handaqlar", "manjaniq va arrodalar", "olov va naft"]},
  {"q": "Buqalar va tuyalar bir-biriga matashtirilib, ular ustiga shox-shabbalar ortilgan. Fillar hujum boshlashi bilanoq nima qilingan?", "correct": "shox-shabba bog'lamlari yoqib yuborilgan, alangani ko'rgan fillarning bir qismi qo'rquvdan orqaga tisarilib, o'z qo'shinini toptay boshlagan", "wrongs": ["buqalar bo'shatib yuborilgan", "tuyalar old safga qo'yilgan", "askarlar chekingan"]},
  {"q": "Qolgan fillar nimadan mayib-majruh bo'lgan?", "correct": "yerga qoqilgan qoziqlardan va uch tishli dandonalardan", "wrongs": ["o'q-yoy zarbidan", "olov va naftdan", "qilich zarbidan"]},
  {"q": "1401-yil yanvar oyida qaysi shahar fathi boshlanadi?", "correct": "Halab", "wrongs": ["Damashq", "Bag'dod", "Tikrit"]},
  {"q": "Halab shahri fathida nimalar qatnashuvchi kuchga aylanadi? «Zirhu qurollar bilan jihozlangan bir saf...ni jang maydonlariga dushman ro'baro'siga chiqardi», deb yozadi muarrix.", "correct": "harbiy fillar", "wrongs": ["og'ir suvoriylar", "piyoda qo'shin", "kamonchilar"]},
  {"q": "Muhorabada Sohibqironning o'zi ham shaxsan jangga kiradi. Askarlarning ko'pligini ko'rgan halabliklar nima qilishga majbur bo'ladilar?", "correct": "Muhorabada (orqaga o'girib qochishga majbur bo'ladilar)", "wrongs": ["Qamalda", "Qochishda", "Sulhda"]},
  {"q": "Halab egallangach, amir Jalol Islom muarrix kimni hazrati Sohibqiron huzuriga olib boradi?", "correct": "Nizomiddin Shomiyni", "wrongs": ["Sharafuddin Ali Yazdiyni", "Hilda Hukhemni", "Rui Gonzales de Klavixoni"]},
  {"q": "Amir Temur o'z davrining tengi yo'q kim sifatida ham tarix sahifalariga mangu muhrlangan?", "correct": "diplomat", "wrongs": ["sarkarda", "shoir", "olim"]}
];
const ayats = [
    { text: "Robbing seni tark qilmadi va g'azab ham qilmadi.", meta: "Zuho 93:3" },
    { text: "Albatta bir qiyinchilik bilan osonchilik bordir.", meta: "Sharh 94:5" },
    { text: "Yaratgan Robbing nomi bilan o'qi!", meta: "Alaq 96:1" },
    { text: "O'qi, Robbing karamlilar karamlisidir.", meta: "Alaq 96:3" },
    { text: "Va tezda Robbing senga ato qilur va sen rozi bo'lursan.", meta: "Zuho 93:5" },
    { text: "Ammo kimki ato bersa va taqvo qilsa, va yaxshiliklarni tasdiq qilsa, bas, Biz uni osonga muyassar etamiz.", meta: "Layl 92:5-7" },
    { text: "Albatta hidoyatga boshlash Bizning zimmamizdadir.", meta: "Layl 92:12" },
    { text: "Va albatta tezda rozi bo'ladir.", meta: "Layl 92:21" },
    { text: "Seni oson yo'lga muyassar etamiz.", meta: "A'lo 87:8" },
    { text: "Bas, kim xohlasa Parvardigori tomon qaytadigan yo'lni tutar.", meta: "Naba 78:39" },
    { text: "Albatta Biz senga ochiq g'alaba berdik.", meta: "Fath 48:1" }
];

let activeQuiz = [];
let currentQ = 0, score = 0, answered = 0;

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function buildStars() {
    const container = document.getElementById('stars');
    container.innerHTML = '';
    const count = 100;
    for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        const size = (Math.random() * 2 + 1).toFixed(1);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.animationDelay = (Math.random() * 2.5).toFixed(2) + 's';
        s.style.animationDuration = (1.5 + Math.random() * 2).toFixed(2) + 's';
        container.appendChild(s);
    }
}

let rangeStart = null;
let numButtons = [];

window.onload = function() {
    const grid = document.getElementById('numberGrid');
    for (let i = 1; i <= quizData.length; i++) {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.innerText = i;
        btn.onclick = () => pickNumber(i, btn);
        grid.appendChild(btn);
        numButtons.push(btn);
    }
    buildStars();

    const randomIdx = Math.floor(Math.random() * ayats.length);
    const selectedAyat = ayats[randomIdx];
    document.getElementById('random-ayat').innerHTML = `
        <div class="quran-box">
            <span class="quran-ayat-text">"${selectedAyat.text}"</span>
            <span class="quran-meta">${selectedAyat.meta}</span>
        </div>
    `;
};

function pickNumber(num, btnEl) {
    const info = document.getElementById('range-info');

    if (rangeStart === null) {
        rangeStart = num;
        btnEl.classList.add('picked');
        info.innerText = `Boshlang'ich: ${num}. Endi oxirgi raqamni tanlang`;
    } else {
        let start = rangeStart;
        let end = num;
        if (end < start) { const t = start; start = end; end = t; }
        btnEl.classList.add('picked');
        info.innerText = `Tanlandi: ${start} - ${end}`;
        setTimeout(() => startWithRange(start, end), 400);
    }
}

function startWithRange(start, end) {
    activeQuiz = quizData.slice(start - 1, end);
    document.getElementById('select-screen').style.display = 'none';
    document.getElementById('mode-screen').style.display = 'flex';
}

let quizMode = 'quiz';

function chooseMode(mode) {
    quizMode = mode;
    if (mode === 'quiz-aralash' || mode === 'yopiq-aralash') {
        activeQuiz = shuffle([...activeQuiz]);
    }
    document.getElementById('mode-screen').style.display = 'none';
    document.getElementById('intro-screen').style.display = 'flex';
    document.getElementById('intro-screen').style.opacity = '1';
    startTimer();
}

function startTimer() {
    let count = 3;
    let disp = document.getElementById("countdown");
    disp.innerText = count;
    let timer = setInterval(() => {
        count--;
        if (count > 0) {
            disp.innerText = count;
        } else if (count === 0) {
            disp.innerText = "Boshladik!";
        } else {
            clearInterval(timer);
            document.getElementById("intro-screen").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("intro-screen").style.display = "none";
                document.getElementById("quiz").style.display = "block";
                loadQ();
            }, 800);
        }
    }, 1000);
}

function getOptionsFor(qData) {
    return shuffle([qData.correct, ...qData.wrongs]);
}

function loadQ() {
    const qData = activeQuiz[currentQ];
    document.getElementById('question').innerText = `${currentQ + 1}/${activeQuiz.length}. ${qData.q}`;
    const optDiv = document.getElementById('options');
    optDiv.innerHTML = '';

    if (quizMode === 'yopiq' || quizMode === 'yopiq-aralash') {
        loadClosedQ(qData, optDiv);
    } else {
        loadMultipleChoiceQ(qData, optDiv);
    }
}

function loadMultipleChoiceQ(qData, optDiv) {
    let shuffledOptions = getOptionsFor(qData);

    shuffledOptions.forEach((opt) => {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.innerText = opt;
        btn.onclick = () => check(opt, btn, qData.correct);
        optDiv.appendChild(btn);
    });
}

function loadClosedQ(qData, optDiv) {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'closed-input';
    input.id = 'closed-answer';
    input.placeholder = 'Javob yozing...';
    input.onkeypress = (e) => { if (e.key === 'Enter') checkClosed(qData); };

    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn-check';
    checkBtn.innerText = 'Tekshirish';
    checkBtn.onclick = () => checkClosed(qData);

    const resultDiv = document.createElement('div');
    resultDiv.id = 'closed-result';

    optDiv.appendChild(input);
    optDiv.appendChild(checkBtn);
    optDiv.appendChild(resultDiv);

    input.focus();
}

function checkClosed(qData) {
    const inputEl = document.getElementById('closed-answer');
    const resultDiv = document.getElementById('closed-result');
    const user = inputEl.value.toLowerCase().trim();
    const correct = qData.correct.toLowerCase().trim();

    answered++;
    inputEl.disabled = true;
    document.querySelector('.btn-check').disabled = true;

    if (user === correct) {
        resultDiv.innerHTML = '<b style="color:#00ff99;">✅ To\'g\'ri</b>';
        score++;
    } else {
        resultDiv.innerHTML = '<b style="color:#ff4444;">❌ Noto\'g\'ri.</b><br> Javob: ' + qData.correct;
    }

    setTimeout(() => {
        currentQ++;
        if (currentQ < activeQuiz.length) loadQ();
        else finishQuiz();
    }, 2000);
}

function check(selected, element, correct) {
    const options = element.parentElement.querySelectorAll('.option');
    options.forEach(opt => opt.style.pointerEvents = 'none');
    answered++;

    if (selected === correct) {
        element.classList.add('correct');
        score++;
    } else {
        element.classList.add('wrong');
        options.forEach(opt => {
            if (opt.innerText === correct) opt.classList.add('correct');
        });
    }
    setTimeout(() => {
        currentQ++;
        if (currentQ < activeQuiz.length) loadQ();
        else finishQuiz();
    }, 1000);
}

function finishQuiz() {
    let wrong = answered - score;
    document.getElementById('quiz').innerHTML = `
        <h2>Natijalar</h2>
        <div style="line-height: 2.2; font-size: 19px;">
            Jami savollar: <b>${activeQuiz.length} ta</b><br>
            To'g'ri javoblar: <span style="color:#00ff99;">${score} ta</span><br>
            Xato javoblar: <span style="color:#ff4d4d;">${wrong} ta</span>
        </div>
        <button class="btn-finish" onclick="location.reload()">Qaytadan boshlash</button>
    `;
}
</script>
</body>
</html>
