<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Barcha savol-javoblar</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; min-height: 100%; }
body {
    font-family: 'Segoe UI', 'Arial', sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #161616, #0a0a0a 60%);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
    min-height: 100dvh;
}

/* ===== Yulduzlar foni ===== */
#stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
}
.star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2.5s infinite ease-in-out;
}
.star.glow {
    box-shadow: 0 0 6px 1px rgba(255, 215, 0, 0.5);
}
@keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.6); }
}

/* ===== Oltin nishon (badge) ===== */
.gold-badge {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2e2e2e, #0f0f0f 70%);
    border: 3px solid #ffd700;
    box-shadow: 0 0 18px rgba(255,215,0,0.55), 0 0 40px rgba(255,215,0,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    margin-bottom: -8px;
    position: relative; z-index: 3;
}

/* ===== Asosiy karta ===== */
.wrap {
    position: relative; z-index: 2;
    width: 100%; max-width: 750px;
    display: flex; flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 45px 30px 35px 30px;
    background: linear-gradient(160deg, rgba(16,16,16,0.55), rgba(10,10,10,0.55));
    backdrop-filter: blur(1px);
    border: 2px solid #ffd700;
    border-radius: 26px;
    box-shadow: 0 0 30px rgba(255,215,0,0.22), inset 0 0 40px rgba(255,215,0,0.03);
}

h1 {
    font-size: 22px; color: #ffffff; text-align: center;
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(255,255,255,0.3);
    width: 100%;
}

/* ===== Yashil neon "Tanlanganlar" paneli ===== */
.neon-bar {
    width: 100%;
    background: linear-gradient(135deg, #0f1a15, #131313);
    border: 2px solid #00ff99;
    color: #00ff99;
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.25s;
    text-shadow: 0 0 10px rgba(0,255,153,0.8);
    box-shadow: 0 0 14px rgba(0,255,153,0.35), inset 0 0 18px rgba(0,255,153,0.06);
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.neon-bar:hover {
    background: #00ff99;
    color: #050505;
    text-shadow: none;
    box-shadow: 0 0 25px rgba(0,255,153,0.9);
    transform: scale(1.015);
}
.neon-bar.back-mode {
    border-color: #ffd700;
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255,215,0,0.8);
    box-shadow: 0 0 14px rgba(255,215,0,0.35), inset 0 0 18px rgba(255,215,0,0.06);
}
.neon-bar.back-mode:hover {
    background: #ffd700;
    color: #050505;
    text-shadow: none;
    box-shadow: 0 0 25px rgba(255,215,0,0.9);
}

.list-search {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 2px solid #333;
    background: #1b1b1b;
    color: white;
    font-size: 15px;
    outline: none;
}
.list-search:focus { border-color: #00ff99; }
.list-counter { color: #999; font-size: 13px; text-align: center; }
.qa-list { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.qa-card {
    position: relative;
    background: #1b1b1b;
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 16px;
    padding: 18px 60px 18px 20px;
    box-shadow: 0 0 15px rgba(0,255,150,0.06);
    transition: 0.25s;
}
.qa-card.selected {
    border-color: #00ff99;
    box-shadow: 0 0 18px rgba(0,255,150,0.25);
    background: #17211c;
}
.qa-num {
    display: inline-block;
    color: #050505;
    background: #ffd700;
    font-size: 12px;
    font-weight: bold;
    border-radius: 8px;
    padding: 2px 9px;
    margin-bottom: 8px;
}
.qa-add-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid #00ff99;
    background: transparent;
    color: #00ff99;
    font-size: 18px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.25s;
}
.qa-add-btn:hover {
    background: #00ff99;
    color: #050505;
    transform: scale(1.1);
}
.qa-add-btn.selected {
    background: #00ff99;
    color: #050505;
    box-shadow: 0 0 12px rgba(0,255,150,0.7);
}
.qa-question { color: #f0f0f0; font-size: 15.5px; line-height: 1.5; font-weight: bold; margin-bottom: 10px; }
.qa-answer {
    color: #00ff99;
    font-size: 14.5px;
    line-height: 1.5;
    border-top: 1px dashed rgba(0,255,153,0.25);
    padding-top: 10px;
}
.qa-answer b { color: #ffd700; }
.list-toolbar {
    width: 100%;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
}
.list-clear-selected {
    background: transparent;
    border: none;
    color: #666;
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
}
.list-clear-selected:hover { color: #ff4d4d; }
@media (max-width: 480px) {
    body { padding: 12px; }
    .wrap { padding: 35px 16px 24px 16px; }
    h1 { font-size: 19px; }
    .gold-badge { width: 68px; height: 68px; font-size: 30px; }
    .neon-bar { font-size: 14px; padding: 12px 10px; }
}
</style>
</head>
<body>
<div id="stars"></div>
<div class="wrap">
    <div class="gold-badge">📋</div>
    <h1 id="pageTitle">📋 Barcha savol-javoblar</h1>

    <button class="neon-bar" id="tabSelected" onclick="toggleTab()">⭐ Tanlanganlar (<span id="selCount">0</span>)</button>

    <input type="text" class="list-search" id="listSearch" placeholder="Savol bo'yicha qidirish..." oninput="renderList()">
    <div class="list-toolbar" id="selectedToolbar" style="display:none;">
        <div class="list-counter" id="listCounter" style="text-align:left;"></div>
        <button class="list-clear-selected" onclick="clearSelected()">Hammasini tozalash</button>
    </div>
    <div class="list-counter" id="listCounterAll"></div>
    <div class="qa-list" id="qaList"></div>
</div>

  {q: "U saranjom-sarishta, fayzligina, ozoda edi. Uzum novdalari baland valishga chiroyli qilib taralgan. Gʻoʻra tugib qolgan \"poshshoyi\" oʻrigi shoxida ikkita bedana qovoq osilgan bu hovli kimniki edi?", a: ["Gulchehraning", "Umaralining", "Rononing", "G'upraning"], correct: "Gulchehraning"},

  {q: "Ikkita hovlidan keyin yana bitta shunaqa fayzli, ozoda, saranjom-sarishta hovliga kirdik. Oshxona devorida quyonni quvlab ketayotgan boʻri suratiga koʻzimiz tushdi. Surat tagiga nima deb yozib qoʻyilgan edi?", a: ["Ну, погоди!", "Tom va Jerri", "Qo'y va bo'ri", "Bo'rining ovi"], correct: "Ну, погоди!"},

  {q: "Hovli etagida pushtasiga sarimsoq-piyoz qadalgan qulupnay arigʻiga galife shim kiygan oʻrta yashar bir kishi suv ochyapti. U kim, dedi Oʻlmas?", a: ["Abdullaning tog'asi", "Umaralining akasi", "G'upraning otasi", "Rayon kotibi"], correct: "Abdullaning tog'asi"},

  {q: "Ayvon oʻrtasidagi kattakon stol ustida orqa qopqogʻi ochilgan qanaqa nomli televizor turardi?", a: ["Rekord", "Elektronika", "Horizont", "Sokol"], correct: "Rekord"},

  {q: "– Isitmangiz ancha baland, tinchroq joyda yotib, ukol olib, bir kungina davolansangiz otdek boʻlib ketasiz, – dedi keksa feldsher. U aytgan \"tinchroq joy\" qayer edi?", a: ["atlas kombinatining sihatgohi", "rayon kasalxonasi", "qishloq shifoxonasi", "farg'ona sanatoriysi"], correct: "atlas kombinatining sihatgohi"},

  {q: "Qancha uxlaganimni bilmayman. Koʻzimni ochsam, tepamda kim turibdi?", a: ["Umarali", "O'lmas", "G'upra", "Anvar"], correct: "Umarali"},

  {q: "Ochiqkoʻngil, birovga tirnoqcha ham ozor bermaydigan, ogʻzidan biron nojoʻya soʻz chiqmagan, oʻta odobli, madaniyatli bu olim yigitni qattiq hurmat qilardim, issiq gaplar boʻlsa, mendan oldin u sevinib ketardi. Ta'rif kim haqida?", a: ["Umarali", "O'lmas", "G'upra", "Abdulla Qahhor"], correct: "Umarali"},

  {q: "Uni koʻrib chehram yorishgandek boʻldi. \"Odam taftini odam oladi\" deganlari shu boʻlsa kerak-da. Kimni koʻrib shunday boʻlgan edi?", a: ["Umaralini", "O'lmasni", "G'upraning", "Anvarni"], correct: "Umaralini"},

  {q: "Sizlar ketdingizlaru men bechora yetim boladek mungʻayib qolaverdim. Sirtqi talabalarimga, hordiq kuni ham imtihon olmoqchiman, deganimda sevinib ketishdi. Toshkentga oʻtirib borgan moshina rusumi nima edi?", a: ["Jiguli", "Moskvich", "Volga", "Zaporojets"], correct: "Jiguli"},

  {q: "Yuvuqsiz, irkit odam bilan koʻrishib qolsa, mehmonxonaga yugurib borib choʻmilib kelardi. Oʻpishib koʻrishadiganlardan qochib yurardi. Tirnogʻi oʻsib ketgan, boʻyni terlab, hadeb dastroʻmolini shilta qilib oʻtiradigan odam yonidan turib hovliga chiqib ketar, qaytishda boshqa odam yoniga kelib oʻtirardi. Ta'rif kim haqida?", a: ["Umarali", "O'lmas", "G'upra", "Anvar"], correct: "Umarali"},

  {q: "Sizni menga xudo yetkazdi. Ertaga qayer markazida Oʻlmasning qissasi muhokamasi boʻladi?", a: ["Quva markazida", "Farg'ona markazida", "Yozyovon markazida", "Nishon markazida"], correct: "Quva markazida"},

  {q: "Sizni menga xudo yetkazdi. Ertaga Quva markazida Oʻlmasning qaysi qissasi muhokamasi boʻladi?", a: ["Sevgim-sevgilim", "Ming bir jon", "Kecha va kunduz", "Oltin devor"], correct: "Sevgim-sevgilim"},

  {q: "– Sizni menga xudo yetkazdi. Ertaga Quva markazida Oʻlmasning \"Sevgim-sevgilim\" qissasi muhokamasi boʻladi. Men bu ahvoldaman. Muhokamani oʻzingiz oʻtkazib berasiz, – dedim unga yalingandek. Kimga aytilgan edi bu gap?", a: ["Umaraliga", "O'lmasga", "Xorunboy akaga", "G'upraga"], correct: "Umaraliga"},

  {q: "Indinga kim yozuvchi mehmonlarni bedana oviga olib chiqmoqchi? Toza havoda maza qilib bir aylanib kelasiz.", a: ["Xorunboy aka", "Umarali", "O'lmas", "Anvar"], correct: "Xorunboy aka"},

  {q: "Bilaman. Kim bedana oviga bormaydi? Oʻq yeb tipirchilab jon berayotgan bedanalarni koʻrishga yuragi dosh berolmaydi.", a: ["Umarali", "O'lmas", "G'upra", "Xorunboy aka"], correct: "Umarali"},

  {q: "U bolalik paytlarida uyda qoʻy soʻymoqchi boʻlsalar, uni qarindoshlarinikiga joʻnatib yuborardilar. Koʻrsa mutlaqo goʻsht yemay qoʻyadi, deb shunday qilishardi, hatto kalla-pochasigacha koʻz tushmaydigan joyga yashirib qoʻyardilar. Ta'rif kim haqida?", a: ["Umarali", "O'lmas", "G'upra", "Anvar"], correct: "Umarali"},

  {q: "Shunaqa injiq odamlarning xotiniga oson tutib boʻlmaydi. Kuniga necha martalab dastroʻmol-u kiyimbosh almashtiradiganlarning xotini kir yuvishdan boʻshamaydi. Uning xotinidan, kelin, tirikchilik qalay, deb soʻrayman. – Dorilfununga qoʻshniligimiz ham boshimizga balo boʻldi. Likkalikka kirib kelaveradilar. Bitta befahm men bilan quchoqlashib koʻrishdi, deb choʻmilib kiyim almashtirib chiqib ketadilar, sal vaqt oʻtmay, qoʻli terlaydigan jurnallardan, radiodan, televizorlardan oladigan qalamhaqlarini non puli qilib oʻtiribman. Ta'rif kim haqida?", a: ["Umarali", "O'lmas", "G'upra", "Xorunboy"], correct: "Umarali"},

  {q: "Kelin tagdor gapni tushunadigan qayerliklardan edi?", a: ["beshariqliklardan", "marg'ilonliklardan", "quvaliklardan", "nishonliklardan"], correct: "beshariqliklardan"},

  {q: "...ham gapni topib-topib gapiradigan serhazil kishi ekan. Kim edi bu?", a: ["Bosh shifokor", "Feldsher", "Rayon kotibi", "O'qituvchi"], correct: "Bosh shifokor"},

  {q: "Juda erka kasal chiqib qoldingiz. Nima yeb oʻralib yotsa tuzalib ketadigan narsaku bu. Bugun yotib bir uxlang, ertaga haydalasiz. Koʻryapsizmi, sizdan boshqa bitta ham \"bemor\" yoʻq. Bir oʻzingizga qozon-choʻmich, idish-tovoq qilib shuncha odamni ovora qilib oʻtiribmiz. Nima yesa tuzalib ketadi?", a: ["Serqalampir achchiq shoʻrva ichsa", "Issiq choy ichsa", "Asal bilan sut ichsa", "Ko'proq dam olsa"], correct: "Serqalampir achchiq shoʻrva ichsa"},

  {q: "Uchrashuvda negadir kimlar kam edi? Adabiyot muallimalarining hammasi shu yerda.", a: ["erkak muallimlar", "ayol muallimlar", "o'quvchilar", "rahbarlar"], correct: "erkak muallimlar"},

  {q: "Koʻrinishidan shaddodligi bilinib turgan bir qiz oʻrnidan turdi. U ogʻzidagi qoplama tilla tishni yaqinda qoʻydirgan boʻlsa kerak, boʻlar-boʻlmasga ogʻzini katta ochib kulardi. Kulib boʻlgandan keyin ham ogʻzi ochiqligicha qolardi. Uning oftob urib qoraygan yuzi, shamolda yorilib, qalinlashib ketgan edi. Bu qiz kim edi?", a: ["G'apura G'ufra", "Rono", "Gulchehra", "Mastura"], correct: "G'apura G'ufra"},

  {q: "G'afura O'lmas Umarbekovga qanday savol beradi?", a: ["Toshkent ayollarining hammasi shunaqami yo bitta sizniki shunaqa chiqib qolganmi?", "Nega ayollar haqida shunday yozasiz?", "Bu qahramon rostdan ham bo'lganmi?", "Siz o'zingiz shunday odammisiz?"], correct: "Toshkent ayollarining hammasi shunaqami yo bitta sizniki shunaqa chiqib qolganmi?"},

  {q: "Sevgim-sevgilim asarida qayerda Oypopuk degan qizni sevib qolganligi haqida aytiladi?", a: ["Yakkachinorda", "Marg'ilonda", "Quvada", "Nishonda"], correct: "Yakkachinorda"},

  {q: "\"Oqsoqol\" qoʻlini koʻtarib gʻovurni bosdi. U kim edi? Shaddodligi uchun uni \"oqsoqol\" derdilar. Hamon ogʻzini ochib turgan qizga qaradi.", a: ["kolxoz raisining madaniy ishlar boʻyicha birinchi oʻrinbosari", "rayon kotibi", "maktab direktori", "feldsher"], correct: "kolxoz raisining madaniy ishlar boʻyicha birinchi oʻrinbosari"},

  {q: "O'lmas Umarbekov kim aytganiday, \"ertaga qichishadigan joyini bugun qashlab qoʻyadiganlardan\" deb aytgan edi?", a: ["Abdulla Qahhor", "Oybek", "G'afur G'ulom", "Cho'lpon"], correct: "Abdulla Qahhor"},

  {q: "G'apuraning qaysi gapidan keyin oʻtirganlar birdan unga qiziqib qaradilar?", a: ["Yozuvchilar nima uchun shafqatsiz, rahmsiz, qahri qattiq boʻladi degan gapidan", "Adabiyot nima uchun kerak degan gapidan", "Kitob o'qish foydami degan gapidan", "O'zi yozuvchi bo'lishni xohlagani haqidagi gapidan"], correct: "Yozuvchilar nima uchun shafqatsiz, rahmsiz, qahri qattiq"},

  {q: "\"Oʻtkan kunlar\"dagi Kumushbibi, \"Boy ila xizmatchi\"dagi Jamilani, \"Qutlugʻ qon\"dagi Yoʻlchini, \"Sevgim-sevgilim\"dagi Oypopukni, Ufqdagi Tursunboyga nima boʻldi? Uni kim oʻldirdi? G'apura bu savolni nega berdi?", a: ["Albatta, yozuvchi oʻldirgan, shu uchun", "Ular urushda halok bo'lgan", "Taqdir shunday hukm qilgan", "Ular haqiqatda yashagan odamlar edi"], correct: "Albatta, yozuvchi oʻldirgan, shu uchun"},

  {q: "G'afuraga... Asarni qayerdan olib o'qiding, deganda \"Yozyovonimizda toʻqqizta odamda bu kitobning qoʻlda koʻchirilgan nusxasi bor. Shulardan bittasini oʻqidim-da!\" deydi. Qaysi asar haqida gap ketyapdi?", a: ["Kecha va Kunduz", "O'tkan kunlar", "Sevgim-sevgilim", "Ming bir jon"], correct: "Kecha va Kunduz"},

  {q: "Qaysi asarlardan bittasidayam odam o'lmaydi, \"Arshin mol olon\" kabi murod-maqsadlariga yetadi?", a: ["Oltin devor va kelinlar qozg'oloni", "Kecha va kunduz", "O'tkan kunlar", "Sevgim-sevgilim"], correct: "Oltin devor va kelinlar qozg'oloni"},

  {q: "Qizgina ishlab turib kechki maktabni \"oltin medal\" bilan tugatibdi. Adabiyotning qonun-qoidalarini mutlaqo bilmaydi. Buni unga tushuntiradigan odamning oʻzi yoʻq. Oʻzicha toʻgʻri-notoʻgʻri xulosalar chiqarib yuribdi. Ta'rif kim haqida?", a: ["G'upra haqida", "Rono haqida", "Gulchehra haqida", "Mastura haqida"], correct: "G'upra haqida"},

  {q: "Qaysi taraflarda unchalik koʻp oʻqiydigan kitob \"jinnisi\" yoʻq, desa boʻladi? Qani endi unga G'upraga bir rahnamo topilsa, Toshkentga oʻqishga yuborsa.", a: ["Quva taraflarda", "Beshariq taraflarda", "Nishon taraflarda", "Marg'ilon taraflarda"], correct: "Quva taraflarda"},

  {q: "Umarali yonida oʻtirgan Quvaning kotibi kimga shu fikrini aytgan edi, u oʻylanib qoldi. Yuzlarini oftob qoraytirib sopolga oʻxshatib qoʻygan, qir shamoli...", a: ["Ermatovga", "O'lmasga", "Xorunboy akaga", "G'upraga"], correct: "Ermatovga"},

  {q: "G'upralar oilasi Qashqadaryoning qaysi rayonidan koʻchib kelgan?", a: ["Nishon", "Qarshi", "Kitob", "Shahrisabz"], correct: "Nishon"},

  {q: "Otasi traktor ketida paxtaga dori sepib yurib oʻpkasini xasta qilib qoʻygan ekan. Bu oila vodiyga toza havo istab kelib qolgan edi. Oʻsha kezlarda Mark... Kim haqida gap ketyapti?", a: ["G'upra", "Umarali", "Rono", "Gulchehra"], correct: "G'upra"},

  {q: "G'upraning nechta akasi bor?", a: ["2 ta", "1 ta", "3 ta", "4 ta"], correct: "2 ta"},

  {q: "Bittasi Qoʻqonga qatnaydigan avtobusda haydovchi. Bittasi maishiy xizmat kombinatida raykomlarga, ispolkomlarga zoʻr kostyumlar tikadi... Kimning akalari bular?", a: ["G'upraning", "Rononing", "Umaralining", "Gulchehraning"], correct: "G'upraning"},

  {q: "G'upra kimning singlisi edi?", a: ["Ali partnoyning", "Xorunboy Ermatovning", "Umaralining", "Abdullaning"], correct: "Ali partnoyning"},

  {q: "G'upra qanday maktabda o'qir edi?", a: ["Kechki", "Kunduzgi", "Internat", "Musiqa maktabida"], correct: "Kechki"},

  {q: "Medalimni buvim dadam rahmatlining orden-medallari bilan sandiqda saqlardi. Noinsof akam buvimni aldab, medalimni olib, xotiniga nima yasatib beripti?", a: ["Tish", "Uzuk", "Sirg'a", "Bilaguzuk"], correct: "Tish"},

  {q: "Siz, \"akang senga Toshkentda kiyishingga bosh-oyoq kiyim tikib beradi\", deyapsiz. Agar akam birovga tekinga bitta nima qilib bersa, oʻsha kuni joni chiqib ketadi?", a: ["tugma qadab bersa", "yamoq solib bersa", "ip bersa", "ignani bersa"], correct: "tugma qadab bersa"},

  {q: "Buvim kelin boʻlib tushganda katta acham \"yuz ochdi\" kuni \"koʻrmana\"ga nima bergan ekan? Shuni sandiqdan olib menga berdi.", a: ["tilla toʻgʻnogʻich", "tilla uzuk", "tilla sirg'a", "kumush bilaguzuk"], correct: "tilla toʻgʻnogʻich"},

  {q: "Toʻgʻnogʻichni birpas tomosha qilib, keyin uni buvimga qaytib berdim. Bu toʻgʻnogʻich buvimga qaynonasidan esdalik. Necha yildan beri uni sira unutmasdan saqlab kelgan edi?", a: ["45", "35", "50", "40"], correct: "45"},

  {q: "Qayerda zoʻr tish texnigi bor, deb eshitgan edim. Oʻshanga uch kun qatnab rasmona tillodan qoplama qoʻydirib keldim.", a: ["Marg'ilonda", "Quvada", "Andijonda", "Farg'onada"], correct: "Marg'ilonda"},

  {q: "Necha yildan beri topgan pullarimning yarmidan koʻpini kassaga qoʻyardim?", a: ["5", "3", "7", "10"], correct: "5"},

  {q: "G'upraning bitta apachasi sartaroshga shogird tushib yurgan tojik bola bilan qayerga qochib ketgan?", a: ["Dushanbega", "Samarqandga", "Buxoroga", "Xo'jandga"], correct: "Dushanbega"},

  {q: "Bitta yangacham bolalar bogʻchasida murabbiy. Yana bitta yangacham yaqinda \"jijilagan\". Yaʼni boʻshangan. Hozir eshikda jiji boqib oʻtiripti. Buvim qayerda ekanini aytdi?", a: ["parranda fermasida", "uyida", "bog'chada", "fermer xo'jaligida"], correct: "parranda fermasida"},

  {q: "\"Ming bir jon\" degan asarini oʻqiganmisiz? Oʻqimagan boʻlsanglar albatta topib oʻqinglar. Ana oʻladi, mana oʻladi deb kutishayotgan bemor eshikdan olib kirilgan oʻz tobutini derazadan koʻrgan, ayvonda uning joni uzilishini kutayotgan gʻassolni koʻrgan. Bu kimning asari edi?", a: ["Mastura Aliyevaning", "Oybekning", "Abdulla Qahhorning", "O'lmas Umarbekovning"], correct: "Mastura Aliyevaning"},

  {q: "Qaysi asarning ham har bir soʻzini sinchiklab oʻqish kerak? Yozuvchi soʻz tagiga soʻz yashiradi. Oʻsha soʻzni topib oʻqish kerak. Oypopuk nega oʻzini... (qaysi asar haqida gap ketyapti)", a: ["Sevgim sevgilim", "Kecha va kunduz", "O'tkan kunlar", "Ming bir jon"], correct: "Sevgim sevgilim"},

  {q: "Kim bilan olishib ham boʻlmaydi, bas kelib ham boʻlmaydi? Hatto parrandalarning ham urgʻochisi jonini tikib \"qonli jangga\" kiradi.", a: ["Ayol kishi bilan", "Erkak bilan", "Bolasi bilan", "Dushman bilan"], correct: "Ayol kishi bilan"},

  {q: "...ham ana shunaqa shaddod, gapni bilib-bilib aytadigan, gʻururini yerga urmaydiganlardan edi. Kim edi bu?", a: ["Oqsoqol", "Umarali", "G'upra", "Rayon kotibi"], correct: "Oqsoqol"},

  {q: "Bu kitobni kechalari bolishimning tagiga qoʻyib yotaman. Har uygʻonganimda olib silab-silab joyiga qoʻyaman. Shuni yozgan yigitni bir koʻrarmikanman, deb nolalar qilganman. Mana, nolishim xudoga yetib, u bilan roʻbaroʻ qilib qoʻydi. Bu gaplarni aytgan qiz kim edi?", a: ["Oʻlmasdan koʻz uzolmay uning qoshlariga mahliyo boʻlib oʻtirgan suzikko'z qiz", "Baqaloq qiz", "G'apura", "Rono"], correct: "Oʻlmasdan koʻz uzolmay uning qoshlariga mahliyo boʻlib oʻtirgan suzikko'z qiz"},

  {q: "Bir baqaloq qiz oʻrnidan turdi. – Endi uni qoʻldan chiqazma. Mahkam ushla! Toʻyananing kattasi mendan sendan nima aylansin, deydi?", a: ["Qo'y", "Ho'kiz", "Toy", "Tuya"], correct: "Qo'y"},

  {q: "Suzukkoʻz qiz nozlanib kimni \"eritmoqchi\" boʻldi? Kim Toshkentda ne-ne tam-tam qizlarning \"tuzogʻi\"dan omon chiqqan, bu masalada katta malaka orttirgan yigitlardan edi. Bu qizning nozu karashmalaridan ichida kulibgina oʻtirardi. Qiz uning oldiga kitob bilan ruchka qoʻydi.", a: ["O'lmas", "Umarali", "Xorunboy aka", "Anvar"], correct: "O'lmas"},

  {q: "\"Shunga dastxat yozib bering. Iltimos, singlim demang...\" Qoʻy toʻyana qilmoqchi boʻlgan qiz gap qotdi: \"nima deb\" deb yozsinmi? Dedi. Yana kulgi, yana chapak boʻldi. Nima deb yozdi?", a: ["Sevgim-sevgilim, koʻzlarimning oq-u qora", "Sevgilim, umrbod unutilmaysan", "Sizga hurmat bilan", "Eng yaxshi tilaklarim bilan"], correct: "Sevgim-sevgilim, koʻzlarimning oq-u qora"},

  {q: "\"Koʻp yozing, – dedi u, – yaxshilab yozing, menga qarab turib yozing.\" Bu gapni aytgan qizning ismi kim edi?", a: ["Rono", "Gulchehra", "Mastura", "G'upra"], correct: "Rono"},

  {q: "Rononing nechta opachasi bor?", a: ["3 ta", "2 ta", "4 ta", "1 ta"], correct: "3 ta"},

  {q: "\"Xudo xohlasa, tilla tish qoʻydirganimdan keyin Toshkentga boraman, koʻrishib qolarmiz.\" – \"Toshkentlik bechoralar umrida tilla tish koʻrmagan. Qoʻlingdan sudrab telestudiyaga opkirib ketadi. Oʻshaqda kim boʻlib qolib ketishing ham mumkin,\" – qizlarning kalaka qilib aytgan soʻzlarini ham \"Roʻnoʻ\" yaxshilikka yoʻydi. Nima boʻlib qolishi mumkin edi?", a: ["Diktor", "Artist", "O'qituvchi", "Jurnalist"], correct: "Diktor"},

  {q: "\"Boʻlishi mumkin. Hayotda nimalar boʻlmaydi,\" – deb javob qildi ularga. Dastxat yozilgan kitobni olarkan birov eshitmaydigan qilib sekingina, har qanday erkakni eritib, \"uygʻotib\" yuboradigan gʻalati gʻamza bilan nima dedi?", a: ["Ikkalamiz birga suratga tushaylik", "Meni unutmang", "Yana kelib turing", "Xat yozib turaman"], correct: "Ikkalamiz birga suratga tushaylik"},


    /* ===== 3*** ===== */

  {q: "\"Katta\" Anvarjondan boshqa yana nechta farzand koʻrgan edi?", a: ["4", "3", "5", "6"], correct: "4"},

  {q: "Oʻrtancha oʻgʻli kim yuvosh, qoʻli gul duradgor boʻldi. Poytesha chopganda toʻsinning betini oyna qilib yuboradi. Atrof qishloqlardagi imoratlarni kim qurdirardi?", a: ["Muxtorali", "Anvarjon", "Hamroali", "Nishon bobo"], correct: "Muxtorali"},

  {q: "\"Katta\" choyxonalarda joʻralariga hasrat qilib qoladi: \"Muxtoralini uylaganimga mana toʻrt yil boʻlay deyapti, endi nechta bolali boʻldi? Bolasi koʻpaymadi...\" Kattaning ismi kim edi?", a: ["Mulla Muqim", "Nishon bobo", "Anvarjon", "Hazrati Muqimiy"], correct: "Mulla Muqim"},

  {q: "Mulla Muqimning toʻngʻich oʻgʻlining ismi kim edi?", a: ["Anvarjon", "Muxtorali", "Hamroali", "Nishon bobo"], correct: "Anvarjon"},

  {q: "Anvarjonning oʻgay-begonalarni aralashtirmasdan, oʻzining nechta farzandi bor edi?", a: ["7", "5", "6", "8"], correct: "7"},

  {q: "Mulla Muqimning kenjasi kim erkaroq, subutsizroq chiqdi? Oʻqishga ham, ishga ham boʻyin bermadi.", a: ["Hamroali", "Muxtorali", "Anvarjon", "Nishon bobo"], correct: "Hamroali"},

  {q: "Kimning tupugi kuchini koʻrsatadi deyishadi, ammo u kishi bedarzand (farzandsiz) edi?", a: ["Hazrati Muqimiy", "Mulla Muqim", "Nishon bobo", "Anvarjon"], correct: "Hazrati Muqimiy"},

  {q: "\"Katta\" feʼlda, qilar ishda otasi kimga tortdi? Bir ish qiladigan boʻlsa yetti oʻlchab bir kesardi. Foydasi qanchayu ziyoni qancha, aql taroziga solib koʻrardi. Foyda bermaydigan ishni ish demasdi.", a: ["Nishon boboga", "Mulla Muqimga", "Hazrati Muqimiyga", "Anvarjonga"], correct: "Nishon boboga"},

  {q: "Kim uzoq yillar maktab direktori, kolxoz buxgalteri, iqtisodchisi, kolxoz raisi boʻldi? U shu lavozimlarda ishlagan paytlarda kolxozga yulgʻichlarni yoʻlatmadi, oʻzi ham yemadi, birovga ham yedirmadi. Uyiga kolxozdan aqalli bitta piyoz koʻtarib kelmadi. Bu kim edi?", a: ["Anvarjon", "Muxtorali", "Hamroali", "Mulla Muqim"], correct: "Anvarjon"},

  {q: "Anvarjonning xotinining ismi nima edi?", a: ["Bumayram", "Oynisa bibi", "To'xtanisa", "To'xtaxon"], correct: "Bumayram"},

  {q: "Anvarjonlar qanday ovqat yeyishar edi?", a: ["Otasi nima chiqarsa shuni", "Har xil taomlar", "Faqat go'sht taomlar", "Bozordan sotib olingan"], correct: "Otasi nima chiqarsa shuni"},

  {q: "Har kuni qanaqa ovqat chiqarishar edi?", a: ["bir xil", "har xil", "kamdan-kam", "faqat bayramlarda"], correct: "bir xil"},

  {q: "Bugun otasi qanaqa ovqat chiqargan edi?", a: ["Toʻrttagina jazi bor, non bilan kartoshka qorishtirib dimlangan \"non-palov\"", "Go'shtli palov", "Shoʻrva", "Manti"], correct: "Toʻrttagina jazi bor, non bilan kartoshka qorishtirib dimlangan \"non-palov\""},

  {q: "Xotin kishining birovga aytib boʻlmaydigan xarjlari boʻladi. Nechi tiyinlik narsani ham aptekadan nasiyaga olar edi?", a: ["4", "2", "6", "8"], correct: "4"},

  {q: "Sobesdan bolalar uchun beriladigan nafaqani pochtachi kimning qoʻllariga berib ketardi?", a: ["Kattaning", "Bumayramning", "Anvarjonning", "Muxtoralining"], correct: "Kattaning"},

  {q: "\"Turaqoling, dadasi, guzarga chiqib nasiyaga boʻlsa ham nima topib keling\", deydi Bumayram eriga?", a: ["Go'sht", "Non", "Guruch", "Yog'"], correct: "Go'sht"},

  {q: "\"...Yoʻlakay ovsinim kimni aytib yuboring, harqalay, xotin kishi, yonimda boʻlsa...\" — bu yerda kim nazarda tutilgan?", a: ["To'xtanisani", "To'xtaxonni", "Oynisa bibini", "Bumayramni"], correct: "To'xtanisani"},

  {q: "Anvarjonning yoʻl puli xarjlanmay yonida qolgandi. Qayerlik tanishi mashinasida olib kelgan edi?", a: ["Oltiariqlik", "Marg'ilonlik", "Quvalik", "Nishonlik"], correct: "Oltiariqlik"},

  {q: "Anvarjonning yoʻl puli xarjlanmay yonida qolgandi. Oltiariqlik tanishi mashinasida olib kelgan, uni qayerga tashlab, oʻzi Bogʻdod tomonga oʻtib ketgan edi?", a: ["Yaypanga", "Marg'ilonga", "Quvaga", "Farg'onaga"], correct: "Yaypanga"},

  {q: "\"Katta\"ning nevara-evaralari koʻzlarini ocholmay bemajol yotishibdi. Cholni vahm bosdi. U tong-saharda oʻn-oʻn beshta issiq nonni qiyiqqa tugib, Muxtoralining xotini kimni ergashtirib kirdi?", a: ["To'xtaxonni", "To'xtanisani", "Bumayramni", "Oynisa bibini"], correct: "To'xtaxonni"},

  {q: "Sahar payti Anvarjon tomorqadan tanlab-tanlab nima olib kelgan edi?", a: ["jo'xori qayirib chiqqan", "makkajo'xori qo'chqon", "sabzavot", "sholi"], correct: "jo'xori qayirib chiqqan"},

  {q: "\"Bumayram, – dedi u hamon quvnoq kayfidan tushmay. – Buning muncha yengil, – dedi inqillab oʻtirgan keliniga.\" Kelini nima deb javob berdi?", a: ["Og'irligi sizning cho'ntagingizda-ku, – dedi", "Yengilroq bo'lsa yaxshi, – dedi", "Meniki og'irroq, – dedi", "Kim aytdi yengil deb, – dedi"], correct: "Og'irligi sizning cho'ntagingizda-ku, – dedi"},

  {q: "\"Voh!\" dedi peshonasiga shapillatib urarkan. \"Shuncha nevara-evaralarimning qoʻlida aqalli bitta... Boshqalarning hovlisi bu narsadan toʻlib ketgan.\" Nimani koʻrmaganini afsuslanib aytdi?", a: ["Bitta qo'g'irchoq, bitta o'yinchoq ko'rmabman-a!", "Bitta yangi kiyim ko'rmabman-a!", "Bitta shirinlik ko'rmabman-a!", "Bitta kitob ko'rmabman-a!"], correct: "Bitta qo'g'irchoq, bitta o'yinchoq ko'rmabman-a!"},

  {q: "\"Katta\" keyingi kunlarda ancha kuchdan qolgan edi, bu nimadan sezilar edi?", a: ["har ikki qadamda toʻxtab nafasini rostlab olar edi", "ovqatdan qolganidan", "gapirmay qo'yganidan", "yotib qolganidan"], correct: "har ikki qadamda toʻxtab nafasini rostlab olar edi"},

  {q: "Nimaning hisobiga \"tejamkorlik\" qilganini, \"iqtisodiy siyosat\" yurgizganini qanchalik achchiq, qanchalik alamli boʻlmasin tan olishga majbur edi?", a: ["Norasta bolalar va shularning sog'lig'ini yemiradigan tejamkorlik qilganini", "O'z sog'lig'ini yemiradigan tejamkorlik qilganini", "Xotinining mehnatini yemiradigan tejamkorlik qilganini", "Kolxoz mablag'ini yemiradigan tejamkorlik qilganini"], correct: "Norasta bolalar va shularning sog'lig'ini yemiradigan tejamkorlik qilganini"},

  {q: "Shu payt qushdek yengil bir kampirni yetaklab olib kirishdi. U \"Katta\"ning xotini kim edi?", a: ["Oynisa bibi", "Bumayram", "To'xtanisa", "To'xtaxon"], correct: "Oynisa bibi"},

  {q: "U \"Katta\"ning xotini Oynisa bibi edi. Uni katta-yu kichik kim deb atardi?", a: ["Ena", "Buvi", "Kampir", "Momo"], correct: "Ena"},

  {q: "Bumayramning ahvoli ogʻir edi. Erkak odam xotin kishining dardini bilarmidi. Unga nima ichirish kerak edi?", a: ["atala qilib", "sut qaynatib", "sho'rva qilib", "choy damlab"], correct: "atala qilib"},

  {q: "\"Kimning loaqal uch-toʻrt kun yotmay ishga urinib ketishi, ochnahor qolishi oʻlim bilan barobarligini nahot bilmasding? Bunaqada bepusht boʻlib qolishingni ham bilmasmiding\", deb ich-ichidan unga achinardi. Bu kim haqida edi?", a: ["Yangi bo'shangan xotinning", "Kasal bo'lgan bolaning", "Kuchdan qolgan cholning", "Charchagan kelinning"], correct: "Yangi bo'shangan xotinning"},

  {q: "Uch-toʻrt kundan beri xushi oʻzida emas edi. Saharlab turib ayvon dahanida oʻtirib oʻyga tolar, qayoqqadir chiqib ketardi, kechgacha sanqib, charchab qaytib kelardi. Ichkari uyga kirib chiroq yoqib pul sanardi, yana chiqib ketardi. Bu kim edi?", a: ["Mulla Muqim", "Anvarjon", "Muxtorali", "Nishon bobo"], correct: "Mulla Muqim"},

  {q: "\"Katta\"ning Ena oldida obroʻsi qolmagandek edi. U eriga shart-shart gapirar, baʼzan uning ogʻiz ochishiga ham qoʻymay, siltab tashlardi. Bunga sabab nima edi?", a: ["eshikda to'y qozonida har kuni \"non-palov\" damlanishi-yu, katta-yu kichik shu \"ovqat\"ni yeyishga majbur bo'lishi", "pulning kamayib ketgani", "uyning tor bo'lib qolgani", "mehmonlarning ko'payib ketgani"], correct: "eshikda to'y qozonida har kuni \"non-palov\" damlanishi-yu, katta-yu kichik shu \"ovqat\"ni yeyishga majbur bo'lishi edi"},

  {q: "Ena necha yoshning nariyogʻiga oʻtgan, taʼmsiz, jirsiz taomdan sillasi qurib, oʻz tili bilan aytganda, \"oʻlar holatga\" yetgan, kuch-quvvatdan qolgan xotin edi?", a: ["70", "60", "80", "65"], correct: "70"},

  {q: "\"Bu... bolaginamning happayi-halol puli. Baraka topkur, yotib yesa tamom boʻlmaydigan pul topgan. Hunar, hunardan unar, deydilar.\" Bu kimning puli haqida gap ketyapti?", a: ["Muxtoralining", "Anvarjonning", "Hamroalining", "Mulla Muqimning"], correct: "Muxtoralining"},

  {q: "\"Hozir ham bolaginam 'Bibi Ubayda'da, zagotzernoning pajarnigi Luqmonbekning eshigida yotib ishlayapti.\" Bu kim haqida gap ketyapti?", a: ["Muxtorali", "Anvarjon", "Hamroali", "Nishon bobo"], correct: "Muxtorali"},

  {q: "U xaltadan olgan xom gʻishtdek ogʻir, toʻrtburchak tugunni Bumayram tomon surib qoʻydi. Keyin yana toʻrvani titib, kichikroq tugunchak oldi. U nima pullari edi?", a: ["Anvarjonning oʻn besh yilda topgan pullari va kichigi bolalar uchun sobes yuborgan nafaqa pullari", "Muxtoralining ish haqi pullari", "Mulla Muqimning pensiya pullari", "Hamroalining o'yin puli"], correct: "Anvarjonning oʻn besh yilda topgan pullari. Kichigi bolalaring uchun sobes yuborgan nafaqa pullar"},

  {q: "Shu paytgacha hammani chol qaysi pulga boqqan va bu pul \"non-palov\"ga zoʻrgʻa yetardi?", a: ["oʻz pensiya puliga", "Anvarjon yuborgan pulga", "kolxozdan olgan pulga", "Muxtoralining puliga"], correct: "oʻz pensiya puliga - Kuchdan qolgan cholning topgani shunga yetardi xolos"},

  {q: "\"Koʻzim yumilganda oʻrab-chirmab, makonimga oborib qoʻysanglar, bas. Faqat bitta iltimosim bor. Shu iltimosim bajo boʻlmasa, goʻrimda tinch yotolmayman. ...sovugʻidan xabar olib turinglar, tashlab qoʻymanglar\" — bu kim haqida aytilgan iltimos edi?", a: ["Hamroalini", "Muxtoralini", "Anvarjonni", "Nishon boboni"], correct: "Hamroalini"},

  {q: "\"Bolam, – dedi 'Katta', – gaplarimga yaxshilab quloq sol. Biz bir xonadon uch xil odam boʻlib yashadik.\" Bular kimlar edi?", a: ["Otasi Nishonbobo, o'zi Katta, o'g'li Anvarjon", "Otasi Katta, o'zi Anvarjon, o'g'li Hamroali", "Otasi Muqimiy, o'zi Nishonbobo, o'g'li Katta", "Otasi Anvarjon, o'zi Muxtorali, o'g'li Hamroali"], correct: "Otasi Nishonbobo, O'zi katta, Og'li Anvarjon"},

  {q: "Kim irim-sirimlarga mukkasidan ketgan omi odam edi?", a: ["rahmatli Nishon bobo", "Mulla Muqim", "Hazrati Muqimiy", "Katta"], correct: "rahmatli Nishon bobo"},

  {q: "\"Otam irim-sirimlarga mukkasidan ketgan omi odam edi. Men shafqatsiz, zolim ota boʻldim\" — bu gapni kim aytmoqda?", a: ["Katta", "Anvarjon", "Muxtorali", "Nishon bobo"], correct: "Katta"},

  {q: "\"Sen itoatkor, jurʼatsiz, zabun bola boʻlding. Sening shunaqa boʻlishingga men, mening shunaqa boʻlishimga otam sababchi.\" Itoatkor bola kim edi?", a: ["Anvarjon", "Muxtorali", "Hamroali", "Katta"], correct: "Anvarjon"},

  {q: "\"Katta eshigimizdagi tomorqaning kunbotar tomoniga... ta terak qalamchasini qadagan edim.\" Qancha terak qalamchasi qadalgan edi?", a: ["200", "150", "100", "250"], correct: "200"},

  {q: "\"Katta eshigimizdagi tomorqaning kunbotar tomoniga ikki yuzta terak qalamchasini qadagan edim.\" Necha yilda yoʻgʻonligi filning sonidek boʻldi?", a: ["Yetti", "Besh", "O'n", "Sakkiz"], correct: "Yetti"},

  {q: "Terak qalamchalari qadalganiga, Xudo xohlasa, jami necha yil boʻlgan edi?", a: ["20 yil", "15 yil", "25 yil", "10 yil"], correct: "20 yil"},

  {q: "\"Bugun hamma nevara-evaralarimni Qoʻqonga oborib, nimaga toʻydiraman\"?", a: ["kabobga", "palovga", "manti-yu somsaga", "shirinlikka"], correct: "kabobga"}
];

 {q: "Erkin Vohidov qayer markazidagi mahallada tugʻilgan?", a: ["Oltiariq", "Marg'ilon", "Quva", "Nishon"], correct: "Oltiariq"},

  {q: "Qarindoshlari bilan yuz koʻrishsin, deb kim urugʻlariga xabar qilib qoʻygan ekan? Birpasda uni urugʻ-aymoqlari oʻrab olishdi.", a: ["Adham", "Turobov", "Qodirjon", "Mamatoji Ibrohimov"], correct: "Adham"},

  {q: "Kimning imosi bilan beshta skameyka, uchta stol olib kelishdi?", a: ["Rais Fayzimatovning", "Adham Hamdamning", "Urkinboyevning", "Turobovning"], correct: "Rais Fayzimatovning"},

  {q: "\"Oyogʻining tagiga manavu jonliqni soʻyinglar\", – dedi Oltiariqning pichogʻi keskir, vallomat fuqarosi kim, bir qora qoʻchqorni dumbasidan itarib davraga kiritib yubordi?", a: ["Mamatoji Ibrohimov", "Qodirjon", "Rais Fayzimatov", "Urkinboyev"], correct: "Mamatoji Ibrohimov"},

  {q: "Kim yelib-yugurib xizmat qilyapti? U turgan-bitgani faqat burundan iborat boʻlgan bir kishini dasturxonning toʻriga oʻtqizib qoʻydi.", a: ["Adham", "Qodirjon", "Turobov", "Mamatoji Ibrohimov"], correct: "Adham"},

  {q: "Oltiariqliklar qaysi soʻzni ogʻzilariga ham olmasdilar? Ular bu soʻz oʻrniga \"Dimogʻ\", \"Oʻgʻil sumak\", \"Damskiy kabluk\", \"Pasport\" deb atardilar.", a: ["Burun", "Og'iz", "Quloq", "Ko'z"], correct: "Burun"},

  {q: "Shu odam Oltiariq imomiga meni ham hajga boradiganlar roʻyxatiga qoʻshib qoʻying, deb iltimos qilganda, imom nima deb javob berdi va nima qildi?", a: ["Hoji badal va gapida turib hujjatini ham ob kepdi", "Rad etib, boshqa yil boring dedi", "Pul topib keling, keyin gaplashamiz dedi", "Ro'yxatga qo'shib qo'ydi, boshqa gap bo'lmadi"], correct: "Hoji badal va gapida turib hujjatini ham ob kepdi"},

  {q: "Mamatoji Ibrohimovning oʻgʻli kim, askiyaga chechan yigit edi?", a: ["Qodirjon", "Adham", "Turobov", "Anvar Obidjon"], correct: "Qodirjon"},

  {q: "Qodirjon askiyaga chechan yigit edi. Shu tobda tili qichib, shumligi tutdi: \"– Erkin aka, oʻzimizning Oltiariqdan chiqqan bolasiz. Muncha dimogʻ-firoq qilasiz. Dimogʻingizdan nima tushadi\", – deb yubordi. Nima dedi?", a: ["eshak qurti", "pilla qurti", "yer qurti", "ipak qurti"], correct: "eshak qurti"},

  {q: "Oltiariqliklar \"puchuq\" deb nazarga ilmagan, Oʻlmas Umarbekov, Umarali Normatov, Xudoyberdi Toʻxtaboyev, Anvar Eshonovlar qatorida oʻtirgan kim edi?", a: ["Oʻtkir Hoshimov", "Anvar Obidjon", "Qobiljon Yusupov", "Turobov"], correct: "Oʻtkir Hoshimov"},

  {q: "Bir xotin xokandozda tutuni buralib-buralib chiqayotgan isiriq olib keldi. Hammamizga bir-bir tutatib, Oʻlmasga kelganda xokandozni uning boshidan qancha marta aylantirdi?", a: ["3", "2", "4", "5"], correct: "3"},

  {q: "Hozir qaysi jonzot dahaga kirgan, qancha barg bersang koʻrdim demaydi?", a: ["pilla qurti", "eshak qurti", "chigirtka", "qurbaqa"], correct: "pilla qurti"},

  {q: "Qaysi tuman butun Oʻzbekistondagi nomdor tumanlardan biri, hamma vaqt oldinda yurishga odatlangan?", a: ["Oltiariq", "Nishon", "Beshariq", "Quva"], correct: "Oltiariq"},

  {q: "Qishloq xoʻjaligi vaziri kim, ot minib tutzorlarni oralaydi? Qurt boqayotgan xonadonlarga kirib, uni undoq qil, buni bundoq qil, deb koʻrsatma beradi.", a: ["Urkinboyev", "Turobov", "Rais Fayzimatov", "Musajon Sherbo'tayev"], correct: "Urkinboyev"},

  {q: "Xullas, tumanda kimlargina \"bekorchi\" edilar?", a: ["inqillab qolgan kampirlar-u hali yoʻlga kirmagan goʻdaklargina", "yosh yigitlar", "maktab o'qituvchilari", "kolxoz raislar"], correct: "inqillab qolgan kampirlar-u hali yoʻlga kirmagan goʻdaklargina"},

  {q: "Qachon tuman markazida odam yigʻib uchrashuv qilish taʼna-malomatlarga sabab boʻlishi mumkin edi?", a: ["Shundoq ish qizigan paytda", "Bayram kunlarida", "Qish faslida", "Imtihon davrida"], correct: "Shundoq ish qizigan paytda"},

  {q: "Adham nima qilgach baqalar birdan jimib qolishdi, xuddi kimdir tinimsiz shangʻillab turgan radioni oʻchirib qoʻygandek boʻldi?", a: ["hasipga tozalangan ikki qarichdan moʻlroq puflab shishirilgan ichak olib keldi va suvga tashlab kafti bilan suvni oʻrtaga haydab yubordi", "hammani ovqatga chorladi", "musiqa qo'ydi", "gapni to'xtatib eʼlon qildi"], correct: "hasipga tozalangan ikki qarichdan moʻlroq puflab shishirilgan ichak olib keldi. Uni chayqalib turgan suvga tashlab kafti bilan suvni surib oʻrtaga hayday b"},

  {q: "Adabiyot oʻqituvchilari, oʻninchi, oʻn birinchi sinflarda oʻqiydigan adabiyotga qiziqqan oʻgʻil-qizlar, tuman gazetasida sheʼrlari, hikoyachalari bosilib turadigan yosh yozuvchilar chaqirilgan uchrashuvga nechchi kishiga moʻljallab joy qilingan edi?", a: ["70", "50", "60", "90"], correct: "70"},

  {q: "Uzoq brigadalarga odam olib boradigan usti yarim yopiq mashina qancha chogʻli qizni xuddi konservadek qapishtirib olib keldi?", a: ["20", "15", "25", "10"], correct: "20"},

  {q: "Tuflisini qoʻliga olib yalangoyoq tuproq kechib kelgan bir qiz odamlarga orqa oʻgirib choʻnqaygancha ariqda oyogʻini yuvyapti. U tuflisini kiyib biz tomonga kelganda kim ekani maʼlum boʻldi?", a: ["Ro'no", "G'upra", "Gulchehra", "Mastura"], correct: "Ro'no"},

  {q: "Uchrashuvdan xabar topgan adabiyot ixlosmandlari Namangan, Andijon taraflardan \"Jiguli\"da va yana qaysi mashinada yetib kelgan edilar?", a: ["Moskvich", "Volga", "Zaporojets", "Pobeda"], correct: "Moskvich"},

  {q: "Bir ashaddiy kitobxon qayerdan shu bugun ertalab tutgan oltmish kilo keladigan laqqani ikkita hoʻl qanorga oʻrab, \"Moskvich\" yukxonasida olib kelgan edi?", a: ["Norindan", "Oltiariqdan", "Marg'ilondan", "Quvadan"], correct: "Norindan"},

  {q: "Uchrashuv qatnashchilarining soni nechtadan oshdi? Yana oltita skameyka qoʻyib ularni ham oʻtqizdik.", a: ["90", "70", "80", "100"], correct: "90"},

  {q: "Yigʻilishni viloyat vakili sifatida kim boshqaradigan boʻldi? Men esa kelgan mehmonlarni bir-bir tanishtira boshladim.", a: ["Adham Hamdam", "Turobov", "Urkinboyev", "Rais Fayzimatov"], correct: "Adham Hamdam"},

  {q: "\"Bu yozuvchini atomniy yozuvchi deb atash kerak. Oʻzi kichkina boʻlsa ham portlashi nihoyatda kuchli\" — kim haqida aytilgan?", a: ["O'tkir Xoshimov", "Xudoyberdi To'xtaboyev", "Anvar Eshonov", "Umarali Normatov"], correct: "O'tkir Xoshimov"},

  {q: "Mening chap tarafimda qaysi yozuvchi oʻtirar, u \"Namoz botir\" asarini yozgan edi?", a: ["Xudoyberdi To'xtaboyev", "O'tkir Xoshimov", "Anvar Eshonov", "Umarali Normatov"], correct: "Xudoyberdi To'xtaboyev"},

  {q: "Anvar Eshonov degan yozuvchini qayerdagi oʻrta maktabda adabiyotdan dars beradigan oʻqituvchi, uni viloyat gazetasida 3 kundan beri hikoyalari birin-ketin bosib chiqilyapti deydi?", a: ["Naymanboʻstondagi", "Oltiariqdagi", "Norindagi", "Quvadagi"], correct: "Naymanboʻstondagi"},

  {q: "Ikki sonda quvalik mashhur kolxoz raisi kimning ilgʻor xoʻjaligi toʻgʻrisida juda qiziq, juda oʻqishli hikoyalari bosilgan edi?", a: ["Musajon Sherboʻtayev", "Bozorboy Otaqulov", "Urkinboyev", "Turobov"], correct: "Musajon Sherboʻtayev"},

  {q: "Endi oʻzimizning qahramon raisimiz, hammamizning mehribon otaxonimiz kim toʻgʻrisidagi hikoyalari davomli boʻlib bosila boshladi?", a: ["Bozorboy Otaqulov", "Musajon Sherboʻtayev", "Rais Fayzimatov", "Urkinboyev"], correct: "Bozorboy Otaqulov"},

  {q: "Odatda adabiy asar hayotda boʻlishi mumkin voqealarni hikoya qilardi. Anvar akamiz haqida birinchi marta hikoya oʻqiyotganimiz uchun yozganlari qanday odamlar toʻgʻrisida edi?", a: ["Ism-familiyasi aniq, ish joyi aniq, qishlogʻi aniq odamlar to'g'risidagilar", "Xayoliy, to'qima qahramonlar to'g'risidagilar", "Tarixiy shaxslar to'g'risidagilar", "Ertak qahramonlari to'g'risidagilar"], correct: "Ism-familiyasi aniq, ish joyi aniq, qishlogʻi aniq odamlar to'g'risidagilar"},

  {q: "Oʻquvchilarimiz u yoqda qolib qishloqliklar gazeta soʻrab kelaverishadi, kelaverishadi. \"Shuncha odamga qayoqdan gazeta topib beraman\", deb kim aytardi?", a: ["Direktorimiz", "Adham Hamdam", "Turobov", "Urkinboyev"], correct: "Direktorimiz"},

  {q: "Navbat kimga keldi? Uni oʻtirganlarga juda boloxonador qilib taʼriflay boshladim: Oʻrta Osiyo Davlat universitetining professori, filologiya fanlari doktori.", a: ["Umarali Normatovga", "O'tkir Xoshimovga", "Xudoyberdi To'xtaboyevga", "Anvar Eshonovga"], correct: "Umarali Normatovga"},

  {q: "Sochlari oqarib ketgan, koʻrinishidan koʻp savdolar boshiga tushgani bilinib turgan keksa oʻqituvchi kim oʻrnidan turdi?", a: ["Risqiyev", "Turobov", "Urkinboyev", "Adham Hamdam"], correct: "Risqiyev"},

  {q: "U elliginchi yillarning boshlarida \"Oʻtkan kunlar\" romani hamda Abdulla Qodiriy toʻgʻrisida bolalarga gapirib bergani uchun yetti yilga kesilib, toʻrt yilda... kim edi bu?", a: ["Rizqiyevni", "Turobovni", "Adham Hamdamni", "Urkinboyevni"], correct: "Rizqiyevni"},

  {q: "Bayramlarda, oʻqituvchilar kunida, Gʻalaba bayramida hamma oʻqituvchilarga chiroyli konvertlarda zar bilan bitilgan tabriknomalar topshirishardi. Kimga bu tabriknoma berilmasdi?", a: ["Rizqiyevni", "Turobovni", "Adham Hamdamni", "Urkinboyevni"], correct: "Rizqiyevni"},

  {q: "Maorif vazirining oʻrinbosari kim, Oltiariqqa kelganda vaqt topib Risqiyevga uchrashardi, ikkovi uzoq suhbatlashar edilar?", a: ["Turobov", "Urkinboyev", "Adham Hamdam", "Rais Fayzimatov"], correct: "Turobov"},

  {q: "\"Bu... xoʻp yurak yutgan odamda, tarjimayi holiga siyosiy dogʻ tushgan odam bilan koʻpchilik oʻrtasida hech kimdan hayiqmay gaplashishini qarang!\" deb direktor ichida kimning ta'rifini oʻylardi?", a: ["Turobov", "Risqiyev", "Urkinboyev", "Adham Hamdam"], correct: "Turobov"},

  {q: "\"Doʻstim, – dedi u. – Endi boshingizni koʻtarib yuring. Sizni chin dildan tabriklayman. Bugungi 'Xalq soʻzi'da professor Umarali Normatovning kimning hamda uning asarlari toʻgʻrisida juda chiroyli maqolasi bosilgan?\"", a: ["Abdulla Qodiriyning", "Cho'lponning", "Abdulla Qahhorning", "Oybekning"], correct: "Abdulla Qodiriyning"},

  {q: "\"Men birovga sovgʻa beradigan darajadagi odamlardan emasman. Qizim oʻz qoʻli bilan tikkan qanaqa doʻppini aql toʻla boshingiz omon boʻlsin, deb kiygizmoqchi boʻldi?\"", a: ["margʻilonnusxa", "chust nusxa", "andijon nusxa", "namangan nusxa"], correct: "margʻilonnusxa"},

  {q: "Professorimiz umrida biron odamdan sovgʻa olmagan. Lekin shu doʻppini kim oladi?", a: ["Umarali", "Turobov", "Risqiyev", "Adham Hamdam"], correct: "Umarali"},

  {q: "U kishining uylariga turp, oʻrik-qoqi, anor orqalab bola ergashtirib kelishadi. \"Eti sizniki, suyagi bizniki, hozircha uyingizda xizmatingizni qilib yursin\", deb kimga aytishadi?", a: ["Umaraliga", "Turobovga", "Risqiyevga", "Adham Hamdamga"], correct: "Umarali"},

  {q: "Professor ularning bolamni oʻqishga oʻzing kiritib qoʻy, demoqchiligini darrov tushunadi. Qoplarni oʻzlariga orqalatib, koʻchaga chiqarib qoʻyadi. Bu qaysi professor edi?", a: ["Umarali", "Turobov", "Risqiyev", "Adham Hamdam"], correct: "Umarali"},

  {q: "Oybek-u, Gʻafur Gʻulom-u, Abdulla Qahhorlar gurkiragan qaysi shaharda edi?", a: ["Toshkentdek", "Samarqanddek", "Buxorodek", "Farg'onadek"], correct: "Toshkentdek"},

  {q: "Kutubxonachi aytishicha, kimning kitoblarini bolalar qoʻliga berdimmi, tamom, qaytib ololmayman? Ota-onalari, qarindosh-urugʻlari, qoʻni-qoʻshnilari bilan oʻqib, oxiri izini yoʻqotadilar.", a: ["Oʻlmas Umarbekovning", "O'tkir Xoshimovning", "Xudoyberdi To'xtaboyevning", "Anvar Eshonovning"], correct: "Oʻlmas Umarbekovning"},

  {q: "Kutubxonamizda Umarbekovning nechta kitobi bor edi? Hozir bittasi ham yoʻq.", a: ["3", "2", "4", "5"], correct: "3"},

  {q: "Kutubxonada Oʻlmas Umarbekovning asari uchun navbatda turgan nechta odam bekorga kutib oʻtiripti?", a: ["81", "80", "70", "90"], correct: "81"},

  {q: "Kimning qaysi kitoblari qoʻlimizdan bir chiqib ketgancha qaytib kelmadi, yoʻqolib ketdi? Kitobni olgan bolaning ota-onalariga jarima ham soldik, toʻladi, baribir kitob qaytib kelmadi.", a: ["Oʻtkir Hoshimovning \"Bahor qaytmaydi\", \"Dunyoning ishlari\"", "Oʻlmas Umarbekovning asarlari", "Xudoyberdi To'xtaboyevning asarlari", "Anvar Eshonovning asarlari"], correct: "Oʻtkir Hoshimovning \"Bahor qaytmaydi\", \"Dunyoning ishlari\""},

  {q: "Kutubxonada Oʻtkir Xoshimovning asari uchun navbatda turgan nechta odam bekorga kutib oʻtiripti?", a: ["80", "81", "70", "90"], correct: "80"},

  {q: "Kimning yoʻrigʻi boshqa? Nashriyotlar uning bozorgir kitoblarini peshma-pesh koʻp nusxada bosib chiqaradilar. Birgina kitobi oʻzbek va rus tillarida yigirma marta bosilib chiqdi.", a: ["Xudoyberdi Toʻxtaboyevning", "Oʻlmas Umarbekovning", "O'tkir Xoshimovning", "Anvar Eshonovning"], correct: "Xudoyberdi Toʻxtaboyevning"},

  {q: "Kimning qaysi kitoblari keti uzilmay doʻkonga kelib turadi?", a: ["Xudoyberdi To'xtaboyevning \"Namoz botir\", \"Besh bolali yigitcha\"", "Oʻlmas Umarbekovning asarlari", "O'tkir Xoshimovning asarlari", "Anvar Eshonovning asarlari"], correct: "Xudoyberdi To'xtaboyevning \"Namoz botir\" \"Besh bolali yigitcha”"},

  {q: "Kutubxonamiz limit boʻyicha atigi bir nusxadan kitob oladi. Oʻzimiz sotib olaylik desak, mablagʻ yoʻq. Toʻgʻri, rayijroqoʻm himmat qilib Ibn Sinoning uch tomligini va yana qaysi kitobni berdi?", a: ["Dekameron", "Yoshlik devoni", "Oʻzbegim", "Bahor qaytmaydi"], correct: "Dekameron"},

  {q: "\"...ni bolalar tarbiyasiga toʻgʻri kelmaydi, deb oʻziga qaytib berganman. Keyin eshitsam, shunaqa kitoblarni oʻqib yuribsanmi, tarbiyasiz, deb xotini '...'ni shofyoriga beribdi.\" Qaysi kitob edi bu?", a: ["Dekameron", "Yoshlik devoni", "Oʻzbegim", "Bahor qaytmaydi"], correct: "Dekameron"},

  {q: "Oʻlmas Umarbekov: \"Biz hozir maslahatlashib, kutubxonangizni otaliqqa olishga qaror qildik. Bundan buyon yangi kitoblardan imkon boricha yuborib turamiz\", deganda qaysi nashr nazarda tutilgan edi?", a: ["\"Oʻzbekiston adabiyoti va sanʼati\"", "\"Yoshlik\" jurnali", "\"Sharq yulduzi\"", "\"Guliston\" jurnali"], correct: "\"Oʻzbekiston adabiyoti va sanʼati\""},

  {q: "Hamyurtimiz kimdan gina qilishga haqqimiz bor? \"Yoshlik devoni\" kitoblari hammaning qoʻlida, uni doʻkonda peshtaxta tagidan xufya sotishdi.", a: ["Erkin akadan", "Turobovdan", "Risqiyevdan", "Adham Hamdamdan"], correct: "Erkin akadan"},

  {q: "Erkin Vohidov noqulay ahvolga tushdi: \"– Opajon, shu bugunoq, hozirning oʻzida bu xatoni tuzatamiz\", dedi. Kutubxonaga \"Yoshlik devoni\"dan nechta nusxa berib, nechanchisiga dastxat qoʻyib berishni aytdi?", a: ["5 ta nusxa, 6-chisiga dastxat", "3 ta nusxa, 4-chisiga dastxat", "10 ta nusxa, 1-chisiga dastxat", "2 ta nusxa, 3-chisiga dastxat"], correct: "5 ta nusxa 6 chisiag dastxat"},

  {q: "Kim juda quvnoq, gapga usta odam? Yozgan hikoyalaridan koʻra ogʻzaki hikoyalari mashhur. Uchrashuvni juda qiziq, fayzli olib boradi deb ishonaman.", a: ["Adham Hamdam", "Turobov", "Risqiyev", "Urkinboyev"], correct: "Adham Hamdam"},

  {q: "Anvar uchta boʻlib qoldi. Kimlar edi ular?", a: ["Anvar Eshonov, Anvar Muqimov, Anvar Obidjon", "Anvar Eshonov, Anvar Hamdam, Anvar Risqiyev", "Anvar Muqimov, Anvar Turobov, Anvar Obidjon", "Anvar Eshonov, Anvar Obidjon, Anvar Urkinboyev"], correct: "Anvar Eshonov, Anvar Muqimov, Anvar Obidjon"},

  {q: "Oʻzimizning Oltiariqlik kim degan bola yozuvchi sifatida toʻla tugʻilib boʻlgani yoʻq, hozir oʻgʻil bolaning sumagidekkina boʻlib burni tugʻilgan xolos?", a: ["Anvar Obidjon", "Anvar Eshonov", "Anvar Muqimov", "Qobiljon Yusupov"], correct: "Anvar Obidjon"},

  {q: "Erkin yurtdoshlari faxrlansa arziydigan shoir boʻldi. Oʻzbekistonimizda uning sheʼrlari kirmagan bironta xonadon qolmagan. Ayniqsa, hamyurt xonanda kim uning sheʼrlarini yuraklarga singitib yuborgan?", a: ["Qobiljon Yusupov", "Anvar Obidjon", "Adham Hamdam", "Turobov"], correct: "Qobiljon Yusupov"},

  {q: "Qaysi kitobi bosilib chiqqandan keyin \"hamyurt\"lari koʻpayib ketdi? Birov \"Erkin Vohidov bizning Buxorodan chiqqan\" desa, yana boshqa birovi \"Erkin namanganlik\" deydi.", a: ["Yoshlik devoni", "Oʻzbegim", "Ruhlar isyoni", "Chorak asr"], correct: "Yoshlik devoni"},

  {q: "Erkin Vohidov qaysi dostonini eʼlon qilib bu \"seniki, meniki\"larga nuqta qoʻydi?", a: ["Oʻzbegim", "Yoshlik devoni", "Ruhlar isyoni", "Chorak asr"], correct: "Oʻzbegim"},

const SELECTED_KEY = 'quizSelectedIndices_barcha';
let currentTab = 'all';

function getSelectedIndices() {
    try {
        return JSON.parse(localStorage.getItem(SELECTED_KEY) || '[]');
    } catch (e) {
        return [];
    }
}

function saveSelectedIndices(arr) {
    localStorage.setItem(SELECTED_KEY, JSON.stringify(arr));
    updateSelCount();
}

function updateSelCount() {
    document.getElementById('selCount').innerText = getSelectedIndices().length;
}

function toggleSelected(idx) {
    let selected = getSelectedIndices();
    if (selected.includes(idx)) {
        selected = selected.filter(i => i !== idx);
    } else {
        selected.push(idx);
    }
    saveSelectedIndices(selected);
    renderList();
}

function clearSelected() {
    saveSelectedIndices([]);
    renderList();
}

function toggleTab() {
    currentTab = (currentTab === 'all') ? 'selected' : 'all';
    const btn = document.getElementById('tabSelected');
    if (currentTab === 'selected') {
        btn.classList.add('back-mode');
        btn.innerHTML = '← Barchasiga qaytish';
        document.getElementById('pageTitle').innerText = '⭐ Tanlangan savollarim';
        document.getElementById('selectedToolbar').style.display = 'flex';
        document.getElementById('listCounterAll').style.display = 'none';
    } else {
        btn.classList.remove('back-mode');
        btn.innerHTML = '⭐ Tanlanganlar (<span id="selCount">0</span>)';
        document.getElementById('pageTitle').innerText = '📋 Barcha savol-javoblar';
        document.getElementById('selectedToolbar').style.display = 'none';
        document.getElementById('listCounterAll').style.display = 'block';
    }
    document.getElementById('listSearch').value = '';
    updateSelCount();
    renderList();
}

function renderList() {
    const query = document.getElementById('listSearch').value.trim().toLowerCase();
    const container = document.getElementById('qaList');
    container.innerHTML = '';
    const selected = getSelectedIndices();

    let source = quizData.map((item, idx) => ({ item, idx }));
    if (currentTab === 'selected') {
        source = source.filter(({ idx }) => selected.includes(idx));
    }

    const filtered = source.filter(({ item }) => item.q.toLowerCase().includes(query));

    if (currentTab === 'all') {
        document.getElementById('listCounterAll').innerText = `${filtered.length} / ${quizData.length} ta savol`;
    } else {
        document.getElementById('listCounter').innerText = `${filtered.length} ta savol tanlangan`;
        if (filtered.length === 0) {
            container.innerHTML = `<div style="color:#666; text-align:center; padding:30px;">Hali hech qanday savol tanlanmagan.<br>"⭐ Tanlanganlar" tugmasidan orqaga qaytib, + tugmasi bilan qo'shing.</div>`;
            return;
        }
    }

    filtered.forEach(({ item, idx }) => {
        const isSelected = selected.includes(idx);
        const card = document.createElement('div');
        card.className = 'qa-card' + (isSelected ? ' selected' : '');
        card.innerHTML = `
            <span class="qa-num">${idx + 1}</span>
            <div class="qa-question">${item.q}</div>
            <div class="qa-answer"><b>Javob:</b> ${item.correct}</div>
            <button class="qa-add-btn ${isSelected ? 'selected' : ''}" title="${isSelected ? 'Tanlovdan olib tashlash' : 'Tanlash'}">${isSelected ? '✓' : '+'}</button>
        `;
        card.querySelector('.qa-add-btn').onclick = () => toggleSelected(idx);
        container.appendChild(card);
    });
}

function buildStars() {
    const container = document.getElementById('stars');
    container.innerHTML = '';
    const count = 130;
    for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        const isGlow = Math.random() > 0.8;
        s.className = 'star' + (isGlow ? ' glow' : '');
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        const size = (isGlow ? (Math.random() * 1.5 + 2) : (Math.random() * 2 + 1)).toFixed(1);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.animationDelay = (Math.random() * 2.5).toFixed(2) + 's';
        s.style.animationDuration = (1.5 + Math.random() * 2).toFixed(2) + 's';
        container.appendChild(s);
    }
}

buildStars();
updateSelCount();
renderList();
</script>
