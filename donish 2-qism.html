<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Xurshid Do'stmuhmmad.Donishmand Sizif</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Arial', sans-serif; 
            background: linear-gradient(135deg, #050505, #121212, #1d1d1d); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            min-height: 100vh; 
        }

        /* ===== Raqam tanlash ekrani ===== */
        #select-screen {
            width: 100%; max-width: 700px;
            display: flex; flex-direction: column; align-items: center;
            gap: 25px; padding: 20px 0;
        }
        #select-screen h1 {
            font-size: 26px; color: #00ff99; text-align: center;
        }
        #select-screen p { color: #999; font-size: 14px; text-align: center; }
        .number-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
            gap: 10px;
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px;
            background: #111;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0,255,150,0.15);
        }
        .number-grid::-webkit-scrollbar { width: 8px; }
        .number-grid::-webkit-scrollbar-thumb { background: #00ff99; border-radius: 10px; }
        .num-btn {
            background: #1b1b1b;
            border: 2px solid #00ff99;
            color: #00ff99;
            border-radius: 12px;
            padding: 12px 0;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
            text-shadow: 0 0 8px rgba(0,255,153,0.6);
        }
        .num-btn:hover {
            background: #00ff99;
            color: #050505;
            box-shadow: 0 0 20px rgba(0,255,150,0.8);
            transform: scale(1.08);
        }
        .num-btn.picked {
            background: #ff9900;
            border-color: #ff9900;
            color: #050505;
            box-shadow: 0 0 20px rgba(255,153,0,0.8);
        }
        #range-info {
            color: #ff9900; font-size: 15px; font-weight: bold; min-height: 22px;
        }

        /* ===== Funksiya tanlash ekrani ===== */
            #mode-screen {
            display: none;
            width: 100%; max-width: 700px;
            flex-direction: column; align-items: center;
            gap: 25px; padding: 20px 0;
        }

    .mode-icon-top {
    width: 100%;
    max-width: 450px;
    aspect-ratio: 4 / 3;
    position: relative;
    background: rgba(5, 5, 5, 0.4);
    border-radius: 20px;
    padding: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.mode-icon-top img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 10px;
}

        #mode-screen h1 {
            font-size: 24px; color: #00ff99; text-align: center;
            margin: 5px 0;
        }

        .mode-wrapper {
            width: 100%;
            background: rgba(5, 5, 5, 0.4);
            border-radius: 20px;
            padding: 25px;
       
        }
        .mode-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .mode-card {
            background: rgba(27, 27, 27, 0.85);
            border-radius: 20px;
            padding: 30px 15px;
            text-align: center;
            transition: 0.4s;
            color: white;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            backdrop-filter: blur(3px);
        }
        .mode-card::before {
            content: ""; position: absolute; width: 200%; height: 200%;
            background: linear-gradient(45deg,transparent,#00ff99,transparent);
            top: -150%; left: -150%; transform: rotate(25deg); transition: 0.7s;
        }
        .mode-card:hover::before { top: 100%; left: 100%; }
        .mode-card:hover { transform: translateY(-5px) scale(1.02); border-color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.2); }
@media(max-width:600px){ 
    .mode-grid{ grid-template-columns: repeat(2, 1fr); } 
    .mode-icon-top{ display: flex; justify-content: center; }
    .mode-icon-top img{ width: 85%; max-width: 220px; }
}

        /* ===== Intro (countdown) ekran ===== */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #050505; display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 5;
            transition: opacity 0.8s ease;
        }
        #stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        #select-screen, #mode-screen, .quiz-box, #intro-screen .content-box, #intro-screen #countdown {
            position: relative; z-index: 2;
        }
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2.5s infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.6); }
        }
        .content-box { text-align: center; margin-bottom: 50px; z-index: 1; position: relative; padding: 0 20px; }
        #countdown { 
            position: absolute; bottom: 50px;
            font-size: 80px; color: #00ff99; font-weight: bold;
            animation: pulse 1s infinite;
            z-index: 1;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.5; }
        }

        /* Qur'on sarlavhalari uslubidagi tilla naqshinkor to'rtburchak hoshiya */
        .quran-box {
            display: block;
            margin: 25px auto 0 auto;
            padding: 20px 30px;
            max-width: 550px;
            border: 4px double #ffd700; 
            background: rgba(20, 16, 5, 0.6);
            text-align: center;
        }
        .quran-ayat-text {
            font-size: 18px;
            line-height: 1.6;
            color: #f0f0f0;
            margin-bottom: 15px;
            display: block;
        }
        .quran-meta {
            display: inline-block;
            font-size: 15px;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding-top: 8px;
            width: 100%;
        }

        /* ===== Quiz ekrani ===== */
        .quiz-box { 
            display: none;
            width: 100%; max-width: 600px; background: #1b1b1b; padding: 30px; 
            border-radius: 25px; box-shadow: 0 0 35px rgba(0, 255, 150, 0.1); 
            text-align: center; margin-top: 50px;
        }
        h2 { color: #00ff99; margin-bottom: 20px; font-size: 22px; }
        .option { 
            display: block; width: 100%; padding: 15px; margin: 10px 0; 
            background: #2a2a2a; border: 2px solid #333; border-radius: 15px; 
            cursor: pointer; transition: 0.3s; text-align: left;
        }
        .option:hover { border-color: #00ff99; }
        .correct { 
            background: #00ff99 !important; color: black; font-weight: bold; 
            animation: bubbleEffect 0.5s ease-out;
        }
        @keyframes bubbleEffect {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .wrong { background: #ff4d4d !important; color: white; }
        .btn-finish { 
            width: 100%; padding: 15px; background: transparent; border: 2px solid #00ff99; 
            color: #00ff99; border-radius: 15px; cursor: pointer; margin-top: 20px; 
            font-weight: bold; transition: 0.3s; 
        }
        .btn-finish:hover { background: #00ff99; color: black; }
        
        .closed-input {
            width: 100%; padding: 15px; margin-top: 10px; border: 2px solid #333;
            border-radius: 12px; font-size: 17px; outline: none; background: #2a2a2a;
            color: white;
        }
        .closed-input:focus { border-color: #00ff99; }
        .btn-check {
            width: 100%; padding: 15px; margin-top: 15px; border: 2px solid #00ff99; border-radius: 15px;
            background: transparent; color: #00ff99; font-weight: bold; cursor: pointer; font-size: 17px;
            transition: 0.3s;
        }
        .btn-check:hover { background: #00ff99; color: black; }
        #closed-result { margin-top: 15px; font-size: 18px; min-height: 30px; text-align: center; }
    </style>
</head>
<body>

<div id="stars"></div>

<div id="select-screen">
    <h1>🌙 2-Qism</h1>
    <p>Savollar sonini belgilang</p>
    <div id="range-info">Boshlang'ich raqamni tanlang</div>
    <div class="number-grid" id="numberGrid"></div>
</div>

<div id="mode-screen">
    <div class="mode-icon-top">
        <img src="donishmadn.jpg" alt="rasm">
    </div>
    <h1>Qaysi funksiyani xohlaysiz?</h1>
    <div class="mode-wrapper">
        <div class="mode-grid">
            <div class="mode-card" onclick="chooseMode('quiz')">Quiz testlar</div>
            <div class="mode-card" onclick="chooseMode('quiz-aralash')">Quiz aralash</div>
            <div class="mode-card" onclick="chooseMode('yopiq')">Yopiq savol-javob</div>
            <div class="mode-card" onclick="chooseMode('yopiq-aralash')">Yopiq savol-javob aralash</div>
        </div>
    </div>
</div>

<div id="intro-screen">
    <div class="content-box">
        <h1 style="color:#00ff99; font-size: 32px;">1-Qism</h1>
        <div id="random-ayat"></div>
    </div>
    <div id="countdown">3</div>
</div>

<div class="quiz-box" id="quiz">
    <h2 id="question">Yuklanmoqda...</h2>
    <div id="options"></div>
    <button class="btn-finish" onclick="finishQuiz()">Testni yakunlash</button>
</div>

<script>
const quizData = [
  { q: "u nimani allaqachonlar unutib yuborgan edi...", correct: "Vaqtni", wrongs: ["Umidni", "Sabrni", "O‘zini"] },
  { q: "Nimani unutgan odam mo‘ljalni, rejani, hisob-kitobni unutadi. Yashamayotgandek yashaydi.", correct: "O‘zini", wrongs: ["Vaqtni", "Xotirasini", "Kimligini"] },
  { q: "Har bir o‘zgarish, har bir yangilik yangidan-yangi umidga doya, yangi umiddan yangi nimalar dunyoga keladi", correct: "dunyolar", wrongs: ["orzular", "hikoyalar", "taqdirlar"] },
  { q: "So‘qimtabiat, to‘ng‘iztabiat jonsiz bir maxluq-da nima", correct: "Xarsangtosh", wrongs: ["Sizif", "Tobut", "Qayiq"] },
  { q: "Vaholanki, toshda ham nima mavjud", correct: "fikr va ruh", wrongs: ["kuch va qudrat", "ovoz va nafas", "yurak va jon"] },
  { q: "Ho, xarsangtosh, yoriltosh, men nimani bilayin deya xirgoyi qiladigan bo‘ldi ahyon-ahyonda Sizif.", correct: "men ichingni ko‘rayin, dilginangni bilayin, deya", wrongs: ["men seni yengayin, taslim etayin, deya", "men senga o‘xshayin, tosh bo‘layin, deya", "men sendan qochayin, xalos bo‘layin, deya"] },
  { q: "mahkum odam uchun qaysi so‘zlar begona", correct: "xohish-istak degan", wrongs: ["sabr-toqat degan", "umid-orzu degan", "najot-qutulish degan"] },
  { q: "Qur'oni karim\"ning \"Hud\" surasida keladigan bu arabiy so‘z \"loyi qattiq qotib qolgan tosh\" deya tafsir qilingan. Tafsiri Hilol. 3-jild, B. 128. Qaysi so'z", correct: "Sijjil", wrongs: ["Sirot", "Jahannam", "Saqar"] },
  { q: "Sizif toshga nima deb yozadi toshlar bilan o'yib", correct: "Sizif", wrongs: ["Korinf", "Xarsang", "Taqdir"] },
  { q: "Sizif so'zi yoniga qaysi so'zni qo'shadi", correct: "Korinf", wrongs: ["Xudo", "Taqdir", "Yakka"] },
  { q: "bu yorug‘ dunyoda boryo‘g‘i bir kungina yashagan odamni yuz yil, istasangiz katalakda, istasangiz zindonda yoxud o‘rada saqlang, unday odam zinhorbazinhor zerikish nima ekanini bilmaydi, chunki nima uning najotkoriga aylanadi", correct: "xotira va tasavvur", wrongs: ["umid va sabr", "kuch va matonat", "aql va idrok"] },
  { q: "U mana shu hikmatlarni unutib qo‘yishdan xavotirlanar, o‘tirgan-yotgan-turgan holatlarida beixtiyor takrorlar, takrorlagani sayin ushbu bir juft tagdor gapdan kuch-quvvat olayotgandek bo‘lar, qaysi hikmatlarni", correct: "Qimirlagan qir oshadi... Zo‘rning toshi qirga qarab yumalaydi!..", wrongs: ["Sabr qilgan murodiga yetadi... Zo‘rning toshi tog‘dan pastga dumalaydi!..", "Chidagan chiroyga yetadi... Zo‘rning kuchi qirga qarab yumalaydi!..", "Kutgan yetadi maqsadiga... Zo‘rning yo‘li qirga qarab yumalaydi!.."] },
  { q: "bekor qoldirishganida nima qilardim degan o‘ydan azbaroyi hurkib, esxonasi chiqib, sapchib tushardi. Nimadan ko‘ra dahshatliroq, yovuzroq jazo yo‘q", correct: "Bekorchilikdan", wrongs: ["Yolg‘izlikdan", "Sukunatdan", "Charchoqdan"] },
  { q: "Sizifning ta’rifiga tili ojiz baxti, quvonchi, saodati! Nima", correct: "xarsangning borligi, ayniqsa uni cho‘qqi tomon olib chiqishga mahkumligi", wrongs: ["dengizning borligi, ayniqsa uni har kuni tomosha qilishga mahkumligi", "yulduzlarning borligi, ayniqsa ularni sanashga mahkumligi", "bulutlarning borligi, ayniqsa ularni kuzatishga mahkumligi"] },
  { q: "Olloh ato etgan aql-idrokning ozmunchasini nimaga sovurdi odamzot!", correct: "jazo choralari, aslahalari-yu anjomlarini kashf etishga", wrongs: ["boylik va shon-shuhrat orttirishga", "birbirini yengish yo‘llarini izlashga", "yolg‘on va hiyla-nayranglar o‘ylab topishga"] },
  { q: "Xayriyat, Sizifga nima qilasan, demadilar", correct: "Sizifga har tunda bir yulduzni mahv etasan, Oymoni tilim-tilimlab shu tog‘ yonbag‘riga qovunqoqidek qilib terib chiqasan, deya shart qo‘ymadilar, Oftobning qoq betiga sanch, deya qo‘liga xanjar tutqazmadilar", wrongs: ["Sizifga har kuni bir tog‘ni ko‘tarib boshqa joyga qo‘yasan, deya shart qo‘ymadilar", "Sizifga har kecha dengizni bir qultumda ichib bitirasan, deya shart qo‘ymadilar", "Sizifga har tong quyoshni qo‘lida ko‘tarib chiqasan, deya shart qo‘ymadilar"] },
  { q: "Sizif nimaga shu qadar ko‘nikib ketdiki, tiq etgan shovqin ham uning qulog‘ini teshib yuborguday tuyular edi", correct: "Sokinlikka", wrongs: ["Yolg‘izlikka", "Charchoqqa", "Og‘riqqa"] },
  { q: "dengiz sathida qayiq emas, qop-qora nima ohista lapanglab suzib kelayotgandi!", correct: "tobut", wrongs: ["xarsangtosh", "soya", "bulut"] },
  { q: "Tobut asli nima edi", correct: "Qayiq", wrongs: ["Xarsangtosh", "Soya", "Bulut"] },
  { q: "Sizif vaqt o‘tayotganini nima orqali his qilishga odatlangan edi.", correct: "bulutlar karvonining oqib borishi orqali", wrongs: ["quyoshning botib-chiqishi orqali", "dengiz to‘lqinlarining kelib-ketishi orqali", "yulduzlarning sanoqi orqali"] },
  { q: "Sizifning qaysi ko'zi xira ko'rayotgan edi", correct: "Chap ko'zi", wrongs: ["O'ng ko'zi", "Ikkala ko'zi", "Chap qulog'i"] },
  { q: "Xarsang tosh uning qaysi oyog'ini majaqlab ketgan edi", correct: "So'l oyog'ini", wrongs: ["O'ng oyog'ini", "Ikkala oyog'ini", "Qo'lini"] },
  { q: "u azal azaldan nimani yaxshi ko'rar edi", correct: "Sukunatni", wrongs: ["Yolg'izlikni", "Tinchlikni", "Osoyishtalikni"] },
  { q: "Kimlarni jini suymas, gapirgandan gapirmaslik afzal deb o‘ylardi u.", correct: "Vaysaqilarni", wrongs: ["Yolg'onchilarni", "Ishyoqmaslarni", "Bezorilarni"] },
  { q: "xarsangga tik qadalganicha u bilan bahs boylashar, qaysi o'yin shartlari haqida, bitim tuzardi.", correct: "kim uzoq jim yashash", wrongs: ["kim uzoqroq tosh ko'tarish", "kim tezroq cho'qqiga chiqish", "kim ko'proq sabr qilish"] },
  { q: "Nima boqiylik, mangulik timsoliga aylanardi uning nazarida", correct: "sukut", wrongs: ["sabr", "umid", "xotira"] },
  { q: "Nima – abadiyat bilan muloqotga kirishayotgandek sezardi o‘zini Sizif.", correct: "sukut saqlasa", wrongs: ["ko'zini yumsa", "toshga tikilsa", "yolg'iz qolsa"] },
  { q: "Sizif o‘zidan, o‘zining tashvishlaridan ko‘ra nimani ko‘proq o‘ylay boshladi.", correct: "dengizchi cholni", wrongs: ["Xudoni", "O'z bolasini", "O'tmishini"] },
  { q: "Sizif o'zi kashf qilgan qaysi so'zni kashf qilganidan ruhi taskin olayotgan edi", correct: "Og'ayni", wrongs: ["Do'stni", "Sherikni", "Birodarni"] },
  { q: "Tirik jon borki nimasi bor", correct: "O'z quzg'uni", wrongs: ["O'z soyasi", "O'z tobuti", "O'z qismati"] },
  { q: "Taqdiring qismating oldida nechog'lik yolg'iz bo'lsang murdangni cho'qilab xomtalash qiluvchi qora nimalar oldida hamshunchalar himoyasiz yolg'izsan", correct: "quzg'unlar", wrongs: ["ilonlar", "bo'rilar", "yirtqichlar"] },
  { q: "U tirik nimaga aylanib qolishni har narsadan og'irroq musibat deb bilar edi", correct: "Tirik daxmazaga aylanib qolish", wrongs: ["Tirik quzg'un bo'lib qolish", "Tirik xarsangga aylanib qolish", "Tirik soyaga aylanib qolish"] },
  { q: "Qanday odam tippa-tik daxmazaga aylanib qoladi", correct: "Baxtsiz odam", wrongs: ["Yolg'iz odam", "Charchagan odam", "Umidsiz odam"] },
  { q: "Sizif daxmaza emas qanday edi", correct: "Ko'ngli sust ketgan", wrongs: ["Aqldan ozgan", "Umidini yo'qotgan", "Charchab qolgan"] },
  { q: "yo‘q, u badbaxt emas, daxmaza emas, faqat ko‘ngli sust ketgan, axir har qanday odamda bo‘ladigan holat – kimgadir erkalangisi, yaltoqlangisi, kimgadir hasratlarini dasturxon qilgisi, kimningdir daldatasallisiga muhtoj bo‘lib qolgisi keladi. Ana shunday damlarda Sizif ham odamda, banda-da, ixtiyorsiz ravishda kimga yaltoqlana boshlardi.", correct: "xarsangtoshga", wrongs: ["osmonga", "tog'ga", "yulduzlarga"] },
  { q: "Sizif nimani yeb tashlayman deydi", correct: "Sabrni", wrongs: ["Toqatni", "Umidni", "Vaqtni"] },
  { q: "Sabrni yeb tashlayman!.. Nimani ikki yamlab bir yutaman-n!..", correct: "Toqatni", wrongs: ["Sabrni", "Umidni", "Kuchni"] },
  { q: "Sizifning ko‘z o‘ngida – o‘zi turgan joydan olisroq, dengiz qirg‘og‘iga yaqinroq yerda nima paydo bo‘ldi.", correct: "qoq-quruq shoxlari tarvaqaylagan daraxt", wrongs: ["qop-qora kichik bir qayiq", "yolg'iz o'sgan cho'l gullari", "tanho qad rostlagan tosh ustun"] },
  { q: "Sizif uchun nimadan quvonchliroq hodisa yo'q hisobi", correct: "harakatdan", wrongs: ["sukunatdan", "uyqudan", "tinchlikdan"] },
  { q: "Atrofdan nimaning isi kelib Sizif qochishga joy topolmasdi", correct: "Murdalarning", wrongs: ["Dengizning", "Tuproqning", "Qonning"] },
  { q: "Avvalari osmonga qarab uxlar hozir esa qanday holatda uxlar edi", correct: "Chirmalib yotishga odatlanganiga ancha bo'ldi", wrongs: ["Yuzini toshga bosib yotishga odatlangan", "Tik turgancha uxlashga odatlangan", "Ko'zlarini ochiq qoldirib uxlashga odatlangan"] },
  { q: "Nimadan ko'ra maroqliroq mashg'ulot yo'q edi Sizif uchun.", correct: "Bulutlarning xilma-xil shaklga kirishini kuzatishdan", wrongs: ["Dengiz to'lqinlarini kuzatishdan", "Yulduzlarni sanashdan", "Quzg'unlarning parvozini kuzatishdan"] },
  { q: "Korinfda dong‘i ketgan hushyorlardan sanalardi Yerning tagida g‘imirlagan ilonning uzun-qisqaligi, yo‘g‘on-ingichkaligi, rangtusigacha aytib bera olardi. Kim", correct: "Sizif", wrongs: ["Korinf shohi", "Dengizchi chol", "Noma'lum odam"] },
  { q: "inson borki, uning oldida, yonida-yu ortida nima bor", correct: "ta'qib etguvchilar", wrongs: ["kuzatuvchilar", "dushmanlar", "soyalar"] },
  { q: "Ha, odam bolasi bo‘lsang, bilib qo‘y va unutma, banda borki, mudom kim bor. Bunga shak-shubha yo‘q, yo‘q, yo‘qq!..", correct: "kuzatuvchi va kuzatiluvchi!", wrongs: ["ta'qib etuvchi va ta'qib etiluvchi!", "hukmdor va mahkum!", "g'olib va mag'lub!"] },
  { q: "Nimadan xoli banda bo‘lmagan, yo‘q, bo‘lmaydi ham. Haa, lalayma, ko‘zingni och, Sizif!..", correct: "Nazar-nigohdan", wrongs: ["Xudodan", "O'limdan", "Taqdirdan"] },
  { q: "Rivoyatlarda Sizif yana qanday shaklda kelgan", correct: "Sizsif", wrongs: ["Sizif", "Sisyphus", "Sizfi"] },
  { q: "inson bolasi, nimaga rozi bo'lib ketaverish uchun yaratilmagan.", correct: "yengilganiga", wrongs: ["taslim bo'lganiga", "mag'lub bo'lganiga", "bo'ysunganiga"] },
  { q: "xarsang unga hamisha avzoyi buzuq nimadek ko'rinardi.", correct: "yirtqichdek", wrongs: ["yovvoyidek", "dushmandek", "g'animdek"] },
  { q: "Nimani sizif insoniylik qadr-qimmatiga munosib hisoblamasdi.", correct: "Qandaydir jonsiz bir matoh – xarsangtosh ostida qolib ketishni o'zining", wrongs: ["Dengizga tashlanib halok bo'lishni o'zining", "Tog'dan yiqilib jon berishni o'zining", "Sukunatga cho'kib qolishni o'zining"] },
  { q: "Ko'nglidan kechgani bo'ldi Sizifning, nima bo'ldi", correct: "Tosh birdan g'oyib bo'ldi", wrongs: ["Tosh birdan chil-chil bo'ldi", "Tosh birdan cho'qqiga uchib chiqdi", "Tosh birdan kul bo'ldi"] },
  { q: "mo'jiza yuz berdi, qanaqa", correct: "xarsangtosh badanidan moshday, no'xatday toshchalar, toshbachchalar sachrab-sakrab to'kila boshladi", wrongs: ["xarsangtosh birdan tuproqqa aylanib to'kila boshladi", "xarsangtosh ichidan suv otilib chiqa boshladi", "xarsangtosh birdan yorug'lik sochib porlay boshladi"] }
];

const ayats = [
    { text: "Robbing seni tark qilmadi va g'azab ham qilmadi.", meta: "Zuho 93:3" },
    { text: "Albatta bir qiyinchilik bilan osonchilik bordir.", meta: "Sharh 94:5" },
    { text: "Yaratgan Robbing nomi bilan o'qi!", meta: "Alaq 96:1" },
    { text: "O'qi, Robbing karamlilar karamlisidir.", meta: "Alaq 96:3" },
    { text: "Va tezda Robbing senga ato qilur va sen rozi bo'lursan.", meta: "Zuho 93:5" },
    { text: "Ammo kimki ato bersa va taqvo qilsa, va yaxshiliklarni tasdiq qilsa, bas, Biz uni osonga muyassar etamiz.", meta: "Layl 92:5-7" },
    { text: "Albatta hidoyatga boshlash Bizning zimmamizdadir.", meta: "Layl 92:12" },
    { text: "Va albatta tezda rozi bo'ladir.", meta: "Layl 92:21" },
    { text: "Seni oson yo'lga muyassar etamiz.", meta: "A'lo 87:8" },
    { text: "Bas, kim xohlasa Parvardigori tomon qaytadigan yo'lni tutar.", meta: "Naba 78:39" },
    { text: "Albatta Biz senga ochiq g'alaba berdik.", meta: "Fath 48:1" }
];

let activeQuiz = [];
let currentQ = 0, score = 0, answered = 0;

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function buildStars() {
    const container = document.getElementById('stars');
    container.innerHTML = '';
    const count = 100; // Yulduzlar zichligi oshirildi
    for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        const size = (Math.random() * 2 + 1).toFixed(1);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.animationDelay = (Math.random() * 2.5).toFixed(2) + 's';
        s.style.animationDuration = (1.5 + Math.random() * 2).toFixed(2) + 's';
        container.appendChild(s);
    }
}

let rangeStart = null;
let numButtons = [];

window.onload = function() {
    const grid = document.getElementById('numberGrid');
    for (let i = 1; i <= quizData.length; i++) {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.innerText = i;
        btn.onclick = () => pickNumber(i, btn);
        grid.appendChild(btn);
        numButtons.push(btn);
    }
    buildStars();
    
    const randomIdx = Math.floor(Math.random() * ayats.length);
    const selectedAyat = ayats[randomIdx];
    document.getElementById('random-ayat').innerHTML = `
        <div class="quran-box">
            <span class="quran-ayat-text">"${selectedAyat.text}"</span>
            <span class="quran-meta">${selectedAyat.meta}</span>
        </div>
    `;
};

function pickNumber(num, btnEl) {
    const info = document.getElementById('range-info');

    if (rangeStart === null) {
        rangeStart = num;
        btnEl.classList.add('picked');
        info.innerText = `Boshlang'ich: ${num}. Endi oxirgi raqamni tanlang`;
    } else {
        let start = rangeStart;
        let end = num;
        if (end < start) { const t = start; start = end; end = t; }
        btnEl.classList.add('picked');
        info.innerText = `Tanlandi: ${start} - ${end}`;
        setTimeout(() => startWithRange(start, end), 400);
    }
}

function startWithRange(start, end) {
    activeQuiz = quizData.slice(start - 1, end);
    document.getElementById('select-screen').style.display = 'none';
    document.getElementById('mode-screen').style.display = 'flex';
}

let quizMode = 'quiz';

function chooseMode(mode) {
    quizMode = mode;
    if (mode === 'quiz-aralash' || mode === 'yopiq-aralash') {
        activeQuiz = shuffle([...activeQuiz]);
    }
    document.getElementById('mode-screen').style.display = 'none';
    document.getElementById('intro-screen').style.display = 'flex';
    document.getElementById('intro-screen').style.opacity = '1';
    startTimer();
}

function startTimer() {
    let count = 3;
    let disp = document.getElementById("countdown");
    disp.innerText = count;
    let timer = setInterval(() => {
        count--;
        if (count > 0) {
            disp.innerText = count;
        } else if (count === 0) {
            disp.innerText = "Boshladik!";
        } else {
            clearInterval(timer);
            document.getElementById("intro-screen").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("intro-screen").style.display = "none";
                document.getElementById("quiz").style.display = "block";
                loadQ();
            }, 800);
        }
    }, 1000);
}

function getOptionsFor(qData) {
    return shuffle([qData.correct, ...qData.wrongs]);
}

function loadQ() {
    const qData = activeQuiz[currentQ];
    document.getElementById('question').innerText = `${currentQ + 1}/${activeQuiz.length}. ${qData.q}`;
    const optDiv = document.getElementById('options');
    optDiv.innerHTML = '';

    if (quizMode === 'yopiq' || quizMode === 'yopiq-aralash') {
        loadClosedQ(qData, optDiv);
    } else {
        loadMultipleChoiceQ(qData, optDiv);
    }
}

function loadMultipleChoiceQ(qData, optDiv) {
    let shuffledOptions = getOptionsFor(qData);

    shuffledOptions.forEach((opt) => {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.innerText = opt;
        btn.onclick = () => check(opt, btn, qData.correct);
        optDiv.appendChild(btn);
    });
}

function loadClosedQ(qData, optDiv) {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'closed-input';
    input.id = 'closed-answer';
    input.placeholder = 'Javob yozing...';
    input.onkeypress = (e) => { if (e.key === 'Enter') checkClosed(qData); };

    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn-check';
    checkBtn.innerText = 'Tekshirish';
    checkBtn.onclick = () => checkClosed(qData);

    const resultDiv = document.createElement('div');
    resultDiv.id = 'closed-result';

    optDiv.appendChild(input);
    optDiv.appendChild(checkBtn);
    optDiv.appendChild(resultDiv);

    input.focus();
}

function checkClosed(qData) {
    const inputEl = document.getElementById('closed-answer');
    const resultDiv = document.getElementById('closed-result');
    const user = inputEl.value.toLowerCase().trim();
    const correct = qData.correct.toLowerCase().trim();

    answered++;
    inputEl.disabled = true;
    document.querySelector('.btn-check').disabled = true;

    if (user === correct) {
        resultDiv.innerHTML = '<b style="color:#00ff99;">✅ To\'g\'ri</b>';
        score++;
    } else {
        resultDiv.innerHTML = '<b style="color:#ff4444;">❌ Noto\'g\'ri.</b><br> Javob: ' + qData.correct;
    }

    setTimeout(() => {
        currentQ++;
        if (currentQ < activeQuiz.length) loadQ();
        else finishQuiz();
    }, 2000);
}

function check(selected, element, correct) {
    const options = element.parentElement.querySelectorAll('.option');
    options.forEach(opt => opt.style.pointerEvents = 'none');
    answered++;

    if (selected === correct) {
        element.classList.add('correct');
        score++;
    } else {
        element.classList.add('wrong');
        options.forEach(opt => {
            if (opt.innerText === correct) opt.classList.add('correct');
        });
    }
    setTimeout(() => {
        currentQ++;
        if (currentQ < activeQuiz.length) loadQ();
        else finishQuiz();
    }, 1000);
}

function finishQuiz() {
    let wrong = answered - score;
    document.getElementById('quiz').innerHTML = `
        <h2>Natijalar</h2>
        <div style="line-height: 2.2; font-size: 19px;">
            Jami savollar: <b>${activeQuiz.length} ta</b><br>
            To'g'ri javoblar: <span style="color:#00ff99;">${score} ta</span><br>
            Xato javoblar: <span style="color:#ff4d4d;">${wrong} ta</span>
        </div>
        <button class="btn-finish" onclick="location.reload()">Qaytadan boshlash</button>
    `;
}
</script>
</body>
</html>
