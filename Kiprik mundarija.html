<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Savol-javoblar statistikasi</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; overflow-x:hidden; }
    body {
        font-family:'Segoe UI','Arial',sans-serif;
        background: radial-gradient(ellipse at 50% 0%, #161616, #0a0a0a 60%);
        color:white;
        display:flex; flex-direction:column; align-items:center;
        padding:40px 20px;
        min-height:100vh; min-height:100dvh;
        position:relative;
    }
    #stars {
        position:fixed; top:0; left:0; width:100%; height:100%;
        pointer-events:none; z-index:0; overflow:hidden;
    }
    .star { position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; animation:twinkle 2.5s infinite ease-in-out; }
    .star.glow { box-shadow:0 0 6px 1px rgba(255,215,0,0.5); }
    @keyframes twinkle { 0%,100%{opacity:.15;transform:scale(1);} 50%{opacity:1;transform:scale(1.6);} }

    .cover {
        width:130px; height:190px;
        border-radius:10px;
        border:3px solid #ffd700;
        box-shadow:0 0 20px rgba(255,215,0,0.55), 0 0 45px rgba(255,215,0,0.2);
        overflow:hidden;
        z-index:2; position:relative; margin-bottom:-15px;
    }
    .cover img {
        width:100%; height:100%; object-fit:cover; display:block;
    }

    .panel {
        z-index:2; position:relative;
        width:100%; max-width:700px;
        display:flex; flex-direction:column; align-items:center;
        gap:20px;
        padding:50px 30px 35px 30px;
        background: linear-gradient(160deg, rgba(16,16,16,0.55), rgba(10,10,10,0.55));
        backdrop-filter:blur(1px);
        border:2px solid #ffd700;
        border-radius:26px;
        box-shadow:0 0 30px rgba(255,215,0,0.22), inset 0 0 40px rgba(255,215,0,0.03);
    }
    .panel h1 {
        font-size:24px; color:#ffffff; text-align:center;
        letter-spacing:1px; line-height:1.4;
        text-shadow:0 0 12px rgba(255,255,255,0.3);
    }

    table { width:100%; border-collapse:collapse; border-radius:14px; overflow:hidden; }
    thead tr { background:linear-gradient(90deg,#0f3d24,#0a2c1a); }
    th { color:#00ff99; font-size:13px; letter-spacing:.5px; text-align:left; padding:14px 16px; text-transform:uppercase; }
    th:last-child, td:last-child { text-align:right; }
    tbody tr { background:#161616; border-bottom:1px solid rgba(255,215,0,0.08); }
    tbody tr:nth-child(even) { background:#1c1c1c; }
    td { padding:14px 16px; font-size:15px; color:#e5e5e5; }
    td.num { color:#888; }
    td.count { font-weight:bold; color:#ffffff; }
    tfoot td {
        padding:16px; font-weight:bold; font-size:16px;
        border-top:2px solid #ffd700;
        color:#fff;
    }
    tfoot td.count { color:#ffffff; }

    @media (max-width:480px) {
        .panel { padding:40px 16px 24px 16px; }
        .panel h1 { font-size:19px; }
        th, td { padding:10px 10px; font-size:13px; }
        .cover { width:100px; height:150px; }
    }
</style>
</head>
<body>
<div id="stars"></div>

<div class="cover">
    <img src="tong.jpg" alt="Kitob muqovasi">
</div>

<div class="panel">
    <h1>KIPRIKDA QOLGAN TONG<br>SAVOL-JAVOBLAR STATISTIKASI</h1>
    <table>
        <thead>
            <tr><th>№</th><th>Bob nomi</th><th>Savollar soni</th></tr>
        </thead>
        <tbody id="statBody"></tbody>
        <tfoot>
            <tr><td colspan="2">JAMI</td><td class="count" id="totalCount">0</td></tr>
        </tfoot>
    </table>
</div>

<script>
    // Har bir bob nomi va savollar soni shu yerda beriladi
    const stats = [
        { name: "1***", count: 158 },
        { name: "2***", count: 64 },
        { name: "3***", count: 45 },
        { name: "4***", count: 61 },
        { name: "5***", count: 23 }
    ];

    const body = document.getElementById('statBody');
    let total = 0;
    stats.forEach((row, i) => {
        total += row.count;
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="num">${i + 1}</td><td>${row.name}</td><td class="count">${row.count}</td>`;
        body.appendChild(tr);
    });
    document.getElementById('totalCount').innerText = total;

    // Yulduzlar foni
    function buildStars() {
        const container = document.getElementById('stars');
        const count = 130;
        for (let i = 0; i < count; i++) {
            const s = document.createElement('div');
            const isGlow = Math.random() > 0.8;
            s.className = 'star' + (isGlow ? ' glow' : '');
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            const size = (isGlow ? (Math.random() * 1.5 + 2) : (Math.random() * 2 + 1)).toFixed(1);
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            s.style.animationDelay = (Math.random() * 2.5).toFixed(2) + 's';
            s.style.animationDuration = (1.5 + Math.random() * 2).toFixed(2) + 's';
            container.appendChild(s);
        }
    }
    buildStars();
</script>
</body>
</html>
