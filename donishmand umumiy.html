<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Umumumiy quiz test va yopiq savol-javoblar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }
        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: radial-gradient(ellipse at 50% 0%, #161616, #0a0a0a 60%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* ===== Oltin dizayn elementlari ===== */
        .gold-badge {
            width: 84px; height: 84px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #2e2e2e, #0f0f0f 70%);
            border: 3px solid #ffd700;
            box-shadow: 0 0 18px rgba(255,215,0,0.55), 0 0 40px rgba(255,215,0,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 38px;
            margin-bottom: -8px;
            position: relative; z-index: 3;
        }

        /* ===== Raqam tanlash ekrani ===== */
        #select-screen {
            width: 100%; max-width: 700px;
            display: flex; flex-direction: column; align-items: center;
            gap: 25px;
            padding: 45px 30px 35px 30px;
            background: linear-gradient(160deg, rgba(16,16,16,0.55), rgba(10,10,10,0.55));
            backdrop-filter: blur(1px);
            border: 2px solid #ffd700;
            border-radius: 26px;
            box-shadow: 0 0 30px rgba(255,215,0,0.22), inset 0 0 40px rgba(255,215,0,0.03);
        }
        #select-screen h1 {
            font-size: 24px; color: #ffffff; text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(255,255,255,0.3);
        }
        #select-screen p { color: #999; font-size: 14px; text-align: center; }
        .number-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
            gap: 10px;
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px;
            background: #111;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(255,215,0,0.1);
            border: 1px solid rgba(255,215,0,0.15);
        }
        .number-grid::-webkit-scrollbar { width: 8px; }
        .number-grid::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 10px; }
        .num-btn {
            background: #1b1b1b;
            border: 2px solid #00ff99;
            color: #00ff99;
            border-radius: 12px;
            padding: 12px 0;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
            text-shadow: 0 0 8px rgba(0,255,153,0.6);
        }
        .num-btn:hover {
            background: #00ff99;
            color: #050505;
            box-shadow: 0 0 20px rgba(0,255,150,0.8);
            transform: scale(1.08);
        }
        .num-btn.picked {
            background: #ffd700;
            border-color: #ffd700;
            color: #050505;
            box-shadow: 0 0 20px rgba(255,215,0,0.8);
        }
        #range-info {
            color: #ffd700; font-size: 15px; font-weight: bold; min-height: 22px;
        }

        /* ===== Random tanlash bo'limi ===== */
        .random-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .random-main-btn {
            width: 100%;
            background: linear-gradient(135deg, #1b1b1b, #262626);
            border: 2px solid #ffd700;
            color: #ffd700;
            border-radius: 14px;
            padding: 14px 0;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
            text-shadow: 0 0 8px rgba(255,215,0,0.5);
            letter-spacing: 0.5px;
        }
        .random-main-btn:hover {
            background: #ffd700;
            color: #050505;
            box-shadow: 0 0 20px rgba(255,215,0,0.8);
            transform: scale(1.02);
        }
        .random-options-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            width: 100%;
            padding: 15px;
            background: #111;
            border-radius: 18px;
            box-shadow: 0 0 25px rgba(255,215,0,0.12);
        }
        .random-num-btn {
            background: #1b1b1b;
            border: 2px solid #ffd700;
            color: #ffd700;
            border-radius: 12px;
            padding: 14px 0;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }
        .random-num-btn:hover {
            background: #ffd700;
            color: #050505;
            box-shadow: 0 0 20px rgba(255,215,0,0.8);
            transform: scale(1.08);
        }
        .clear-history-link {
            color: #666;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
        }
        .clear-history-link:hover { color: #ff9900; }

        /* ===== Funksiya tanlash ekrani ===== */
        #mode-screen {
            display: none;
            width: 100%; max-width: 700px;
            flex-direction: column; align-items: center;
            gap: 25px; padding: 20px 0;
        }

        .mode-icon-top {
            width: 100%;
            max-width: 450px;
            aspect-ratio: 4 / 3;
            position: relative;
            background: radial-gradient(circle at 35% 30%, #2e2e2e, #0f0f0f 70%);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 18px rgba(255,215,0,0.4), 0 0 40px rgba(255,215,0,0.15);
        }
        .mode-icon-top img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        #mode-screen h1 {
            font-size: 22px; color: #ffffff; text-align: center;
            margin: 5px 0;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(255,255,255,0.3);
        }

        .mode-wrapper {
            width: 100%;
            background: linear-gradient(160deg, rgba(16,16,16,0.55), rgba(10,10,10,0.55));
            backdrop-filter: blur(1px);
            border-radius: 26px;
            padding: 30px 25px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 30px rgba(255,215,0,0.22), inset 0 0 40px rgba(255,215,0,0.03);
        }
        .mode-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .mode-card {
            background: rgba(27, 27, 27, 0.85);
            border-radius: 20px;
            padding: 30px 15px;
            text-align: center;
            transition: 0.4s;
            color: white;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255, 215, 0, 0.3);
            font-size: 16px;
            font-weight: bold;
            backdrop-filter: blur(3px);
        }
        .mode-card::before {
            content: ""; position: absolute; width: 200%; height: 200%;
            background: linear-gradient(45deg,transparent,#ffd700,transparent);
            top: -150%; left: -150%; transform: rotate(25deg); transition: 0.7s;
            opacity: 0.35;
        }
        .mode-card:hover::before { top: 100%; left: 100%; }
        .mode-card:hover { transform: translateY(-5px) scale(1.02); border-color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.3); }
        @media(max-width:600px){ .mode-grid{ grid-template-columns: 1fr; } }

        /* ===== Intro (countdown) ekran ===== */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            height: 100dvh;
            background: #050505; display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 5;
            transition: opacity 0.8s ease;
        }
        #stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        #select-screen, #mode-screen, .quiz-box, #intro-screen .content-box, #intro-screen #countdown {
            position: relative; z-index: 2;
        }
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2.5s infinite ease-in-out;
        }
        .star.glow {
            box-shadow: 0 0 6px 1px rgba(255, 215, 0, 0.5);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.6); }
        }
        .content-box { text-align: center; margin-bottom: 50px; z-index: 1; position: relative; padding: 0 20px; }
        #countdown {
            position: absolute; bottom: 50px;
            font-size: 80px; color: #00ff99; font-weight: bold;
            animation: pulse 1s infinite;
            z-index: 1;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.5; }
        }

        .quran-box {
            display: block;
            margin: 25px auto 0 auto;
            padding: 20px 30px;
            max-width: 550px;
            border: 4px double #ffd700;
            background: rgba(20, 16, 5, 0.6);
            text-align: center;
        }
        .quran-ayat-text {
            font-size: 18px;
            line-height: 1.6;
            color: #f0f0f0;
            margin-bottom: 15px;
            display: block;
        }
        .quran-meta {
            display: inline-block;
            font-size: 15px;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding-top: 8px;
            width: 100%;
        }

        /* ===== Quiz ekrani ===== */
        .quiz-box {
            display: none;
            width: 100%; max-width: 600px; background: rgba(16,16,16,0.6); padding: 30px;
            border-radius: 25px; box-shadow: 0 0 30px rgba(255,215,0,0.18);
            border: 2px solid #ffd700;
            backdrop-filter: blur(1px);
            text-align: center; margin-top: 50px;
        }
        h2 { color: #00ff99; margin-bottom: 20px; font-size: 22px; }
        .option {
            display: block; width: 100%; padding: 15px; margin: 10px 0;
            background: #2a2a2a; border: 2px solid #333; border-radius: 15px;
            cursor: pointer; transition: 0.3s; text-align: left;
        }
        .option:hover { border-color: #00ff99; }
        .correct {
            background: #00ff99 !important; color: black; font-weight: bold;
            animation: bubbleEffect 0.5s ease-out;
        }
        @keyframes bubbleEffect {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .wrong { background: #ff4d4d !important; color: white; }
        .btn-finish {
            width: 100%; padding: 15px; background: transparent; border: 2px solid #00ff99;
            color: #00ff99; border-radius: 15px; cursor: pointer; margin-top: 20px;
            font-weight: bold; transition: 0.3s;
        }
        .btn-finish:hover { background: #00ff99; color: black; }

        .closed-input {
            width: 100%; padding: 15px; margin-top: 10px; border: 2px solid #333;
            border-radius: 12px; font-size: 17px; outline: none; background: #2a2a2a;
            color: white;
        }
        .closed-input:focus { border-color: #00ff99; }
        .btn-check {
            width: 100%; padding: 15px; margin-top: 15px; border: 2px solid #00ff99; border-radius: 15px;
            background: transparent; color: #00ff99; font-weight: bold; cursor: pointer; font-size: 17px;
            transition: 0.3s;
        }
        .btn-check:hover { background: #00ff99; color: black; }
        #closed-result { margin-top: 15px; font-size: 18px; min-height: 30px; text-align: center; }


        /* ===== Mobil to'liq ekran tuzatishlari ===== */
        @media (max-width: 480px) {
            body { padding: 12px; }
            #select-screen { padding: 35px 16px 24px 16px; }
            #select-screen h1 { font-size: 20px; }
            .gold-badge { width: 68px; height: 68px; font-size: 30px; }
            #mode-screen h1 { font-size: 19px; }
            .mode-wrapper { padding: 20px 14px; }
            .mode-card { padding: 22px 10px; font-size: 14px; }
            .quiz-box { padding: 20px 16px; margin-top: 30px; }
            h2 { font-size: 18px; }
            .content-box h1 { font-size: 24px !important; }
            .quran-ayat-text { font-size: 15px; }
            #countdown { font-size: 60px; bottom: 35px; }
            .number-grid { grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); }
        }
    </style>
</head>
<body>

<div id="stars"></div>

<div id="select-screen">
    <div class="gold-badge">📖</div>
    <h1>🌙 Umumumiy quiz test va yopiq savol-javoblar</h1>
    <p>Savollar sonini belgilang</p>

    <div class="random-section">
        <button class="random-main-btn" id="randomToggleBtn" onclick="toggleRandomGrid()">🎲 Random</button>
        <div class="random-options-grid" id="randomOptionsGrid"></div>
        <button class="clear-history-link" onclick="clearUsedHistory()">🔄 Ishlatilgan tarixni tozalash</button>
    </div>

    <div id="range-info">Boshlang'ich raqamni tanlang</div>
    <div class="number-grid" id="numberGrid"></div>
</div>

<div id="mode-screen">
    <div class="mode-icon-top">
        <img src="sayr.jpg" alt="rasm">
    </div>
    <h1>Qaysi funksiyani xohlaysiz?</h1>
    <div class="mode-wrapper">
        <div class="mode-grid">
            <div class="mode-card" onclick="chooseMode('quiz')">Quiz testlar</div>
            <div class="mode-card" onclick="chooseMode('quiz-aralash')">Quiz aralash</div>
            <div class="mode-card" onclick="chooseMode('yopiq')">Yopiq savol-javob</div>
            <div class="mode-card" onclick="chooseMode('yopiq-aralash')">Yopiq savol-javob aralash</div>
        </div>
    </div>
</div>

<div id="intro-screen">
    <div class="content-box">
        <h1 style="color:#00ff99; font-size: 32px;">🌙 2-Bob.Iskandar-1</h1>
        <div id="random-ayat"></div>
    </div>
    <div id="countdown">3</div>
</div>

<div class="quiz-box" id="quiz">
    <h2 id="question">Yuklanmoqda...</h2>
    <div id="options"></div>
    <button class="btn-finish" onclick="finishQuiz()">Testni yakunlash</button>
</div>

<script>
const quizData = [

   /* =====1-qism ===== */
{ q: "Asli u novcha-darozgina edi, lekin uzluksiz og‘ir va qora mehnat oqibatida tarashadek qotib ketgan qadqomati xiyla bukilib qolganidan oldinga osilib turgan uzun-uzun qo‘llari tizzasiga tegay-tegay der, nafaqat qadqomati, balki diydasi ham qotib ketgan, uncha-muncha gap-so‘zga ta’sirlanavermas ham edi ta'rif kim haqida", correct: "Sizif haqida", wrongs: ["Tanatos haqida", "Zevs haqida", "Kronos haqida"] },
{ q: "butkul qismatim mujassam bu hikmatda deb hayratlanar Sizif qaysi hikmatda", correct: "Qalb tubidan chiqqan yoxud astoydil hayqirib aytilgan gap beta’sir qolmas", wrongs: ["Sukut saqlagan odamning kuchi cheksiz bo'ladi", "Har bir xarsangtoshning o'z taqdiri bor", "Yolg'iz odam hech qachon yengilmaydi"] },
{ q: "ba’zan ro‘parasida qad rostlagan tog‘-\nu toshning, ayniqsa, yonginasida qo‘qqayib turgan kimning qulog‘iga yetib borarmikan degan umidda uni ba’zan baralla –\novozining boricha baqirib-hayqirib, ba’zan esa shivirlab aytardi.", correct: "xarsangtoshning", wrongs: ["cho‘qqining", "sangtaroshning", "qayiqchi cholning"] },
{ q: "Hoy, Sizi-if, yalqovlikni bas qil, qara, kim intizor senga,", correct: "xarsangtosh!...", wrongs: ["cho‘qqi!...", "tog‘!...", "yalanglik!..."] },
{ q: "Sizifning sha’niga istalgan malomat toshini otsinlar, chidaydi, illo qanaqa degan ta’na tavqi la’natdek eshitildi qulog‘iga,", correct: "yalqov", wrongs: ["qo‘rqoq", "gunohkor", "xabardor"] },
{ q: "bu jazo oshyonining har lahza-har soniyasi nimadan yaratilgan bo‘lsa!", correct: "mehnatdan, mashaqqatdan, uqubatdan", wrongs: ["g‘am-g‘ussadan, hasratdan, armondan", "sukunatdan, yolg‘izlikdan, sog‘inchdan", "kutish, umid va sabrdan"] },
{ q: "yaqin-yaqindan u tilga kiradigan odat chiqardi va Sizifga qadrdon allakimning juda-juda tanish tovushida to‘satdan sassado taratadigan bo‘lib qoldi.kim", correct: "Xarsangtosh", wrongs: ["Tanatos", "Qayiqchi chol", "Sangtarosh"] },
{ q: "“Ha-a yumaloq, ha-a dumaloq, ha-a baqaloq kimga qarata aytilgan", correct: "Xarsangtoshga", wrongs: ["Eginaga", "Sizifga", "Briareyga"] },
{ q: "Sizif odatda xarsangga tarmashgan damlarda nimaga harakat qiladi, chunki jismoniy quvvatimni so‘rib oladi deb xavotirlanadi,", correct: "o‘ylamaslikka", wrongs: ["shoshilmaslikka", "orqaga qaramaslikka", "gapirmaslikka"] },
{ q: "uning uchun nima muqaddasroq, muhimroq, savobliroq burch, maqsad-vazifa qolmaydi.", correct: "xarsangtoshni tepalik sari dumalatishdan", wrongs: ["Korinf qal’asini mustahkamlashdan", "Zevsga qarshi turishdan", "o‘z irodasini sinashdan"] },
{ q: "xarsangtoshdan ko‘ra qop-qora bulutga to‘yingan nimalari yuz, ming karra og‘irroq, zalvorliroq tuyuladi Sizifga", correct: "o‘y-xayollari", wrongs: ["gunohlari", "kechagi kunlari", "orzu-armonlari"] },
{ q: "Sizifga –\nxarsang va nima qadrdonlashib olsa bormi, Sizif yolg‘iz, nochor va abgor bir holatga tushar, halizamon ular ikkov jipslashib men tanhoni naq majaqlab ta", correct: "xayol", wrongs: ["sukunat", "qorong‘ulik", "taqdir"] },
{ q: "Nima uning yagona maqsad-maslagiga, umrining ma’no-mazmuniga aylanib ketganini biron lahza unutmaydi", correct: "xarsangtoshni ho-ov anavi cho‘qqiga olib chiqish", wrongs: ["Korinf devorlarini mustahkamlash", "Zevsdan o‘ch olish", "Eginani qidirib topish"] },
{ q: "xotinini nomahram nazardan qizg‘angan erkakdek xarsangtoshning metin vujudi bilan apoq-chapoqlashib ketgan nimalarini amallab undan ayiradi.", correct: "xayollarini", wrongs: ["dog‘-dug‘larini", "izlarini", "sirlarini"] },
{ q: "Xarsangtoshning yerga qadalib turgan joyidan osongina harakatga tushishi, qarichbaqarich yuqoriga qarab o‘rmalashini ham nimaning ajri deb biladi Sizif.", correct: "o‘sha taqdir va o‘sha qismatga sog‘lom va sadoqatli munosabatining", wrongs: ["o‘zining jismoniy kuch-qudratining", "xarsangtoshning yumaloq shaklining", "Zevsning marhamatining"] },
{ q: "Aslida esa nima sabab bir turtki kifoya xarsangtoshni oson yumalashi uchun", correct: "cho‘qqi ostonasidagi yalanglik bir qadar ravon, sathi bir qadar nishab ekanligi bois", wrongs: ["xarsangtoshning tagi silliq yo‘nilganligi bois", "Sizifning kuchi ortib borayotgani bois", "yo‘lning qisqarib qolgani bois"] },
{ q: "xarsangtoshni oson yumalashini sizifga qanday tuyuladi", correct: "qir bag‘rida sirpanchiq uchayotgan bolakayning chanasi yanglig‘ silliqqina, beozorgina sirpanib ko‘tariladigandek", wrongs: ["shamolda uchayotgan qushdek yengil va erkin", "suv yuzida suzayotgan qayiqdek ravon", "tog‘dan pastga qarab yumalayotgan qordek tez"] },
{ q: "Sizif qarsak chalib yubordi va nimaji quchoqlab oldi, barakalla, deya uning yelkasiga shapatilab qo‘ydi, uni silabsiypaladi, yumaloqqinam, dumaloqqinam, baqaloqqinam deya, duch kelgan joyiga betini bosib onasining momiq bag‘riga singib ketayotgan mushukcha\nerkalandi", correct: "Xarsangtoshni", wrongs: ["Cho‘qqini", "Eginani", "Sangtaroshni"] },
{ q: "Vaholanki, og‘ir, mashaqqatu uqubatlar so‘qmog‘i boshlanajak mana shu kaftekkina nishab yalanglik ko‘ndalangiga, nari borsa, qancha odimdan oshmas,", correct: "olti-yetti", wrongs: ["uch-to‘rt", "sakkiz-o‘n", "o‘n-o‘n ikki"] },
{ q: "nima ko‘nikmaga yoinki ko‘nikma nimaga aylandimi, vassalom, uning zarracha og‘irligi sezilmaydi odamga", correct: "Odat", wrongs: ["Iroda", "Sabr", "Mehnat"] },
{ q: "binobarin, hech bir nima o‘ziga ixlos qo‘ygan qavm imkoniyatlari bilan hisoblashmaydi. Aksincha, uning hatto mashaqqatu uqubatlari ushbu qavm kishilariga rohat, adoqsiz rohat-farog‘at bag‘ishlaydi! Oh-ho-o, odatlanish nimalarga qodir emas, yaxshilar!..", correct: "urf-odat", wrongs: ["taqdir", "iroda", "e’tiqod"] },
{ q: "xarsangtoshni yana uch-to‘rt, ba’zan qancha odimlar masofaga olib chiqishda qiyinchilik nima ekanini deyarli bilmaydi.", correct: "8-10", wrongs: ["4-5", "12-15", "20-25"] },
{ q: "Sizif nimani xarsangtoshning tagiga pona o‘rnida suqib turadi, to‘satdan u muvozanatini yo‘qotib, pastga qarab sho‘ng‘ib qolmasligi uchun", correct: "Oyog'ining uchini", wrongs: ["Kaftini", "Tayog‘ini", "Tirsagini"] },
{ q: "Nima toshning pastga qarab quyunday otilishi bilan yakun topdi 1 necha daf'a", correct: "nafas rostlash istagidagi bir lahzalik parishonlik", wrongs: ["oyoq tagining sirpanib ketishi", "kuchning birdan qurishi", "orqaga bir nafas o‘girilib qarash"] },

 { q: "u nimani allaqachonlar unutib yuborgan edi...", correct: "Vaqtni", wrongs: ["Umidni", "Sabrni", "O‘zini"] },

let activeQuiz = [];
let currentQ = 0, score = 0, answered = 0;
const RANDOM_PRESETS = [10, 15, 25, 33, 50, 100];
const USED_KEY = 'quizUsedIndices_2bob';

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function getUsedIndices() {
    try {
        return JSON.parse(localStorage.getItem(USED_KEY) || '[]');
    } catch (e) {
        return [];
    }
}

function saveUsedIndices(arr) {
    localStorage.setItem(USED_KEY, JSON.stringify(arr));
}

function buildStars() {
    const container = document.getElementById('stars');
    container.innerHTML = '';
    const count = 130;
    for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        const isGlow = Math.random() > 0.8;
        s.className = 'star' + (isGlow ? ' glow' : '');
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        const size = (isGlow ? (Math.random() * 1.5 + 2) : (Math.random() * 2 + 1)).toFixed(1);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.animationDelay = (Math.random() * 2.5).toFixed(2) + 's';
        s.style.animationDuration = (1.5 + Math.random() * 2).toFixed(2) + 's';
        container.appendChild(s);
    }
}

let rangeStart = null;
let numButtons = [];

window.onload = function() {
    const grid = document.getElementById('numberGrid');
    for (let i = 1; i <= quizData.length; i++) {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.innerText = i;
        btn.onclick = () => pickNumber(i, btn);
        grid.appendChild(btn);
        numButtons.push(btn);
    }
    buildStars();

    // Random preset tugmalarini yaratish
    const randGrid = document.getElementById('randomOptionsGrid');
    RANDOM_PRESETS.forEach(n => {
        const btn = document.createElement('button');
        btn.className = 'random-num-btn';
        btn.innerText = n;
        btn.onclick = () => pickRandomCount(n);
        randGrid.appendChild(btn);
    });

    // Oldin ishlatilgan savollarni sariq rangda belgilab qo'yish
    markUsedButtons();

    const randomIdx = Math.floor(Math.random() * ayats.length);
    const selectedAyat = ayats[randomIdx];
    document.getElementById('random-ayat').innerHTML = `
        <div class="quran-box">
            <span class="quran-ayat-text">"${selectedAyat.text}"</span>
            <span class="quran-meta">${selectedAyat.meta}</span>
        </div>
    `;
};

function markUsedButtons() {
    const used = getUsedIndices();
    used.forEach(idx => {
        if (numButtons[idx]) numButtons[idx].classList.add('picked');
    });
}

function toggleRandomGrid() {
    const grid = document.getElementById('randomOptionsGrid');
    grid.style.display = (grid.style.display === 'grid') ? 'none' : 'grid';
}

function pickRandomCount(n) {
    let used = getUsedIndices();
    const allIndices = quizData.map((_, i) => i);
    let unused = allIndices.filter(i => !used.includes(i));

    // Agar ishlatilmagan savollar yetarli bo'lmasa, tarixni yangilaymiz (yangi aylanish boshlanadi)
    if (unused.length < n) {
        used = [];
        unused = allIndices;
    }

    const shuffledUnused = shuffle([...unused]);
    const selected = shuffledUnused.slice(0, n);

    // Tanlanganlarni "ishlatilgan" deb belgilaymiz va saqlaymiz
    used = [...used, ...selected];
    saveUsedIndices(used);

    // Savollarni asl tartibda joylaymiz
    const orderedSelected = [...selected].sort((a, b) => a - b);
    activeQuiz = orderedSelected.map(i => quizData[i]);

    // Tanlangan raqam tugmalarini sariq rangga bo'yash
    selected.forEach(i => {
        if (numButtons[i]) numButtons[i].classList.add('picked');
    });

    document.getElementById('range-info').innerText = `Tasodifiy tanlandi: ${n} ta savol`;

    setTimeout(() => {
        document.getElementById('select-screen').style.display = 'none';
        document.getElementById('mode-screen').style.display = 'flex';
    }, 500);
}

function clearUsedHistory() {
    localStorage.removeItem(USED_KEY);
    numButtons.forEach(btn => btn.classList.remove('picked'));
    document.getElementById('range-info').innerText = "Tarix tozalandi. Boshlang'ich raqamni tanlang";
}

function pickNumber(num, btnEl) {
    const info = document.getElementById('range-info');

    if (rangeStart === null) {
        rangeStart = num;
        btnEl.classList.add('picked');
        info.innerText = `Boshlang'ich: ${num}. Endi oxirgi raqamni tanlang`;
    } else {
        let start = rangeStart;
        let end = num;
        if (end < start) { const t = start; start = end; end = t; }
        btnEl.classList.add('picked');
        info.innerText = `Tanlandi: ${start} - ${end}`;
        setTimeout(() => startWithRange(start, end), 400);
    }
}

function startWithRange(start, end) {
    activeQuiz = quizData.slice(start - 1, end);
    document.getElementById('select-screen').style.display = 'none';
    document.getElementById('mode-screen').style.display = 'flex';
}

let quizMode = 'quiz';

function chooseMode(mode) {
    quizMode = mode;
    if (mode === 'quiz-aralash' || mode === 'yopiq-aralash') {
        activeQuiz = shuffle([...activeQuiz]);
    }
    document.getElementById('mode-screen').style.display = 'none';
    document.getElementById('intro-screen').style.display = 'flex';
    document.getElementById('intro-screen').style.opacity = '1';
    startTimer();
}

function startTimer() {
    let count = 3;
    let disp = document.getElementById("countdown");
    disp.innerText = count;
    let timer = setInterval(() => {
        count--;
        if (count > 0) {
            disp.innerText = count;
        } else if (count === 0) {
            disp.innerText = "Boshladik!";
        } else {
            clearInterval(timer);
            document.getElementById("intro-screen").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("intro-screen").style.display = "none";
                document.getElementById("quiz").style.display = "block";
                loadQ();
            }, 800);
        }
    }, 1000);
}

function getOptionsFor(qData) {
    return shuffle([qData.correct, ...qData.wrongs]);
}

function loadQ() {
    const qData = activeQuiz[currentQ];
    document.getElementById('question').innerText = `${currentQ + 1}/${activeQuiz.length}. ${qData.q}`;
    const optDiv = document.getElementById('options');
    optDiv.innerHTML = '';

    if (quizMode === 'yopiq' || quizMode === 'yopiq-aralash') {
        loadClosedQ(qData, optDiv);
    } else {
        loadMultipleChoiceQ(qData, optDiv);
    }
}

function loadMultipleChoiceQ(qData, optDiv) {
    let shuffledOptions = getOptionsFor(qData);

    shuffledOptions.forEach((opt) => {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.innerText = opt;
        btn.onclick = () => check(opt, btn, qData.correct);
        optDiv.appendChild(btn);
    });
}

function loadClosedQ(qData, optDiv) {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'closed-input';
    input.id = 'closed-answer';
    input.placeholder = 'Javob yozing...';
    input.onkeypress = (e) => { if (e.key === 'Enter') checkClosed(qData); };

    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn-check';
    checkBtn.innerText = 'Tekshirish';
    checkBtn.onclick = () => checkClosed(qData);

    const resultDiv = document.createElement('div');
    resultDiv.id = 'closed-result';

    optDiv.appendChild(input);
    optDiv.appendChild(checkBtn);
    optDiv.appendChild(resultDiv);

    input.focus();
}

function checkClosed(qData) {
    const inputEl = document.getElementById('closed-answer');
    const resultDiv = document.getElementById('closed-result');
    const user = inputEl.value.toLowerCase().trim();
    const correct = qData.correct.toLowerCase().trim();

    answered++;
    inputEl.disabled = true;
    document.querySelector('.btn-check').disabled = true;

    if (user === correct) {
        resultDiv.innerHTML = '<b style="color:#00ff99;">✅ To\'g\'ri</b>';
        score++;
    } else {
        resultDiv.innerHTML = '<b style="color:#ff4444;">❌ Noto\'g\'ri.</b><br> Javob: ' + qData.correct;
    }

    setTimeout(() => {
        currentQ++;
        if (currentQ < activeQuiz.length) loadQ();
        else finishQuiz();
    }, 2000);
}

function check(selected, element, correct) {
    const options = element.parentElement.querySelectorAll('.option');
    options.forEach(opt => opt.style.pointerEvents = 'none');
    answered++;

    if (selected === correct) {
        element.classList.add('correct');
        score++;
    } else {
        element.classList.add('wrong');
        options.forEach(opt => {
            if (opt.innerText === correct) opt.classList.add('correct');
        });
    }
    setTimeout(() => {
        currentQ++;
        if (currentQ < activeQuiz.length) loadQ();
        else finishQuiz();
    }, 1000);
}

function finishQuiz() {
    let wrong = answered - score;
    document.getElementById('quiz').innerHTML = `
        <h2>Natijalar</h2>
        <div style="line-height: 2.2; font-size: 19px;">
            Jami savollar: <b>${activeQuiz.length} ta</b><br>
            To'g'ri javoblar: <span style="color:#00ff99;">${score} ta</span><br>
            Xato javoblar: <span style="color:#ff4d4d;">${wrong} ta</span>
        </div>
        <button class="btn-finish" onclick="location.reload()">Qaytadan boshlash</button>
    `;
}
</script>
</body>
</html>
