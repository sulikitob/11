<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundarija</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: auto;
    min-height: 100%;
  }

  body {
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;   /* mobil ekranda tepadan boshlab to'liq ko'rinsin */
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto;          /* ekrandan uzunroq bo'lsa scroll bo'lsin, kesilib qolmasin */
    padding: 40px 16px;
  }

  /* stars background */
  .stars {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
    animation-name: twinkle;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }
  .star.glow {
    box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.8);
  }

  @keyframes twinkle {
    0%   { opacity: 0.15; transform: scale(0.7); }
    50%  { opacity: 1;    transform: scale(1.3); }
    100% { opacity: 0.15; transform: scale(0.7); }
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* top image, centered above the title box */
  .top-image {
    width: 130px;
    height: 210px;
    border-radius: 14px;
    background: radial-gradient(circle at 35% 30%, #2e2e2e, #0f0f0f 70%);
    border: 3px solid #ffcc00;
    box-shadow: 0 0 18px rgba(255, 204, 0, 0.55), 0 0 40px rgba(255, 204, 0, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: -34px;
    z-index: 3;
    overflow: hidden;
    flex-shrink: 0;
  }
  .top-image .book-icon {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .card {
    position: relative;
    width: 100%;
    background: #0d0d0d;
    border: 2px solid #ffcc00;
    border-radius: 26px;
    box-shadow: 0 0 25px rgba(255, 204, 0, 0.35), inset 0 0 40px rgba(255, 204, 0, 0.03);
    padding: 68px 40px 32px 40px;
  }

  .title-box {
    text-align: center;
    margin-bottom: 28px;
  }
  .title-box h1 {
    color: #ffffff;
    font-size: 30px;
    letter-spacing: 4px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    text-transform: uppercase;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
  }
  .title-box h1 .icon-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead tr {
    background: #123326;
  }
  thead th {
    text-align: left;
    color: #2ecc71;
    font-size: 14px;
    letter-spacing: 0.5px;
    font-weight: 700;
    padding: 14px 18px;
    text-transform: uppercase;
    border-bottom: 2px solid #2ecc71;
  }
  thead th:first-child {
    width: 60px;
    text-align: center;
  }
  thead th:last-child {
    text-align: right;
  }

  tbody td {
    padding: 16px 18px;
    color: #f2f2f2;
    font-size: 15px;
  }
  tbody td:first-child {
    text-align: center;
    color: #dddddd;
  }
  tbody td:last-child {
    text-align: right;
    color: #fbfbfb;
    font-weight: 700;
  }
  tbody tr:nth-child(even) {
    background: rgba(255, 255, 255, 0.03);
  }

  tfoot td {
    padding: 18px 18px 6px 18px;
    border-top: 2px solid #ffcc00;
  }
  tfoot td:first-child {
    color: #ffffff;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-align: left;
  }
  tfoot .jami-label {
    text-transform: uppercase;
  }
  tfoot td:last-child {
    text-align: right;
    color: #ffffff;
    font-weight: 800;
    font-size: 17px;
  }

  @media (max-width: 640px) {
    body { padding: 30px 10px 50px 10px; }
    .card { padding: 60px 14px 24px 14px; border-radius: 18px; }
    .title-box h1 { font-size: 17px; letter-spacing: 2px; }
    thead th, tbody td, tfoot td { padding: 10px 8px; font-size: 13px; }
    .top-image { width: 100px; height: 160px; margin-bottom: -28px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="wrap">
  <div class="top-image">
    <!-- Bu yerga istalgan rasmni qo'yishingiz mumkin: src qismini o'zgartiring -->
    <img class="book-icon" src="donishmadn.jpg.jpg" alt="Rasm">
  </div>

  <div class="card">
    <div class="title-box">
      <h1><span class="icon-box"></span> Donishmand Sizif  <br>Savol-javoblar statistikasi<br></h1>
    </div>

    <table>
      <thead>
        <tr>
          <th>№</th>
          <th>BOB NOMI</th>
          <th>SAVOLLAR SONI</th>
        </tr>
      </thead>
      <tbody>
          <tr><td>1</td><td>1-qism</td><td>158</td></tr>
          <tr><td>2</td><td>2-qism</td><td>52</td></tr>
          <tr><td>3</td><td>3-qism</td><td>40</td></tr>

      </tbody>
      <tfoot>
        <tr>
          <td class="jami-label">JAMI</td>
          <td></td>
          <td>250</td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>

<script>
  // random twinkling stars generator
  const starsContainer = document.getElementById('stars');
  const starCount = 140;
  for (let i = 0; i < starCount; i++) {
    const star = document.createElement('div');
    const roll = Math.random();
    let extraClass = '';
    let size = Math.random() * 1.6 + 0.8;

    if (roll > 0.75) {
      extraClass = 'glow';
      size = Math.random() * 1.5 + 1.5;
    }

    star.className = 'star' + (extraClass ? ' ' + extraClass : '');
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';

    const duration = Math.random() * 3 + 2; // 2s - 5s
    const delay = Math.random() * 5;
    star.style.animationDuration = duration + 's';
    star.style.animationDelay = delay + 's';

    starsContainer.appendChild(star);
  }
</script>

</body>
</html>
