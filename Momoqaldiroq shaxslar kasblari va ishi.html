<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kasblar - kim bo'lib ishlaydi</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; min-height: 100%; }
body {
    font-family: 'Segoe UI', 'Arial', sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #161616, #0a0a0a 60%);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
    min-height: 100dvh;
}

#stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
}
.star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2.5s infinite ease-in-out;
}
.star.glow {
    box-shadow: 0 0 6px 1px rgba(255, 215, 0, 0.5);
}
@keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.6); }
}

.gold-badge {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2e2e2e, #0f0f0f 70%);
    border: 3px solid #ffd700;
    box-shadow: 0 0 18px rgba(255,215,0,0.55), 0 0 40px rgba(255,215,0,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    margin-bottom: -8px;
    position: relative; z-index: 3;
}

.wrap {
    position: relative; z-index: 2;
    width: 100%; max-width: 750px;
    display: flex; flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 45px 30px 35px 30px;
    background: linear-gradient(160deg, rgba(16,16,16,0.55), rgba(10,10,10,0.55));
    backdrop-filter: blur(1px);
    border: 2px solid #ffd700;
    border-radius: 26px;
    box-shadow: 0 0 30px rgba(255,215,0,0.22), inset 0 0 40px rgba(255,215,0,0.03);
}

h1 {
    font-size: 22px; color: #ffffff; text-align: center;
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(255,255,255,0.3);
    width: 100%;
}
p.sub { color: #999; font-size: 13px; text-align: center; margin-top: -10px; }

.list-search {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 2px solid #333;
    background: #1b1b1b;
    color: white;
    font-size: 15px;
    outline: none;
}
.list-search:focus { border-color: #00ff99; }
.list-counter { color: #999; font-size: 13px; text-align: center; }

.qa-list { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.qa-card {
    position: relative;
    background: linear-gradient(150deg, #1c1c1c, #141414);
    border: 1px solid rgba(0, 255, 153, 0.28);
    border-radius: 16px;
    padding: 18px 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    transition: 0.25s;
}
.qa-card:hover {
    border-color: rgba(0,255,153,0.6);
    box-shadow: 0 0 18px rgba(0,255,153,0.15);
}
.qa-num {
    display: inline-block;
    color: #050505;
    background: #00ff99;
    font-size: 12px;
    font-weight: bold;
    border-radius: 8px;
    padding: 2px 9px;
    margin-bottom: 8px;
}
.qa-question { color: #f0f0f0; font-size: 15.5px; line-height: 1.5; font-style: italic; margin-bottom: 10px; }
.qa-answer {
    color: #00ff99;
    font-size: 16px;
    font-weight: bold;
    border-top: 1px dashed rgba(0,255,153,0.25);
    padding-top: 10px;
}
.qa-answer b { color: #ffd700; }

.bob-title {
    width: 100%;
    text-align: left;
    color: #ffd700;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.5px;
    margin-top: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(255,215,0,0.25);
}

@media (max-width: 480px) {
    body { padding: 12px; }
    .wrap { padding: 35px 16px 24px 16px; }
    h1 { font-size: 19px; }
    .gold-badge { width: 68px; height: 68px; font-size: 30px; }
}
</style>
</head>
<body>
<div id="stars"></div>
<div class="wrap">
    <div class="gold-badge">💼</div>
    <h1>💼 Kasblar - kim bo'lib ishlaydi?</h1>
    <p class="sub">Shaxslarning kasbi, lavozimi va vazifasiga oid barcha savol-javoblar</p>

    <input type="text" class="list-search" id="listSearch" placeholder="Ism yoki kasb bo'yicha qidirish..." oninput="renderList()">
    <div class="list-counter" id="listCounterAll"></div>
    <div class="qa-list" id="qaList"></div>
</div>

<script>
const kasblar = [
{ bob: "2-Bob", q: "Xoji bobo qayerda ishlar edi?", a: "Komunal xo'jalik idorasiga rahbarlik qilar edi" },
{ bob: "2-Bob", q: "U paytlar Xoji boboni kim deb atashar edi?", a: "Oqsoqol" },
{ bob: "2-Bob", q: "Xoji bobo yana kim bo'lib ishlagan?", a: "Viloyat oqsoqollariga boshliq" },
{ bob: "2-Bob", q: "Prokuraturada Iskandar kim bo'lib ishlar edi?", a: "Muovin" },
{ bob: "2-Bob", q: "Xoji bobo Jiydalida kim bo'lib ishlagan?", a: "Sarkotib" },
{ bob: "2-Bob", q: "Iskandarning otasi kim edi?", a: "Ko'mirchi" },
{ bob: "2-Bob", q: "Mayram beva 2 yetimchasini nima qilib boqqan?", a: "Chevarlik qilib" },
{ bob: "2-Bob", q: "Necha yildirki katta do'xtirlikni yig'ishtirib boyvuchcha sifat bo'lib uyda o'tirgan kim?", a: "Dilrabo" },
{ bob: "2-Bob", q: "Maktab direktori bo'lib ishlaydigan shirinso'z, baqaloq xotin kim?", a: "O'lmas xola" },

{ bob: "3-Bob (Oyravshan-1)", q: "Bosh muxarrir o'rinbosari ismi kim?", a: "Jamolzoda" },
{ bob: "3-Bob (Oyravshan-1)", q: "Oyravshanning otasining kasbi nima?", a: "Adabiyot muallimi" },
{ bob: "3-Bob (Oyravshan-1)", q: "Umrida birorta ham she'ru hikoya yozmasdan adabiyot bo'limining mudiri bo'lib yurgan ochiqko'ngil kim?", a: "Opa Zamira" },
{ bob: "3-Bob (Oyravshan-1)", q: "Opa qanday fabrikada ishlagan?", a: "Tekstilkombinatda" },
{ bob: "3-Bob (Oyravshan-1)", q: "Opa tekstilkombinat fabrikada nima ish qilgan?", a: "To'quvchilik" },
{ bob: "3-Bob (Oyravshan-1)", q: "Jurnalning farroshi kim?", a: "Muntazam Jamolzoda" },

{ bob: "4-Bob (G'ayrat-1)", q: "G'ayrat o'qishni bitirib kelgach qanday idoraga ishga joylashgan?", a: "Elektr ulashuvchi idoraga" },
{ bob: "4-Bob (G'ayrat-1)", q: "Bu idorada yagona o'qib kelgan injener kim?", a: "G'ayrat" },
{ bob: "4-Bob (G'ayrat-1)", q: "Avvalgi bosh injener kim edi?", a: "Toshtemir Chaqqon" },
{ bob: "4-Bob (G'ayrat-1)", q: "60-yillari Juma To'qsabo' MTSga qanday lavozimga tayinlanadi?", a: "Direktor" },
{ bob: "4-Bob (G'ayrat-1)", q: "To'qsabo'ning kotibining ismi kim edi?", a: "Gulsara" },
{ bob: "4-Bob (G'ayrat-1)", q: "Komsomolning-kamolotning kattasiman deb yuradigan odam kim?", a: "Azamat" },

{ bob: "5-Bob (Oyravshan-3)", q: "Maktabning peshqadami, bitiruvchi, komsomol tashkilotining kotibi kim?", a: "G'ayrat" },
{ bob: "5-Bob (Oyravshan-3)", q: "Operator kim?", a: "Davron" },
{ bob: "5-Bob (Oyravshan-3)", q: "Shofyor kim?", a: "Vasya" },
{ bob: "5-Bob (Oyravshan-3)", q: "Rejissyor qizning ismi kim?", a: "Ashura" },
{ bob: "5-Bob (Oyravshan-3)", q: "Televideniya qizlaridan dimog'dor kim?", a: "Saidaxon" },
{ bob: "5-Bob (Oyravshan-3)", q: "Rais boboning quli-yugurdagi kim?", a: "Mansur" },
{ bob: "5-Bob (Oyravshan-3)", q: "Farovonlik hissadorlik jamiyatining raisi qaysi sohadan chiqqan?", a: "Tarixchi-muallimlikdan" },
{ bob: "5-Bob (Oyravshan-3)", q: "Oyravshan bu bilangina ko'zlagan maqsadlariga erishib bo'lmasligini tushunib, boshqa yo'llarni qo'llab qayerga o'tdi?", a: "Ijtimoiy-siyosiy ko'rsatuvlar tahririyatiga" },
{ bob: "5-Bob (Oyravshan-3)", q: "Yura-yura yana bir sakrab, qayerning muxbiri bo'lib oldi?", a: "Parlament" },
{ bob: "5-Bob (Oyravshan-3)", q: "Xotin-qizlar vakillari kimlar edi?", a: "Xosiyatxon Boyevoy va Maorifdagi Alloyorova Sharofat" },
{ bob: "5-Bob (Oyravshan-3)", q: "Deputatlikka yana kimni nomzod qilib qo'yishdi yigitlardan?", a: "Shoyimardonov" },
{ bob: "5-Bob (Oyravshan-3)", q: "Shoyimardonov qaysi bo'limdan?", a: "Ma'naviyat" },
{ bob: "5-Bob (Oyravshan-3)", q: "Hokim nomzodlikka kimni taklif qiladi?", a: "Musulmonov" },
{ bob: "5-Bob (Oyravshan-3)", q: "Musulmonov qaysi bo'limdan?", a: "Moliya" },
{ bob: "5-Bob (Oyravshan-3)", q: "Nechi yil maktabda o'qituvchilik qilgan Xosiyatxon?", a: "2-3 yil" },
{ bob: "5-Bob (Oyravshan-3)", q: "Kim Xosiyatxonni hokimlikka ishga olgan edi?", a: "Shuhrat akasi" },
{ bob: "5-Bob (Oyravshan-3)", q: "Shuhrat akasi kim edi?", a: "Sobiq hokim" },
{ bob: "5-Bob (Oyravshan-3)", q: "Sobiq shirxo'j rais nega ishdan bo'shatilgan?", a: "Yer sotgani uchun" },
{ bob: "5-Bob (Oyravshan-3)", q: "Farovon hissadorlik jamiyatining ham, uning qoshidagi xususiy korxonaning boshlig'i ham kim edi?", a: "Qizaloq" },

{ bob: "6-Bob", q: "Birinchi qatori paydo bo'lgan xizmatdoshi-Fotografni chetga tortib quloqqoqdi qildi oyravshan kimni?", a: "Valerani" },
{ bob: "6-Bob", q: "Zebo jurnalining yangi sarkori kim?", a: "Muflixa" },

{ bob: "7-Bob (G'ayrat-2)", q: "G'ayratning yordamchisining ismi kim?", a: "Faxriddin" },
{ bob: "7-Bob (G'ayrat-2)", q: "G'ayratning Muovini kim?", a: "Abdukarim" },
{ bob: "7-Bob (G'ayrat-2)", q: "Kadrlar bo'yicha G'ayratning muovini kim?", a: "Burxon Aliyorov" },
{ bob: "7-Bob (G'ayrat-2)", q: "Burxon Aliyorov nechi yildan beri chiroqchilik nonini yeb kelar edi?", a: "20 yildan" },
{ bob: "7-Bob (G'ayrat-2)", q: "G'ayratning Quratori kim edi?", a: "Shoyimboyev Diyor" },
{ bob: "7-Bob (G'ayrat-2)", q: "Shoyimboyev Diyor kim bo'lib ishlaydi?", a: "Xokim muovini" },
{ bob: "7-Bob (G'ayrat-2)", q: "Diyor Shoyimboyev qaysi soha bo'yicha hokim muovini edi?", a: "Qurilish va Sanoat" },
{ bob: "7-Bob (G'ayrat-2)", q: "G'ayratning kotibasi kim?", a: "Zamira" },
{ bob: "7-Bob (G'ayrat-2)", q: "Vorisxon kim edi?", a: "Podpolkovnik" },
{ bob: "7-Bob (G'ayrat-2)", q: "Aytishlaricha hozir Toshkentga yuksalib ketgan akaxoni bir vaqtlar shu yerda kim bo'lib ishlagan?", a: "Boshqarma xo'jayini" },
{ bob: "7-Bob (G'ayrat-2)", q: "U qayerdadir shofyorlik qiladi, jussasi dum-damaloq, piyoladek-piyoladek ko'zlari go'yoki ichidagi musallasidan rang olgan, qontalash - kim?", a: "Ilhom aka" },
{ bob: "7-Bob (G'ayrat-2)", q: "Emine o'qishni tugatishga tugatdi-yu 1 kun ham sohasi bo'yicha ishlamadi, allaqayda sirtdan ta'lim olib kim bo'lib ishladi?", a: "Teatrshunos" },

{ bob: "8-Bob (Oyravshan-4)", q: "Oyravshan hozir qayerda ishlab yurgan edi?", a: "Parlament muxbiri bo'lib" },
{ bob: "8-Bob (Oyravshan-4)", q: "Qishloqqa ko'chib kelib, Oyravshan kim bo'lib ishlamoqchi ekanini aytdi?", a: "Maktab muallimasi" },

{ bob: "9-Bob (Iskandar-2)", q: "Iskandar kimning bir og'iz dalolati bilan mashhur qo'shma korxonaga maslahatchi bo'lib joylashib, non tashvishidan qutuldi?", a: "Lazizbek Qodirovning" },
{ bob: "9-Bob (Iskandar-2)", q: "Zo'rbank boshlig'ining ismi kim?", a: "Lazizbek Qodirov" },
{ bob: "9-Bob (Iskandar-2)", q: "Lazizbekning restoranida kim dastyorlik qilar edi?", a: "Xo'ja Xo'jayevich" },
{ bob: "9-Bob (Iskandar-2)", q: "Nozli shoira emas, kim edi?", a: "Matbuot kotibi" },
];

function buildStars() {
    const container = document.getElementById('stars');
    container.innerHTML = '';
    const count = 130;
    for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        const isGlow = Math.random() > 0.8;
        s.className = 'star' + (isGlow ? ' glow' : '');
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        const size = (isGlow ? (Math.random() * 1.5 + 2) : (Math.random() * 2 + 1)).toFixed(1);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.animationDelay = (Math.random() * 2.5).toFixed(2) + 's';
        s.style.animationDuration = (1.5 + Math.random() * 2).toFixed(2) + 's';
        container.appendChild(s);
    }
}

function renderList() {
    const query = document.getElementById('listSearch').value.trim().toLowerCase();
    const container = document.getElementById('qaList');
    container.innerHTML = '';

    const filtered = kasblar
        .map((item, idx) => ({ item, idx }))
        .filter(({ item }) => (item.q + ' ' + item.a).toLowerCase().includes(query));

    document.getElementById('listCounterAll').innerText = `${filtered.length} / ${kasblar.length} ta kasb savoli`;

    let lastBob = null;
    filtered.forEach(({ item, idx }) => {
        if (item.bob !== lastBob && query === '') {
            const bobEl = document.createElement('div');
            bobEl.className = 'bob-title';
            bobEl.innerText = item.bob;
            container.appendChild(bobEl);
            lastBob = item.bob;
        }
        const card = document.createElement('div');
        card.className = 'qa-card';
        card.innerHTML = `
            <span class="qa-num">${idx + 1} · ${item.bob}</span>
            <div class="qa-question">${item.q}</div>
            <div class="qa-answer"><b>Kasb/Lavozim:</b> ${item.a}</div>
        `;
        container.appendChild(card);
    });
}

buildStars();
renderList();
</script>
</body>
</html>
